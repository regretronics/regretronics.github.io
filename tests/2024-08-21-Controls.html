<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>HTML tests</title>
	<style type="text/css">/*<![CDATA[*/
	:root {
		color-scheme: dark;
		background-color: canvas;
		color: canvastext;
		font-size: 1.25em;
	}
	body {
		overflow-wrap: break-word; /* 2024-08: fix for Chrome vs. Ffx layout differences and Chrome layout bug */
	}

	input {
		font-size: 0.8em;
	}
	/* input[type="number"] {
		width: 8ch;
		text-align: right;
	} */

	button:checked {
		rotate: 90deg;
	}
	#txtTest1 {
		width: 6ch;
	}
	#txtTest2 {
		width: 10ch;
	}
	.spin-edit:has(.buttons-area) {
		#txtTest1 {
			width: 4ch;
		}
		#txtTest2 {
			width: 8ch;
		}
	}

	p > input[type=number]:not(.custom-spin) {
		appearance: textfield;

		::inner-spin-button, ::outer-spin-button {
			-webkit-appearance: none;
			appearance: none;
			display: none;
			opacity: 0;
		}
		::-webkit-inner-spin-button, ::-webkit-outer-spin-button {
			-webkit-appearance: none;
			appearance: none;
			display: none;
			opacity: 0;
		}
	}
	/*]]>*/</style>
	<link rel="stylesheet" type="text/css" href="custom-spin.css" />

	<script type="text/javascript" src="custom-spin.js"></script>
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	/* function pageLoaded(event) {
	} */
	function pageReady(event) {
		initSpinControls();
	}
	//window.addEventListener("DOMContentLoaded", pageLoaded);
	/* if(document.readyState === "loading")
		document.addEventListener("DOMContentLoaded", pageLoaded);
	else //DOMContentLoaded has already fired
		pageLoaded(); */
	window.addEventListener("load", pageReady);
	/*]]>*/</script>
</head>
<body>
	<p><button popovertarget="po">asfdasdf</button> <span id="po" popover>popover</span></p>

	<p><input type="checkbox" id="chkAudioCtx" /> <label for="chkAudioCtx">asdf</label></p>

	<p><input type="number" value="0" /></p>
	<p><input type="text" inputmode="numeric" pattern="\d*" value="0" /></p>

	<p>
		<span class="spin-edit"><input type="number" id="txtTest1" value="0" class="custom-spin" /></span>
		<output id="outPressure">0</output>
	</p>
	<p>
		<input type="number" id="txtTest2" value="0" class="custom-spin" />
	</p>
</body>
</html>
