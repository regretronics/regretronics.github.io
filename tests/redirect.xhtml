<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd" [
	<!ENTITY timeoutSecs "10">
	<!ENTITY navigationTarget "tests/redirect.xhtml">
]>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, height=device-height, minimum-scale=1" />
	<meta name="text-scale" content="scale" />

	<base href="../" />
	<link rel="icon" href="site-icon.svg" type="image/svg+xml" />
	<meta name="color-scheme" content="dark" />
	<meta name="theme-color" media="all" content="oklch(0.1875 0.015625 55deg)" />
	<meta http-equiv="refresh" content="&timeoutSecs;;url=&navigationTarget;" />

	<title>(Redirect)</title>
	<link rel="stylesheet" type="text/css" href="index.css" />
	<link rel="stylesheet" type="text/css" href="redirect.css" />
	<style type="text/css">
		:root {--timeout-secs: &timeoutSecs; ;}
	</style>
</head>
<body>
	<p>This page has moved. Redirecting in &timeoutSecs; seconds.
		<br /><span class="progress-box"><span class="fill-bar"></span></span>
	</p>
	<p>New location: &navigationTarget;
		<br /><a href="&navigationTarget;">Go there now</a></p>
	<p><a href="/">Go to home instead</a></p>
	<!-- <p class="code">
		<meta http-equiv="refresh" content="&timeoutSecs;;url=&navigationTarget;" />
	</p> -->
</body>
</html>
