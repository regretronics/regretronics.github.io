	<div><canvas id="cnvMainOutput" width="768" height="512">Graphics output. (If you are reading this through a user agent, it does not support HTML Canvas. This page can't display the graphics without Canvas.)</canvas></div>
	<script id="FS0" type="x-shader/x-fragment" class="script-visible">
	/*<![CDATA[*/
	#include <common>

	uniform vec3 iResolution;
	uniform float iTime;

	// By iq: https://www.shadertoy.com/user/iq
	// license: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.
	void mainImage(out vec4 fragColor, in vec2 fragCoord) {
		// Normalized pixel coordinates (from 0 to 1)
		vec2 uv = fragCoord / iResolution.xy;

		// Time varying pixel color
		vec3 col = 0.5 + 0.5 * cos(iTime + uv.xyx + vec3(0, 2, 4));

		// Output to screen
		fragColor = vec4(col, 1.0);
	}

	void main() {
		mainImage(gl_FragColor, gl_FragCoord.xy);
	}
	/*]]>*/</script>
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	function loaded() {
		const canvas = document.getElementById("cnvMainOutput");
		window.renderer = new THREE.WebGLRenderer({antialias: true, canvas});
		renderer.autoClearColor = false;
		window.canvasAspectRatio = canvas.width / canvas.height;
		canvas.parentElement.style.aspectRatio = canvasAspectRatio;

		window.camera = new THREE.OrthographicCamera(
			-1, // left
			1, // right
			1, // top
			-1, // bottom
			-1, // near
			1, // far
		);
		window.scene = new THREE.Scene();
		const plane = new THREE.PlaneGeometry(2, 2);

		/* const material = new THREE.MeshBasicMaterial({
			color: 'red',
		}); */
		const fragmentShader = document.getElementById("FS0").textContent.trim();
		window.uniforms = {
			iTime: {value: 0},
			iResolution: {value: new THREE.Vector3()},
		};
		const material = new THREE.ShaderMaterial({
			fragmentShader,
			uniforms,
		});
		scene.add(new THREE.Mesh(plane, material));

		/* function resizeRendererToDisplaySize(renderer) {

		requestAnimationFrame(render);

	function render(time) {
		time *= 0.001; // convert to seconds

		resizeRendererToDisplaySize(renderer);

		const canvas = renderer.domElement;
		uniforms.iResolution.value.set(canvas.width, canvas.height, 1);
		uniforms.iTime.value = time;

		renderer.render(scene, camera);

		requestAnimationFrame(render);
	}

	function pageLoaded(event) {
		if(window.THREE)
			loaded();
		else
			window.modulesLoaded = loaded;
	}
	if(document.readyState === "loading")
		document.addEventListener("DOMContentLoaded", pageLoaded);
