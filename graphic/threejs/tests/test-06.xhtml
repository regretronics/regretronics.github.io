	<script id="FS1" type="x-shader/x-fragment" class="script-visible">
	/*<![CDATA[*/
	#include <common>
	//#include <packing>

	uniform sampler2D target0;
	uniform sampler2D target0depth;

	uniform float cameraNear;
	uniform float cameraFar;

	out vec4 fragColor;

	#define opacityFactor -4.0

	void main() {
		float dz = gl_FragCoord.z - texelFetch(target0depth, ivec2(gl_FragCoord.xy), 0).x;
		if(dz <= 0.0) discard;
		//float z = (1.0 - gl_FragCoord.z) / near;
		//float z = (1.0 - texelFetch(target0depth, ivec2(gl_FragCoord.xy), 0).x) / near;
		//float z = gl_FragCoord.w;
		//z = gl_FragCoord.w - z;

		//fragColor = vec4(z, z, z, 1.0);
		//fragColor.rgb = vec3(z);
		//fragColor = texelFetch(target0, ivec2(gl_FragCoord.xy), 0) * (1.0 - exp2(-z));
		fragColor = texelFetch(target0, ivec2(gl_FragCoord.xy), 0);
		//fragColor = vec4(gl_FragCoord.z, gl_FragCoord.z, gl_FragCoord.z, 1.0);
		//fragColor = texelFetch(target0depth, ivec2(gl_FragCoord.xy), 0);
		//fragColor.a = 1.0;
		fragColor.a = 1.0 - exp2(opacityFactor * dz * cameraNear);
		//fragColor.a = 0.25;
	}
	/*]]>*/</script>
	<script type="text/javascript">
	"use strict";

	async function loadModules() {
		let loadRemote = location.protocol != "https:";
		if(!loadRemote) {
			try {
				window.THREE = await import('./three.module.js');
				console.log("three.js imported locally", THREE);
			} catch(error) {
				console.log(error);
				loadRemote = true;
			}
		}
		if(loadRemote) {
			window.THREE = await import('https://threejs.org/build/three.module.js');
			console.log("three.js imported remotely", THREE);
		}
		loaded();
	}
	loadModules();
	/* import('./three.module.js').then((value) => {
		console.log("import promise 1 then fulfilled", value);
		window.THREE = value;
	}, (reason) => {
		console.log("import promise 1 then rejected", reason);
		return import('https://threejs.org/build/three.module.js');
		//return await import('https://threejs.org/build/three.module.js');
	}).then((value) => {
		console.log("import promise 2 then fulfilled", value);
		window.THREE = value;
	}, (reason) => {
		console.log("import promise 2 then rejected", reason);
	}).catch((reason) => {
		console.log("import promise catch", reason);
	}); */

	var material0, uniforms1, material1;

	function loaded(event) {
		//console.log("Starting function 'loaded'", event);
		//console.log("THREE: ", THREE);
		window.canvas = document.querySelector('#c');
		window.renderer = new THREE.WebGLRenderer({/* antialias: true, */ depth: true, canvas});
		//renderer.setTransparentSort(null);
		window.canvasAspectRatio = canvas.width / canvas.height;
		canvas.parentElement.style.aspectRatio = canvasAspectRatio;
		window.camera = new THREE.PerspectiveCamera(75, canvasAspectRatio, 0.1, 3);

		window.scene = new THREE.Scene();
		window.geometry = new THREE.BoxGeometry(1, 1, 1);

		material0 = new THREE.MeshBasicMaterial({
			color: 0xff8000,
			//side: THREE.DoubleSide,
			//side: THREE.BackSide,
			//transparent: true,
			//opacity: 1.0
		});

		window.mesh = new THREE.Mesh(geometry, material0);
		scene.add(mesh);
		camera.position.z = 1.5;

		//new THREE.Vector2()
		//renderer.getDrawingBufferSize
		window.target0 = new THREE.WebGLRenderTarget(canvas.width, canvas.height, {format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: true});
		target0.depthTexture = new THREE.DepthTexture();
		target0.depthTexture.format = THREE.DepthFormat;
		target0.depthTexture.type = THREE.FloatType;

		uniforms1 = {
			//iResolution: { value: new THREE.Vector3() },
			target0: { value: target0.texture },
			target0depth: { value: target0.depthTexture },

			cameraNear: { value: 1.0 / camera.near },
			cameraFar: { value: 1.0 / camera.far },
		};
		material1 = new THREE.ShaderMaterial({
			glslVersion: THREE.GLSL3,
			fragmentShader: document.getElementById("FS1").textContent.trim(),
			uniforms: uniforms1,
			//side: THREE.DoubleSide,
			side: THREE.BackSide,
			transparent: true,
		});

		requestAnimationFrame(render);
	}

	function resizeRendererToDisplaySize(renderer) {
		const body = document.body;
		if(body.clientWidth / body.clientHeight > canvasAspectRatio) {
			body.classList.add("layout-horizontal");
			body.classList.remove("layout-vertical");
		} else {
			body.classList.add("layout-vertical");
			body.classList.remove("layout-horizontal");
		}

		const canvas = renderer.domElement;

		canvas.parentElement.style.zoom = 1 / devicePixelRatio;
		const widthAvailable = canvas.parentElement.clientWidth, heightAvailable = canvas.parentElement.clientHeight;
		//canvas.style.zoom = 1 / devicePixelRatio;
		//const widthAvailable = canvas.clientWidth, heightAvailable = canvas.clientHeight;

		/* const width = widthAvailable * devicePixelRatio;
		const height = heightAvailable * devicePixelRatio; */
		/* const width = Math.trunc(widthAvailable * devicePixelRatio);
		const height = Math.trunc(heightAvailable * devicePixelRatio); */
		const width = Math.trunc(Math.min(widthAvailable, heightAvailable * canvasAspectRatio));
		const height = Math.trunc(Math.min(heightAvailable, widthAvailable / canvasAspectRatio));
		const needResize = canvas.width !== width || canvas.height !== height;
		if(needResize) {
			renderer.setSize(width, height, false);
			//renderer.setDrawingBufferSize(width, height, 1);
			target0.setSize(width, height);
		}
		return needResize;
	}

	function render(time) {
		time *= 0.001; //convert to seconds

		mesh.rotation.x += 0.002;
		mesh.rotation.y += 0.002;

		resizeRendererToDisplaySize(renderer);

		const canvas = renderer.domElement;
		//uniforms1.iResolution.value.set(canvas.width, canvas.height, 1);

		//frontmost layer
		mesh.material = material0;
		renderer.setRenderTarget(target0);
		renderer.render(scene, camera);

		//next layer
		//uniforms1.target0.value = target0.texture;
		//uniforms1.target0depth.value = target0.depthTexture;
		mesh.material = material1;
		renderer.setRenderTarget(null);
		renderer.render(scene, camera);

		requestAnimationFrame(render);
	}

	//window.addEventListener("load", loaded);
	//loaded();
