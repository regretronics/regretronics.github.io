<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>SVG motion blur</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\<number\>";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes shuffle {
			to {--t: var(--range);}
		}

		:root {
			width: 100%;
			height: 100%;
			overflow: hidden;

			color-scheme: dark;
			background-color: black;
			--range: 1800;

			--ti: round(down, var(--t));
			--ti1: mod(var(--ti) + 1, var(--range));
			--ti2: mod(var(--ti) + 2, var(--range));
			--ti3: mod(var(--ti) + 3, var(--range));
			--tfrac: mod(var(--t), 1);
			--tfrac1: calc(1 - var(--tfrac));

			/*cubic spline piecewise functions*/
			--interp-hermite-00: calc((1 + 2 * var(--tfrac)) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-10: calc(0.735 * var(--tfrac) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-01: calc(var(--tfrac) * var(--tfrac) * (3 - 2 * var(--tfrac)));
			--interp-hermite-11: calc(-0.735 * var(--tfrac) * var(--tfrac) * var(--tfrac1));
			/*their derivatives, to quantify motion*/
			--interp-hermite-d00: calc(-6 * var(--tfrac) * var(--tfrac1));
			--interp-hermite-d10: calc(0.735 * (1 - 3 * var(--tfrac)) * var(--tfrac1));
			--interp-hermite-d01: calc(6 * var(--tfrac) * var(--tfrac1));
			--interp-hermite-d11: calc(0.735 * var(--tfrac) * (3 * var(--tfrac) - 2));

			/*PRNG parameters*/
			--rnd-ratio1: mod(sqrt(7), 1);
			--rnd-ratio2: mod(pow(349, 1 / 5), -1);
			--rnd-ratio3: mod(pow(3181, 1 / 3), 1);
			--rnd-exp1: calc(pi * 2 / 3);
			--rnd-exp2: calc(20 / 7);
			--rnd-exp3: calc(110 / 113);
			--rnd-offset: mod(pow(1451, 1 / 7), 1);

			/*why having several animations, instead of varying the duration? to switch continuously between them.*/
			animation-name: shuffle, shuffle, shuffle, shuffle, shuffle;
			animation-duration: 
				calc(3s * var(--range)), 
				calc(1.5s * var(--range)), 
				calc(0.75s * var(--range)), 
				calc(0.375s * var(--range)), 
				calc(0.1875s * var(--range));
			animation-iteration-count: infinite;
			animation-timing-function: linear;
			animation-play-state: paused;
			/* animation-composition: add; */
		}

		#selBodySpeed > :checked {
			:root:has(&[value="0"]) {animation-play-state: paused, paused, paused, paused, paused;}
			:root:has(&[value="1"]) {animation-play-state: running, paused, paused, paused, paused;}
			:root:has(&[value="2"]) {animation-play-state: paused, running, paused, paused, paused;}
			:root:has(&[value="4"]) {animation-play-state: paused, paused, running, paused, paused;}
			:root:has(&[value="8"]) {animation-play-state: paused, paused, paused, running, paused;}
			:root:has(&[value="16"]) {animation-play-state: paused, paused, paused, paused, running;}
		}
		#selBlurIntensity > :checked {
			:root:has(&[value="0"]) {--filter-blur: none;}
			:root:has(&[value="1"]) {--filter-blur: url("#blur1");}
			:root:has(&[value="2"]) {--filter-blur: url("#blur2");}
			:root:has(&[value="4"]) {--filter-blur: url("#blur4");}
			:root:has(&[value="8"]) {--filter-blur: url("#blur8");}
		}

		body {
			margin: 0;
			border: none;
			padding: 0;
			height: 100%;
			overflow: hidden;

			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			justify-content: center;
			align-items: stretch;
		}
		body, body > * {
			box-sizing: border-box;
		}
		body > :nth-child(1) {
			flex-basis: auto;
			flex-grow: 1;
			flex-shrink: 1;
		}
		body > :nth-child(2) {
			flex-grow: 0;
			flex-shrink: 0;
			padding-inline: min(1em, 2cqi);
			background-color: oklch(0.25 0 0deg);
		}

		#svg1 {
			width: 100%;
			height: 100%;
			/* overflow: hidden; */
			/* aspect-ratio: auto; */
		}
		#spriteContainer {
			filter: var(--filter-blur, url("#blur1"));

			--elem-count: 1;
			--i: 0;
			/*intermediate values*/
			--tilog-x: log(2 * (var(--ti) * var(--elem-count) + var(--i)) + pi);
			--ti1log-x: log(2 * (var(--ti1) * var(--elem-count) + var(--i)) + pi);
			--ti2log-x: log(2 * (var(--ti2) * var(--elem-count) + var(--i)) + pi);
			--ti3log-x: log(2 * (var(--ti3) * var(--elem-count) + var(--i)) + pi);
			--tilog-y: log(2 * (var(--ti) * var(--elem-count) + var(--i)) + 1 + pi);
			--ti1log-y: log(2 * (var(--ti1) * var(--elem-count) + var(--i)) + 1 + pi);
			--ti2log-y: log(2 * (var(--ti2) * var(--elem-count) + var(--i)) + 1 + pi);
			--ti3log-y: log(2 * (var(--ti3) * var(--elem-count) + var(--i)) + 1 + pi);

			/*PRNG application*/
			--rnd-x: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog-x)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog-x)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog-x)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-x: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1log-x)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1log-x)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1log-x)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-x: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2log-x)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2log-x)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2log-x)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-x: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3log-x)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3log-x)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3log-x)) 
				+ var(--rnd-offset), 
				1);
			--rnd-y: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog-y)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog-y)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog-y)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-y: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1log-y)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1log-y)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1log-y)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-y: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2log-y)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2log-y)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2log-y)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-y: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3log-y)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3log-y)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3log-y)) 
				+ var(--rnd-offset), 
				1);

			--rnd-interp-x: calc(
				var(--interp-hermite-00) * var(--rnd1-x)
				+ var(--interp-hermite-10) * (var(--rnd2-x) - var(--rnd-x))
				+ var(--interp-hermite-01) * var(--rnd2-x)
				+ var(--interp-hermite-11) * (var(--rnd3-x) - var(--rnd1-x))
				- 0.5
			);
			--rnd-interp-y: calc(
				var(--interp-hermite-00) * var(--rnd1-y)
				+ var(--interp-hermite-10) * (var(--rnd2-y) - var(--rnd-y))
				+ var(--interp-hermite-01) * var(--rnd2-y)
				+ var(--interp-hermite-11) * (var(--rnd3-y) - var(--rnd1-y))
				- 0.5
			);
			--rnd-interp-dx: calc(
				var(--interp-hermite-d00) * var(--rnd1-x)
				+ var(--interp-hermite-d10) * (var(--rnd2-x) - var(--rnd-x))
				+ var(--interp-hermite-d01) * var(--rnd2-x)
				+ var(--interp-hermite-d11) * (var(--rnd3-x) - var(--rnd1-x))
			);
			--rnd-interp-dy: calc(
				var(--interp-hermite-d00) * var(--rnd1-y)
				+ var(--interp-hermite-d10) * (var(--rnd2-y) - var(--rnd-y))
				+ var(--interp-hermite-d01) * var(--rnd2-y)
				+ var(--interp-hermite-d11) * (var(--rnd3-y) - var(--rnd1-y))
			);
			--tilt: atan2(-1 * var(--rnd-interp-dy), var(--rnd-interp-dx));
			--diagonal: hypot(var(--rnd-interp-dx), var(--rnd-interp-dy), 0.015625);

			/* x: var(--rnd-interp-x);
			y: var(--rnd-interp-y); */
			transform: 
				translate(calc(87.5% * var(--rnd-interp-x)), calc(87.5% * var(--rnd-interp-y))) 
				rotate(calc(-1 * var(--tilt))) 
				scale(var(--diagonal), 1);
			transform-origin: center;
		}
		/* #spriteKernel */ #smiley {
			transform: scale(calc(0.25 / var(--diagonal)), 0.25) rotate(var(--tilt));
			transform-origin: center;
		}
	/*]]>*/</style>
</head>
<body>
	<svg id="svg1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
		<defs>
			<filter id="blur1" filterUnits="objectBoundingBox" x="-0.0625" y="-0.125" width="1.125" height="1.25" primitiveUnits="userSpaceOnUse">
				<feGaussianBlur stdDeviation="0.0078125 0" color-interpolation-filters="sRGB" />
			</filter>
			<filter id="blur2" filterUnits="objectBoundingBox" x="-0.125" y="-0.125" width="1.25" height="1.25" primitiveUnits="userSpaceOnUse">
				<feGaussianBlur stdDeviation="0.015625 0" color-interpolation-filters="sRGB" />
			</filter>
			<filter id="blur4" filterUnits="objectBoundingBox" x="-0.25" y="-0.125" width="1.5" height="1.25" primitiveUnits="userSpaceOnUse">
				<feGaussianBlur stdDeviation="0.03125 0" color-interpolation-filters="sRGB" />
			</filter>
			<filter id="blur8" filterUnits="objectBoundingBox" x="-0.5" y="-0.125" width="2" height="1.25" primitiveUnits="userSpaceOnUse">
				<feGaussianBlur stdDeviation="0.0625 0" color-interpolation-filters="sRGB" />
			</filter>
			<!--<path id="smiley"
				d="M0.50,0.10 A0.40,0.40,1,1,1,0.50,0.90 A0.40,0.40,1,1,1,0.50,0.10 M0.30,0.40 Q0.36,0.35,0.42,0.40 M0.58,0.40 Q0.64,0.35,0.70,0.40 M0.30,0.60 Q0.50,0.75,0.70,0.60 Q0.50,0.75,0.30,0.60" fill="white" stroke="orange" stroke-width="0.03" />-->
		</defs>
		<!--<use id="spriteContainer" href="#smiley" filter="url('#blur')" />-->
		<!--<g id="spriteContainer" filter="url('#blur')">-->
		<g id="spriteContainer">
			<path id="smiley"
				d="M0.50,0.10 A0.40,0.40,1,1,1,0.50,0.90 A0.40,0.40,1,1,1,0.50,0.10 M0.30,0.40 Q0.36,0.35,0.42,0.40 M0.58,0.40 Q0.64,0.35,0.70,0.40 M0.30,0.60 Q0.50,0.75,0.70,0.60 Q0.50,0.75,0.30,0.60" fill="white" stroke="orange" stroke-width="0.03" />
		</g>
	</svg>
	<div>
		<p><label for="selBodySpeed">Speed:</label> 
			<select id="selBodySpeed">
				<option value="0">0x</option>
				<option value="1">1x</option>
				<option value="2" selected="selected">2x</option>
				<option value="4">4x</option>
				<option value="8">8x</option>
				<option value="16">16x</option>
			</select>
		</p>
		<p><label for="selBlurIntensity">Blur intensity:</label> 
			<select id="selBlurIntensity">
				<option value="0">0x</option>
				<option value="1">1x</option>
				<option value="2" selected="selected">2x</option>
				<option value="4">4x</option>
				<option value="8">8x</option>
			</select>
		</p>
	</div>
</body>
