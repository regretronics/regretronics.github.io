<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>Canvas, floating point/HDR</title>
	<style type="text/css">/*<![CDATA[*/
	:root {
		/* background-color: hsl(120, 25%, 12.5%); */
		/* color: hsl(120, 0%, 87.5%); */
		background-color: Canvas;
		color: CanvasText;
		color-scheme: dark;
	}
	body {
		margin: 0px;
	}

	#canvasContainer {
		text-align: center;
	}
	#canvasContainer canvas {
		object-fit: contain;
	}
	#canvasContainer canvas/*:not(:fullscreen)*/ {
		/* max-width: 98%;
		max-height: 98vh; */
		max-width: 100%;
		max-height: 100vh;
	}
	/* #canvasContainer canvas:fullscreen, :fullscreen #canvasContainer canvas {
		max-width: 100%;
		max-height: 100vh;
	} */
	p, body > pre {
		max-width: min(120ch, 100% - 3ch);
		margin-inline: auto;
	}

	@property --test-color {
		syntax: "\3c color\3e | auto";
		inherits: true;
		initial-value: auto;
	}
	#selColorSpace option {
		--test-color: color(attr(label type(*)) 0 0 0);
		background-color: if(
			style(--test-color: auto): oklch(0.25 0.125 25deg); 
			else: unset;);
		color: if(
			style(--test-color: auto): oklch(0.75 0.125 25deg); 
			else: unset;);

		/* &::after {
			content: if(
			style(--test-color: auto): " \002717"; 
			else: " \002713";);
		} */
	}

	input[type="number"] {
		/* width: 5em; */
		text-align: right;
		--step: attr(step type(<number>), 1);
		--digits: max(log(var(--step, 1), 0.5), log(var(--step, 1), 10));
		width: calc(5em/16 + 3ch + var(--digits, 0)*1ch);
	}
	input[type="range"] {
		vertical-align: middle;
	}
	#outScreenInfo {
		font-size: 0.8rem;
		font-family: monospace;

		white-space-collapse: preserve;
		text-wrap-mode: wrap;
		tab-size: 4;

		&:empty {
			display: none;
		}
	}
	/*]]>*/</style>
	<script type="text/javascript" src="frame-render.js" defer="defer"></script>
	<script type="text/javascript" src="canvas.js" defer="defer"></script>
	<script type="text/javascript" src="main.js" defer="defer"></script>
</head>
<body>
	<div id="canvasContainer">
		<canvas id="mainCanvas">
			If you are reading this through a user agent, it does not support HTML canvas. This page can't work without canvas.
		</canvas>
	</div>
	<p>
		Canvas: 
		<label for="cbxCanvasRatio">aspect ratio</label> <select id="cbxCanvasRatio">
			<option label="3:1"></option>
			<option label="8:3"></option>
			<option label="5:2"></option>
			<option label="12:5"></option>
			<option label="9:4"></option>
			<option label="32:15"></option>

			<option label="2:1"></option>
			<option label="15:8"></option>
			<option label="16:9"></option>
			<option label="5:3"></option>
			<option label="8:5"></option>

			<option label="3:2" selected="true"></option>
			<option label="4:3"></option>
			<option label="6:5"></option>
			<option label="5:4"></option>
			<option label="9:8"></option>
			<option label="16:15"></option>

			<option label="1:1"></option>
			<option label="15:16"></option>
			<option label="8:9"></option>
			<option label="4:5"></option>
			<option label="5:6"></option>
			<option label="3:4"></option>

			<option label="2:3"></option>
			<option label="5:8"></option>
			<option label="3:5"></option>
			<option label="9:16"></option>
			<option label="8:15"></option>

			<option label="1:2"></option>
			<option label="15:32"></option>
			<option label="4:9"></option>
			<option label="5:12"></option>
			<option label="2:5"></option>
			<option label="3:8"></option>

			<option label="1:3"></option>
		</select>, 
		<label for="rngCanvasResolution">resolution</label> <input id="rngCanvasResolution" type="range" min="12" max="24" step="1" value="19" />
		<output id="outCanvasResW">0</output>x<output id="outCanvasResH">0</output>.
		<button id="btnResDiv2" data-delta="-2">Half res.</button> 
		<button id="btnResMul2" data-delta="2">Double res.</button> 
		<label for="cbxCanvasScale">Scale</label> <select id="cbxCanvasScale">
			<option label="16:1"></option>
			<option label="12:1"></option>
			<option label="8:1"></option>
			<option label="6:1"></option>
			<option label="4:1"></option>
			<option label="3:1"></option>
			<option label="2:1"></option>
			<option label="3:2"></option>
			<option label="1:1" selected="true"></option>
			<option label="2:3"></option>
			<option label="1:2"></option>
			<option label="1:3"></option>
			<option label="1:4"></option>
			<option label="1:6"></option>
			<option label="1:8"></option>
			<option label="1:12"></option>
			<option label="1:16"></option>
		</select>.
	</p>
	<p>
		<label for="selColorSpace">Target color space</label> 
		<select id="selColorSpace">
			<option label="srgb"></option>
			<option label="srgb-linear" selected="selected"></option>
			<option label="a98-rgb"></option>
			<option label="display-p3"></option>
			<option label="display-p3-linear"></option>
			<option label="prophoto-rgb"></option>
			<option label="rec2020"></option>
			<option label="rec2100"></option>
			<option label="rec2100-linear"></option>
			<option label="rec2100-display-linear"></option>
			<option label="rec2100-pq"></option>
			<option label="rec2100-hlg"></option>
			<option label="xyz"></option>
			<option label="xyz-d50"></option>
			<option label="xyz-d65"></option>
		</select>, 
		<label for="txtBackgroundIntensity">background intensity</label> <input type="number" id="txtBackgroundIntensity" value="0.0625" step="0.25" min="0" max="65536" class="exp" />, 
		<label for="txtSpotIntensity">spot intensity</label> <input type="number" id="txtSpotIntensity" value="2" step="0.25" min="0" max="65536" class="exp" />, 
		<label for="rngSpotSize">spot radius</label> <input type="range" id="rngSpotSize" value="-6" step="0.0625" min="-12" max="0" /> 
		<output id="outSpotSize">0</output>.
	</p>
	<p>
		Frame: <!-- render time -->interval 
		<output id="outFrameRenderT">0</output> ms.
	</p>
	<p>
		This page is a canvas pixel format and HDR test.
	</p>
	<p id="outFeatureSupport">
		Canvas supported: no.
	</p>
	<p>
		<button id="btnScreenDetails" disabled="disabled">Get current screen details (unsupported)</button>
	</p>
	<pre id="outScreenInfo"></pre>
</body>
</html>
