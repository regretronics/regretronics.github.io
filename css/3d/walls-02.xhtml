<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS/SVG experiment: 3-d walls</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			background-color: Canvas;
			color: CanvasText;

			block-size: 100%;
			inline-size: 100%;
			overflow: hidden;
		}
		body {
			margin: auto;
			border: none;
			block-size: 100%;
			inline-size: 100%;
			padding: 0;

			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			/* align-items: center; */
			align-items: stretch;
			justify-content: center;

			timeline-scope: --scroll-rot-x, --scroll-wall-rot;
		}
		body, body > * {
			box-sizing: border-box;
		}

		@property --tube-thick-log {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0;
		}
		@property --wall-rot {
			syntax: "\3c angle\3e";
			inherits: true;
			initial-value: 0turn;
		}
		@property --rot-x {
			syntax: "\3c angle\3e";
			inherits: true;
			initial-value: 0turn;
		}
		@keyframes wall-rot {
			from {--wall-rot: 0turn;}
			to {--wall-rot: 0.25turn;}
		}
		@keyframes rot-x {
			from {--rot-x: 0turn;}
			to {--rot-x: -0.25turn;}
			/* from {rotate: x 0turn;}
			to {rotate: x 0.25turn;} */
			/* from {transform: rotateX(0turn);}
			to {transform: rotateX(0.25turn);} */
		}
		body > main {
			--sides: 6;
			/* --tube-thick: 0.25; */
			--tube-thick: pow(2, 0.5 * var(--tube-thick-log) - 2);
			--scale: 4in;
			--target-size: calc(1 * var(--scale));

			flex-basis: auto;
			flex-grow: 1;
			flex-shrink: 1;

			display: flex;
			overflow: hidden;
			container-type: size;

			perspective: calc(2 * var(--scale));
			/* transform: perspective(calc(2 * var(--scale)));
			transform-style: preserve-3d; */

			transition-property: --tube-thick-log;
			transition-duration: 500ms;
			/* transition-timing-function: linear; */

			animation-name: wall-rot, rot-x;
			animation-duration: 1ms;
			animation-timing-function: linear;
			animation-direction: alternate;
			animation-fill-mode: both;
			animation-timeline: --scroll-wall-rot, --scroll-rot-x;
			animation-composition: /* add *//* accumulate */replace;
		}
		#selTubeThick :checked {
			:root:has(&[label="-2"]) body > main {--tube-thick-log: -2;}
			:root:has(&[label="-1"]) body > main {--tube-thick-log: -1;}
			:root:has(&[label="0"])  body > main {--tube-thick-log: 0;}
			:root:has(&[label="1"])  body > main {--tube-thick-log: 1;}
			:root:has(&[label="2"])  body > main {--tube-thick-log: 2;}
			:root:has(&[label="3"])  body > main {--tube-thick-log: 3;}
			:root:has(&[label="4"])  body > main {--tube-thick-log: 4;}
		}
		#selTubeSides :checked {
			:root:has(&[label="3"]) body > main {--sides: 3;}
			:root:has(&[label="4"]) body > main {--sides: 4;}
			:root:has(&[label="5"]) body > main {--sides: 5;}
			:root:has(&[label="6"]) body > main {--sides: 6;}
			:root:has(&[label="7"]) body > main {--sides: 7;}
			:root:has(&[label="8"]) body > main {--sides: 8;}
			:root:has(&[label="9"]) body > main {--sides: 9;}
		}
		#selResolution :checked {
			:root:has(&[label="0.5x"]) body > main {--scale: 0.5in;}
			:root:has(&[label="1x"])   body > main {--scale: 1in;}
			:root:has(&[label="2x"])   body > main {--scale: 2in;}
			:root:has(&[label="4x"])   body > main {--scale: 4in;}
			:root:has(&[label="8x"])   body > main {--scale: 8in;}
		}
		body > div {
			flex-grow: 0;
			flex-shrink: 0;
			padding-inline: min(1em, 2cqi);
			background-color: oklch(0.25 0 0deg);
		}
		#controls {
			max-block-size: 30svb;
			display: flex;
			flex-wrap: wrap;
			flex-direction: column;
			/* place-items: center; */
			place-content: center;
			/* gap: 1em; */

			& > p {
				margin-block: 0.5em;
				margin-inline: 1em;
			}
		}

		@keyframes swing-x {
			from {transform: translateX(calc(-0.5 * var(--scale)));}
			50% {transform: translateX(calc(0.5 * var(--scale)));}
			to {transform: translateX(calc(-0.5 * var(--scale)));}
		}
		@keyframes swing-y {
			from {transform: translateY(calc(-0.5 * var(--scale)));}
			50% {transform: translateY(calc(0.5 * var(--scale)));}
			to {transform: translateY(calc(-0.5 * var(--scale)));}
		}
		@keyframes swing-z {
			from {transform: translateZ(0in);}
			50% {transform: translateZ(calc(2 * var(--scale)));}
			to {transform: translateZ(0in);}
		}
		.tube {
			--seg-turn: 0.0625turn;
			--tube-radius: calc(0.5 / tan(0.5 * var(--seg-turn))); /*torus apothem (when seg major length is 1)*/

			align-self: center;
			/* justify-self: center; */
			margin: auto;
			block-size: 0in;
			inline-size: 0in;

			transform-style: preserve-3d;
			scale: calc(100cqmin / var(--target-size));
			transform: rotateX(var(--rot-x));

			--anim-cycle: 8s;
			--anim-2-scale: sqrt(2);
			--anim-3-scale: sqrt(3);
			animation-name: swing-x, swing-y, swing-z;
			animation-delay: 
				calc(-0.25 * var(--anim-cycle)), 
				calc(var(--anim-2-scale) * -0.25 * var(--anim-cycle)), 
				0s;
			animation-duration: 
				var(--anim-cycle), 
				calc(var(--anim-2-scale) * var(--anim-cycle)), 
				calc(var(--anim-3-scale) * var(--anim-cycle));
			animation-timing-function: ease-in-out;
			animation-fill-mode: both;
			animation-iteration-count: infinite;
			animation-composition: add/* accumulate */;
			animation-play-state: var(--swing-x-state, paused), var(--swing-y-state, paused), var(--swing-z-state, paused);

			:root:has(#chkSwingX:checked) & {--swing-x-state: running;}
			:root:has(#chkSwingY:checked) & {--swing-y-state: running;}
			:root:has(#chkSwingZ:checked) & {--swing-z-state: running;}
		}
		#selTorusTurn :checked {
			:root:has(&[value="1/32"]) .tube {--seg-turn: calc(1turn / 32);}
			:root:has(&[value="1/24"]) .tube {--seg-turn: calc(1turn / 24);}
			:root:has(&[value="1/16"]) .tube {--seg-turn: calc(1turn / 16);}
			:root:has(&[value="1/12"]) .tube {--seg-turn: calc(1turn / 12);}
			:root:has(&[value="1/8"])  .tube {--seg-turn: calc(1turn / 8);}
			:root:has(&[value="1/6"])  .tube {--seg-turn: calc(1turn / 6);}
			:root:has(&[value="1/4"])  .tube {--seg-turn: calc(1turn / 4);}
		}
		.tube > span { /* prism */
			--ext-ang: calc(1turn / var(--sides));
			/* --wall-rot: 0turn; */
			/* --wall-rot: calc(0.5 * var(--ext-ang)); */
			/* --wall-rot: -0.25turn; */

			--i: calc(sibling-index() - 1);
			--i2: calc(var(--i) / var(--sides));
			--wall-side: mod(var(--i), var(--sides));
			--wall-seg: round(down, var(--i2));

			--tube-diag-factor: calc(1 / cos(0.5 * var(--ext-ang))); /*inverse apothem*/
			--aspct-rt: calc(var(--tube-thick) * tan(0.5 * var(--ext-ang)));

			--turn-cut: calc(var(--tube-diag-factor) * var(--tube-thick) * tan(0.5 * var(--seg-turn)));
			--face0-cut: calc(var(--turn-cut) * (0.5 - 0.5 * sin((var(--i) - 0.5) * var(--ext-ang) + var(--wall-rot))));
			--face1-cut: calc(var(--turn-cut) * (0.5 - 0.5 * sin((var(--i) + 0.5) * var(--ext-ang) + var(--wall-rot))));

			position: absolute;
			height: var(--scale);
			width: calc(var(--scale) * var(--aspct-rt));
			clip-path: polygon(
				0% calc(100% * (var(--face0-cut))), 
				100% calc(100% * (var(--face1-cut))), 
				100% calc(100% * (1 - var(--face1-cut))), 
				0% calc(100% * (1 - var(--face0-cut))));

			backface-visibility: visible;
			/* transform-origin: center; */
			transform: 
				translateX(calc(-0.5 * var(--scale) * var(--aspct-rt))) /*centralization*/
				translateX(calc(0.5 * var(--scale) * var(--tube-diag-factor) * var(--tube-thick))) /*reversing outer side to the center*/
				translateX(calc(-1 * var(--tube-radius) * var(--scale))) /*reversing placement in torus*/
				rotateY(calc(var(--seg-turn) * var(--wall-seg))) /*torus orientation*/
				translateX(calc(var(--tube-radius) * var(--scale))) /*placement in torus*/
				translateX(calc(-0.5 * var(--scale) * var(--tube-diag-factor) * var(--tube-thick))) /*outer side to the center*/
				translateY(calc(-0.5 * var(--scale))) /*centralization*/
				rotateZ(calc(1turn * var(--i2) + var(--wall-rot))) /*wall orientation*/
				translateY(calc(-0.5 * var(--tube-thick) * var(--scale))) /*eccentricity*/
				/* translateX(calc(0.25 * var(--scale) * var(--aspct-rt))) */
				rotateX(0.25turn); /*vertical to horizontal*/

			opacity: 0.75;
			background-color: oklch(0.5 0 0deg);
			background-image: url("../../assets/noise-01.svg");
			background-repeat: no-repeat;
			/* background-size: 
				calc(var(--sides) * var(--scale) * var(--aspct-rt)) 
				var(--scale);
			background-position: 
				calc(-1 * var(--scale) * var(--aspct-rt) * var(--wall-side)) 
				0in; */
			background-size: 
				calc(var(--sides) * var(--scale) * var(--aspct-rt)) 
				calc(var(--scale) * (1 - 2 * var(--turn-cut)));
			background-position: 
				calc(-1 * var(--scale) * var(--aspct-rt) * var(--wall-side)) 
				calc(var(--scale) * var(--turn-cut));
		}

		#selTubeThick {
			field-sizing: content;
			/* box-sizing: content-box; */
			/* inline-size: 8em; */
			/* block-size: 1lh; */
			/* block-size: fit-content; */

			overflow: auto;

			/* appearance: none; */

			& option {
				/* appearance: none; */
				/* field-sizing: content; */
				display: inline-block;

				/* inline-size: 4em; */
				/* block-size: 3em; */
				/* border-style: solid; */
				/* border-width: 0.5em; */
				padding-inline: 0.5em;
				padding-block: 0em;
			}
		}

		.scroll-bar {
			--scale: 0.5;
			--width: 16em;
			--height: 3em;
			display: inline-block;
			scale: var(--scale);
			width: var(--width);
			max-width: calc(100% / var(--scale));
			height: var(--height);
			vertical-align: middle;

			outline-style: solid;
			outline-width: 0.125em;
			outline-color: oklch(1 0 0deg / 0.5);

			margin-block: calc(-0.5 * var(--scale) * var(--height));
			margin-inline: calc(-0.5 * var(--scale) * var(--width));
			overflow-inline: scroll;
			overflow-block: hidden;
			contain: strict;

			background-color: oklch(0.25 0 0deg);
		}
		#scrollBar1 {
			scroll-timeline: --scroll-rot-x inline;
		}
		#scrollBar2 {
			scroll-timeline: --scroll-wall-rot inline;
		}
		.scroll-area {
			inline-size: 300%;
			block-size: 100%;

			padding: 0;
			border-width: 0;
			contain: strict;
			container-type: size;
			user-select: none;

			background: linear-gradient(to right, black, white);

			& .label {
				position: absolute;
				text-transform: uppercase;
				/* font-variant: small-caps; */
				font-size: min(1em / var(--scale), 100cqb);

				&.min {
					left: 0;
					color: white;
				}
				&.max {
					right: 0;
					color: black;
				}
			}
		}
	/*]]>*/</style>
</head>
<body>
	<main>
		<div class="tube">
			<span></span><span></span><span></span><span></span>
			<span></span><span></span><span></span><span></span>
			<span></span><span></span><span></span><span></span>
			<span></span><span></span><span></span><span></span>
			<span></span><span></span><span></span><span></span>
			<span></span><span></span><span></span><span></span>
		</div>
	</main>
	<div id="controls">
		<p>
			<label for="selResolution">Resolution</label>: 
			<select id="selResolution">
				<option label="0.5x"></option>
				<option label="1x"></option>
				<option label="2x" selected="selected"></option>
				<option label="4x"></option>
				<option label="8x"></option>
			</select>
		</p>
		<p>
			<label for="selTorusTurn">Torus ext. angle</label>: 
			<select id="selTorusTurn">
				<option value="1/32" label="&tau; / 32"></option>
				<option value="1/24" label="&tau; / 24"></option>
				<option value="1/16" label="&tau; / 16" selected="selected"></option>
				<option value="1/12" label="&tau; / 12"></option>
				<option value="1/8" label="&tau; / 8"></option>
				<option value="1/6" label="&tau; / 6"></option>
				<option value="1/4" label="&tau; / 4"></option>
			</select>
		</p>
		<p>
			<label for="selTubeThick">Tube thickness</label>: 
			<select id="selTubeThick" size="4">
				<option label="-2"></option>
				<option label="-1"></option>
				<option label="0" selected="selected"></option>
				<option label="1"></option>
				<option label="2"></option>
				<option label="3"></option>
				<option label="4"></option>
			</select>
		</p>
		<p>
			<label for="selTubeSides">Tube sides</label>: 
			<select id="selTubeSides">
				<option label="3"></option>
				<option label="4"></option>
				<option label="5"></option>
				<option label="6" selected="selected"></option>
				<option label="7"></option>
				<option label="8"></option>
				<option label="9"></option>
			</select>
		</p>
		<p>
			Tube rotation: 
			<div id="scrollBar2" class="scroll-bar">
				<div class="scroll-area">
					<span class="label min">minimum</span>
					<span class="label max">maximum</span>
				</div>
			</div>
		</p>
		<p>
			Pitch: 
			<div id="scrollBar1" class="scroll-bar">
				<div class="scroll-area">
					<span class="label min">minimum</span>
					<span class="label max">maximum</span>
				</div>
			</div>
		</p>
		<p>
			<input type="checkbox" id="chkSwingX" /> 
			<label for="chkSwingX">Swing in x axis</label> 
			<br />
			<input type="checkbox" id="chkSwingY" /> 
			<label for="chkSwingY">Swing in y axis</label> 
			<br />
			<input type="checkbox" id="chkSwingZ" /> 
			<label for="chkSwingZ">Swing in z axis</label> 
		</p>
	</div>
</body>
</html>
