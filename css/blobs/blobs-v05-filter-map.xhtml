<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>CSS blobs and PRNG, with SVG color mapping</title>

	<link rel="stylesheet" type="text/css" href="random-cubic.css" />
	<style type="text/css">/*<![CDATA[*/
		:root {
			width: 100%;
			height: 100%;
			overflow: hidden;

			color-scheme: dark;
			background-color: black;
			/* --dur: 1800; */
		}
		body {
			margin: 0;
			padding: 0;
			border: none;
			overflow: hidden;
		}

		#svg1 {
			position: absolute;
			width: 100%;
			height: 100%;

			margin: 0;
			padding: 0;
			border: none;
			overflow: hidden;
			background-color: black;
			/* filter: url("#warp"); */
			/* filter: url("../../assets/common.svg#fltMapHues"); */
			filter: 
				url("../../assets/common.svg#fltTransferSquash3") 
				url("../../assets/common.svg#fltMapHues");

			--blob-count: 32;
		}
		#svg1 > circle {
			/* --i: calc(sibling-index() - 2); */
			--i: attr(data-i type(<number>));

			cx: var(--rnd-interp-x);
			cy: var(--rnd-interp-y);
			/* cx: calc(50% + 25vmin * var(--rnd-interp-x));
			cy: calc(50% + 25vmin * var(--rnd-interp-y)); */
			/* transform: translate(
				calc(50vmin * (2 * var(--rnd-interp-x) - 1)), 
				calc(50vmin * (2 * var(--rnd-interp-y) - 1))); */

			/* mix-blend-mode: hard-light; */
			/* fill: white; */
			fill: url("../../assets/common-grad.svg#blobGradBinomial10");
			opacity: 0.25;
			r: 0.375;
			/* mask: url("#blobMask"); */
		}
	/*]]>*/</style>
</head>
<body>
	<svg id="svg1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet">
		<mask id="blobMask" mask-type="alpha" maskContentUnits="objectBoundingBox">
			<circle cx="0.5" cy="0.5" r="0.5" fill="url(../../assets/common-grad.svg#blobGradBinomial10)" />
		</mask>
		<circle data-i="0" />
		<circle data-i="1" />
		<circle data-i="2" />
		<circle data-i="3" />
		<circle data-i="4" />
		<circle data-i="5" />
		<circle data-i="6" />
		<circle data-i="7" />
		<circle data-i="8" />
		<circle data-i="9" />
		<circle data-i="10" />
		<circle data-i="11" />
		<circle data-i="12" />
		<circle data-i="13" />
		<circle data-i="14" />
		<circle data-i="15" />
		<circle data-i="16" />
		<circle data-i="17" />
		<circle data-i="18" />
		<circle data-i="19" />
		<circle data-i="20" />
		<circle data-i="21" />
		<circle data-i="22" />
		<circle data-i="23" />
		<circle data-i="24" />
		<circle data-i="25" />
		<circle data-i="26" />
		<circle data-i="27" />
		<circle data-i="28" />
		<circle data-i="29" />

		<circle data-i="31" />
	</svg>
</body>
</html>
