<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Particles test</title>
	<style type="text/css">/*<![CDATA[*/
	:root {
		background-color: revert !important; /*Dark Reader workaround*/
		height: 100%;
	}
	body {
		background-color: canvas;
		color: canvastext;
		color-scheme: dark;

		display: flex;
		flex-direction: column;
		flex-wrap: nowrap;
		justify-content: center;
		align-items: stretch;

		box-sizing: border-box;
		margin: 0em;
		height: 100%;
		/*height: 100vh;*/
	}
	#mainContainer {
		width: 100%;
		/* height: 87.5cqh; */
		flex-grow: 1;
		flex-shrink: 1;
		box-sizing: border-box;
		background-color: hsla(0, 0%, 100%, 12.5%);
		overflow: scroll;
		--z0: 400;
		perspective: calc(var(--z0) * 1px);
	}
	#bottomContainer {
		flex-grow: 0;
		flex-shrink: 0;
		padding-inline: min(1em, 2cqi);
	}

	input[type=number] {
		text-align: right;
		width: 7ch;
	}
	#svgImgBlob, #svgImgBlobCircle {
		display: none;
	}
	.blobCss {
		background-image: radial-gradient(closest-side, hsl(30deg, 100%, 62.5%), transparent);
		/* background-image: radial-gradient(closest-side, hsl(var(--pos-z), 100%, 62.5%), transparent); */
	}
	/* .blobSvg {
		background-image: element("#blobFill");
		background-image: -moz-element(#blobFill);
	} */

	#l2Container {
		/* background-image: -moz-element("#svgImgBg"); */
		/* background-image: element("#svgImgBg"); */
		background-color: hsla(0, 0%, 50%, 25%);
		width: 100%;
		height: 100%;
		transform-style: preserve-3d;
	}
	svg#svgImgBg {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
	}
	.layer {
		/* background-color: gray; */
		/* opacity: 0.5; */
		background-image: url("layer.svg");
		background-repeat: repeat;

		translate: 0 0 calc(var(--pos-z) * 1px);
		/* --z-absolute: calc(var(--z0) - var(--pos-z)); */
		/* --persp-scale: calc(var(--z-absolute) / var(--z0)); */
		/* background-size: calc(var(--z0) / var(--z-absolute)); */

		position: absolute;
		margin: auto;
		border-width: 0;
		padding: 0;

		width: 100%;
		height: 100%;
	}
	.size0 {
		--s-x: 80;
		--s-y: 80;
	}
	.sizeVar {
		width: calc(var(--s-x) * 1px);
		height: calc(var(--s-y) * 1px);
		--sh-x: calc(0.5 * var(--s-x));
		--sh-y: calc(0.5 * var(--s-y));
	}
	.posVar {
		position: absolute;
		/* --pos-x: calc(attr(data-x number) * 1em);
		--pos-y: calc(attr(data-y number) * 1em);
		--pos-z: calc(attr(data-z number) * 1em); */
		left: calc(50% - var(--sh-x) * 1px);
		top: calc(50% - var(--sh-y) * 1px);
		translate:
			calc(var(--pos-x) * 1px)
			calc(var(--pos-y) * 1px)
			calc(var(--pos-z) * 1px);
		/* left: 50%;
		top: 50%;
		translate:
			calc((var(--pos-x) - var(--sh-x)) * 1px)
			calc((var(--pos-y) - var(--sh-y)) * 1px)
			calc(var(--pos-z) * 1px); */
		/* transition-property: translate;
		transition-duration: 0.25s; */
	}
	.posVar::after {
		content: attr(class);
		/* content: var(--pos-z); */
		/* content: attr(data-z); */
		/* content: calc(attr(data-z number) + 1); */
		font-size: 0.5em;
		text-align: center;
		position: absolute;
		/* height: 25%; */
		/* margin-block: auto; */
	}
	.blobCss.posVar {
		opacity: calc(clamp(0, 0.005 * (var(--z0) - var(--pos-z)), 1));
	}

	.seg {
		/* --pos0-s: calc(1 / (var(--z0) - var(--pos0-z))); */ /* apparent size in perspective projection */
		/* --pos1-s: calc(1 / (var(--z0) - var(--pos1-z))); */
		/* --d2d-x: calc(var(--pos1-x) * var(--pos1-s) - var(--pos0-x) * var(--pos0-s)); */ /* vector between projected positions */
		/* --d2d-y: calc(var(--pos1-y) * var(--pos1-s) - var(--pos0-y) * var(--pos0-s)); */

		--pos-x: calc(0.5 * (var(--pos0-x) + var(--pos1-x)));
		--pos-y: calc(0.5 * (var(--pos0-y) + var(--pos1-y)));
		--pos-z: calc(0.5 * (var(--pos0-z) + var(--pos1-z)));

		--d-x: calc(var(--pos1-x) - var(--pos0-x));
		--d-y: calc(var(--pos1-y) - var(--pos0-y));
		--d-z: calc(var(--pos1-z) - var(--pos0-z));

		/* This is for the lack of abs() function support. */
		--d-x-abs: calc(max(0, var(--d-x)) - min(0, var(--d-x)) + 1e-3);
		--d-y-abs: calc(max(0, var(--d-y)) - min(0, var(--d-y)) + 1e-3);
		--d-z-abs: calc(max(0, var(--d-z)) - min(0, var(--d-z)) + 1e-3);

		/* This is for the lack of hypot() and sqrt() function support. */
		/* --d-xy-hypot: calc(var(--d-y) / sin(atan2(var(--d-y), var(--d-x)))); */ /* Yeah, I tested. May yield division by zero. */
		--xy-ornt: calc(atan2(var(--d-y), var(--d-x)));
		--d-xy-hypot1: calc(var(--d-x-abs) / cos(atan2(var(--d-y-abs), var(--d-x-abs))));
		--d-xy-hypot2: calc(var(--d-y-abs) / cos(atan2(var(--d-x-abs), var(--d-y-abs))));
		--d-xy-hypot: calc(0.5 * (var(--d-xy-hypot1) + var(--d-xy-hypot2)));
		/* --d-xy-hypot: calc(max(0, var(--d-xy-hypot3)) - min(0, var(--d-xy-hypot3)) + 1e-3); */

		--z-ornt: calc(-1 * atan2(var(--d-z), var(--d-xy-hypot)));
		--d-xyz-hypot1: calc(var(--d-xy-hypot) / cos(var(--z-ornt)));
		--d-xyz-hypot2: calc(var(--d-z-abs) / cos(atan2(var(--d-xy-hypot), var(--d-z-abs))));
		--d-xyz-hypot: calc(0.5 * (var(--d-xyz-hypot1) + var(--d-xyz-hypot2)));
		/* --d-xyz-hypot: calc(max(0, var(--d-xyz-hypot3)) - min(0, var(--d-xyz-hypot3)) + 1e-3); */

		--s-x: var(--d-xyz-hypot);
		/* --s-y: calc(0.125 * var(--d-xyz-hypot-abs)); */
		--s-y: 10;
		/* --s-y: calc(30 * (var(--z0) - var(--pos-z)) / var(--z0)); */

		/* --sat: calc(100% * (atan(1000) / 100deg)); */
		/* --sat: calc(atan(var(--d-xy-hypot)) / 300deg + 0.5); */
		background-color: hsla(var(--xy-ornt), 100%, 50%, 50%);
		/* background-color: hsla(var(--xy-ornt), calc(atan(100) / 4rad), 50%, 50%); */
		/* background-color: hsla(var(--xy-ornt), calc(100% * var(--sat)), 50%, 50%); */
		border-radius: calc(min(var(--sh-x), var(--sh-y)) * 1px);
		transform: rotateZ(var(--xy-ornt)) rotateY(var(--z-ornt));
		/* transition-property: transform;
		transition-duration: 0.25s; */
	}
	/*]]>*/</style>
	<style type="text/css" id="posStyles">/*<![CDATA[*/
	/*]]>*/</style>
	<script type="text/javascript" src="particles.js"></script>
	<script type="text/javascript">/*<![CDATA[*/
	//to do: check performance difference of strict mode.
	"use strict";
	//to do: use defer(="defer") or async in any script tag?
	//  idea: have a "reload script" button?

	/* eval(getComputedStyle(document.querySelector(".pv0")).getPropertyValue("--z-scale").replaceAll("calc", "")) */

	function animFrame() {
		updateDynamics(lastDT);
		updatePosCSS();
		let t = Date.now();
		lastDT = (t - lastCycleTime) * 0.001;
		lastCycleTime = t;

		requestAnimationFrame(animFrame);
	}
	function pageReady() {
		resetWorld2();
		recreateWorldElems();

		/* let elem = document.getElementById("mainContainer");
		elem.scrollTo(0.25 * elem.scrollWidth, 0.25 * elem.scrollHeight); */
		//let elem = document.querySelector(".seg0"), scrollOptions = {behavior: "smooth", block: "center", inline: "center"};
		//elem.scrollIntoView(scrollOptions);
		//elem.scrollIntoView(scrollOptions);

		lastCycleTime = Date.now();
		lastDT = 1 / 60;
		requestAnimationFrame(animFrame);
		/*setInterval(() => {
			updateDynamics(1 / 16);
			updatePosCSS();
		}, 1000 / 16);*/
	}

	function txtPixelScaleChanged(event) {
		pixelScale = parseFloat(txtPixelScale.value);
	}
	function txtPerspZChanged(event) {
		//getComputedStyle(mainContainer).getPropertyValue("--z0")
		mainContainer.style.setProperty("--z0", parseFloat(txtPerspZ.value));
	}
	function pageLoaded() {
		for(const s of document.querySelectorAll('[id]'))
			window[s.id] = s;

		txtPixelScale.addEventListener("input", txtPixelScaleChanged);
		txtPerspZ.addEventListener("input", txtPerspZChanged);
	}

	//window.addEventListener("DOMContentLoaded", pageLoaded);
	if(document.readyState === "loading")
		document.addEventListener("DOMContentLoaded", pageLoaded);
	else //DOMContentLoaded has already fired
		pageLoaded();
	window.addEventListener("load", pageReady);
	/*]]>*/</script>
