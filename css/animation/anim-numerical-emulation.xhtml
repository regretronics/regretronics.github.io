<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS experiment: vars, animation, math functions, etc.</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t1 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --t2 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --t3 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}

		@property --t1-anim {
			syntax: "\3c time\3e";
			/* syntax: "dimension-unit"; */
			inherits: true;
			initial-value: 0.0s;
		}
		@property --t2-anim {
			syntax: "\3c time\3e";
			inherits: true;
			initial-value: 0.0s;
		}
		@property --t3-anim {
			syntax: "\3c time\3e";
			inherits: true;
			initial-value: 0.0s;
		}

		/* @keyframes anim1 {
			to {
				--t: 1;
			}
		} */
		:root {
			color-scheme: dark;
			background-color: Canvas;
			color: CanvasText;
			font-size: 3em;

			/* animation-name: anim1;
			animation-duration: 9s;
			animation-iteration-count: infinite;
			animation-timing-function: linear; */
			/* animation-timeline: scroll(block nearest); */

			--t-main: 0.0;
			/* --t2: var(--t); */
			--t1: var(--t-main);
			--t2: var(--t-main);
			--t3: var(--t-main);

			/*for the technique that works in Chrome, a second level of reference in necessary for whatever reason, although it doesn't have to have a time type.*/
			--t1-anim: calc(-1s * var(--t1));
			--t2-anim: calc(-1s * var(--t2));
			--t3-anim: calc(-1s * var(--t3));

			transition-property: --t1, --t2, --t3;
			transition-duration: 1s, 1s, 4s;
			/* transition-timing-function: linear; */
			/* transition-timing-function: ease-out; */
			/* transition-timing-function: cubic-bezier(1,0,0,1); */
			transition-timing-function: linear, cubic-bezier(0,0,0,1), cubic-bezier(0,0,0,1);
			/* transition-timing-function: cubic-bezier(0,0,0.5,1); */
			/* transition-timing-function: cubic-bezier(.5, -0.5, 1, 1.5); */
			/* transition-timing-function: linear(0, 0.5 25% 75%, 1); */
			/* transition-timing-function: linear(0, 0.25 45%, 0.75 55%, 0.5 70%, 1); */
			/* transition-behavior: allow-discrete; */
			/* transition-delay: 1s; */

			/* &:hover { */
			&:has(#chkState:checked) {
				--t-main: 1.0;
				/* --t: 1.0;
				--t2: 1.0; */
			}
		}

		.gauge {
			width: 80%;
			background-color: oklch(0.5 0 0deg / 0.5);
			margin-block-end: 0.5em;
			& > div:nth-child(1) {
				background-color: orange;
				text-wrap-mode: nowrap;
				overflow-inline: visible;
			}

			:nth-child(1 of &) { /*works better than :nth-of-type() (more specialized)*/
				& > div:nth-child(1) {
					width: calc(100% * var(--t1));
				}
			}
			:nth-child(2 of &) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t2));
				}
			}
			:nth-child(3 of &) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t3));
				}
			}
		}

		/* @keyframes anim-color {
			to {
				background-color: oklch(0.25 0.125 60deg);
			}
		}
		@keyframes anim-rotate {
			to {
				rotate: 1turn;
			}
		} */
		@keyframes anim-color {
			50% {
				color: oklch(1 0 60deg);
				background-color: revert-layer;
			}
			100% {
				color: oklch(1 0 60deg);
				background-color: oklch(0.25 0.125 60deg);
			}
		}
		@keyframes anim-rotate {
			50% {
				left: 1em;
				rotate: revert-layer;
			}
			100% {
				left: 1em;
				rotate: 1turn;
			}
		}
		.spinner {
			float: left;
			margin-inline: 1em;
			position: relative;
			left: 0em;
			width: 4em;
			height: 4em;

			background-color: oklch(0.5 0 0deg);
			color: oklch(0.75 0 60deg);

			display: flex;
			align-items: center;
			justify-content: center;

			:nth-child(1 of &) {
				animation-name: anim-color, anim-rotate;
				animation-duration: 1s;
				/* animation-duration: calc(4s / var(--t3)); */
				animation-play-state: paused;
				animation-fill-mode: both;
				animation-timing-function: linear;
				/* animation-timing-function: cubic-bezier(.5, -0.5, 1, 1.5); */
				/* animation-composition: ; */

				/*note: animation-delay is documented as not animatable.*/
				/*doesn't work in Firefox, as of 2025-05.*/
				animation-delay: var(--t2-anim), var(--t3-anim);
				/* animation-delay: calc(-1s * var(--t2, 0.0)), calc(-1s * var(--t3, 0.0)); */
			}
			/* :nth-child(2 of &) {
				background-color: color-mix(in oklab, 
					oklch(0.5 0 0deg), 
					oklch(0.25 0.125 60deg) calc(100% * var(--t2)));
				rotate: calc(1turn * var(--t3));
			} */
			:nth-child(2 of &) {
				color: color-mix(in oklab, 
					oklch(0.75 0 60deg), 
					oklch(1 0 60deg) calc(100% * clamp(0, var(--t2), 0.5) / 0.5));
				background-color: color-mix(in oklab, 
					oklch(0.5 0 0deg), 
					oklch(0.25 0.125 60deg) calc(100% * clamp(0, var(--t2) - 0.5, 0.5) / 0.5));

				left: calc(1em * clamp(0, var(--t3), 0.5) / 0.5);
				rotate: calc(1turn * clamp(0, var(--t3) - 0.5, 0.5) / 0.5);
			}
		}

		input, textarea, button, select {
			font-size: inherit;
		}
		input:is([type=checkbox], [type=radio]) {
			/* block-size: 1em; */
			/* inline-size: 1em; */
			/* vertical-align: baseline; */
			vertical-align: middle;
			block-size: 1cap;
			inline-size: 1cap;
			margin-inline: 0em;
			color: inherit;

			& + label {
				/* vertical-align: middle; */
				/* margin-inline: 0.125em; */
				padding-inline: 0.25em;
				/* @starting-style {
					color: oklch(0.75 0.03125 var(--hue1-ang, 0deg));
				} */
			}
			&:not(:checked) + label {
				color: oklch(0.75 0.03125 55deg / 0.8);
			}
			&:checked + label {
				color: oklch(0.875 0.1875 55deg);
			}
		}
	/*]]>*/</style>
</head>
<body>
	<p>
		<input type="checkbox" id="chkState" />
		<label for="chkState">State</label>
	</p>
	<div class="gauge"><div>--t1 (transition, 1s, linear)</div></div>
	<div class="gauge"><div>--t2 (transition, 1s)</div></div>
	<div class="gauge"><div>--t3 (transition, 4s)</div></div>
	<div class="spinner">asfd</div>
	<div class="spinner">asfd</div>
</body>
</html>
