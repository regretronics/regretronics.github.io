<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark light" />
	<title>CSS control appearance test</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			--text-scale: 2;
			--text-scale: pow(2, 0.25 * var(--text-scale-log, 0));
			font-size: calc(1em * var(--text-scale, 1));

			--luma-scale: 1;

			--hue1: 0deg;
			--hue1: calc(30deg * var(--hue1-int, 0));

			--contrast-drive: 1;
			--contrast-drive: calc(pow(2, 0.25 * var(--contrast-drive-int, 0)));

			/* --lum-p0-25: calc(100% * (0.5 + var(--luma-scale, 1) * 0.25));
			--lum-m0-375: calc(100% * (0.5 - var(--luma-scale, 1) * 0.375)); */

			/* --lum1-p0-25: 0.25 * var(--contrast-drive, 1);
			--lum1-m0-375: -0.375 * var(--contrast-drive, 1); */
			/* --lum1-p0-25: calc(atan(0.25 * var(--contrast-drive, 1)) / 180deg);
			--lum1-m0-375: calc(atan(-0.375 * var(--contrast-drive, 1)) / 180deg); */
			--lum2-m0-25: calc(-0.25 * var(--contrast-drive, 1));
			--lum2-p0-25: calc(0.25 * var(--contrast-drive, 1));
			--lum2-m0-375: calc(-0.375 * var(--contrast-drive, 1));
			--lum2-p0-375: calc(0.375 * var(--contrast-drive, 1));

			--lum1-m0-25: calc(var(--lum2-m0-25, 0) / sqrt(1 + pow(var(--lum2-m0-25, 0), 2)));
			--lum1-p0-25: calc(var(--lum2-p0-25, 0) / sqrt(1 + pow(var(--lum2-p0-25, 0), 2)));
			--lum1-m0-375: calc(var(--lum2-m0-375, 0) / sqrt(1 + pow(var(--lum2-m0-375, 0), 2)));
			--lum1-p0-375: calc(var(--lum2-p0-375, 0) / sqrt(1 + pow(var(--lum2-p0-375, 0), 2)));

			--lum-m0-25: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-m0-25, 0)));
			--lum-p0-25: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-p0-25, 0)));
			--lum-m0-375: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-m0-375, 0)));
			--lum-p0-375: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-p0-375, 0)));

			--color-back: hsl(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%));

			--shade-b: color(rec2020 0 0 0 / 0.75);
			--shade-w: color(rec2020 1 1 1 / 0.75);
			/* --shade-w: color(rec2020 calc(30/32) calc(27/32) 1 / 0.75); */
			--shade-b2: color(rec2020 0 0 0 / 0.5);
			--shade-w2: color(rec2020 1 1 1 / 0.5);
			--shade-b0: color(rec2020 0 0 0 / 0);
			--shade-w0: color(rec2020 1 1 1 / 0);

			/*box-shadow values: bottom-right, top-left, inset, outset*/
			--sh-br: 0.0625em 0.0625em; /*horizontal and vertical displacements*/
			--sh-tl: -0.0625em -0.0625em;
			--sh-br-s: 0.03125em 0.03125em;
			--sh-tl-s: -0.03125em -0.03125em;
			/* --shi-thick: 0.0625em 0em; */ /*shadow blur and spread (outset: grows; inset: shrinks)*/
			--shi-thick: 0.09375em -0.0625em;
			--sho-thick: 0.125em -0.0625em;
			/* --shi-thin: 0.0625em -0.0625em; */
			--shi-thin: 0.09375em -0.0625em;
			--sho-thin: 0.0625em -0.0625em;
			--shi-thin-s: 0.09375em -0.0625em;
			--sho-thin-s: 0.0625em -0.0625em;

			/* --sh-sunken:
				inset var(--sh-br) var(--shi-thick) var(--shade-b),
				inset var(--sh-tl) var(--shi-thick) var(--shade-w); */
			/* --sh-sunken:
				var(--sh-tl) var(--sho-thick) var(--shade-b),
				var(--sh-br) var(--sho-thick) var(--shade-w); */
			--sh-sunken:
				inset var(--sh-br) var(--shi-thick) var(--shade-b),
				inset var(--sh-tl) var(--shi-thick) var(--shade-w),
				var(--sh-tl) var(--sho-thick) var(--shade-b),
				var(--sh-br) var(--sho-thick) var(--shade-w);

			--sh-neutral:
				inset var(--sh-br) var(--shi-thick) var(--shade-b0),
				inset var(--sh-tl) var(--shi-thick) var(--shade-w0),
				var(--sh-tl) var(--sho-thick) var(--shade-b0),
				var(--sh-br) var(--sho-thick) var(--shade-w0);

			/* --sh-raised:
				inset var(--sh-br) var(--shi-thin) var(--shade-w),
				inset var(--sh-tl) var(--shi-thin) var(--shade-b); */
			/* --sh-raised:
				var(--sh-tl) var(--sho-thin) var(--shade-w),
				var(--sh-br) var(--sho-thin) var(--shade-b); */
			--sh-raised:
				inset var(--sh-br) var(--shi-thin) var(--shade-w),
				inset var(--sh-tl) var(--shi-thin) var(--shade-b),
				var(--sh-tl) var(--sho-thin) var(--shade-w),
				var(--sh-br) var(--sho-thin) var(--shade-b);
			/* --sh-mid-raised:
				inset var(--sh-br-s) var(--shi-thin-s) var(--shade-w2),
				inset var(--sh-tl-s) var(--shi-thin-s) var(--shade-b2),
				var(--sh-tl-s) var(--sho-thin-s) var(--shade-w2),
				var(--sh-br-s) var(--sho-thin-s) var(--shade-b2); */
			--sh-mid-raised:
				inset var(--sh-br-s) var(--shi-thin-s) var(--shade-w),
				inset var(--sh-tl-s) var(--shi-thin-s) var(--shade-b),
				var(--sh-tl-s) var(--sho-thin-s) var(--shade-w),
				var(--sh-br-s) var(--sho-thin-s) var(--shade-b);

			/* background-color: hsl(var(--hue1, 0deg), 25%, 75%);
			color: hsl(var(--hue1, 0deg), 25%, 12.5%); */

			/* background-color: hsl(var(--hue1, 0deg), 25%, calc(100% * (0.5 + var(--luma-scale, 1) * 0.25)));
			color: hsl(var(--hue1, 0deg), 25%, calc(100% * (0.5 - var(--luma-scale, 1) * 0.375))); */

			background-color: var(--color-back);
			color: hsl(var(--hue1, 0deg), 25%, var(--lum-m0-375, 50%));
			accent-color: hsl(var(--hue1, 0deg), 25%, var(--lum-m0-25, 50%));

			/* background-image: url("https://upload.wikimedia.org/wikipedia/commons/6/64/KLIK59b.jpg"); */
			/* background-image: cross-fade(25% linear-gradient(hsl(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%)) 0% 100%), url("https://upload.wikimedia.org/wikipedia/commons/6/64/KLIK59b.jpg")); */
			/* background-image: linear-gradient(hsla(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%), 0.5) 0% 100%), url("https://upload.wikimedia.org/wikipedia/commons/6/64/KLIK59b.jpg"); */
			background-image: linear-gradient(0.25turn in hsl longer hue, hsla(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%), 0.5) 0% 100%), url("https://upload.wikimedia.org/wikipedia/commons/6/64/KLIK59b.jpg");
			background-origin: border-box;
			/* background-clip: border-box; */
			background-position: center;
			background-size: cover;
			background-attachment: fixed;

			/* height: 100%; */
			/* height: 100vh; */
		}
		:root:has(#chkAnimations:checked) {
			transition-property: font-size, background-color, color;
			transition-duration: 0.25s;

			/* & input[type="checkbox"] {
				transition-property: block-size, inline-size;
				transition-duration: 0.25s;
			} */
			input:not([type=checkbox], [type=radio], [type=button]), textarea, select {
				transition-property: font-size, background-color, color, box-shadow;
				/* transition-duration: 0.25s, 0.25s, 0.25s, 0.25s; */
			}
			button, input[type=button] {
				transition-property: font-size, background-color, color, box-shadow;
				transition-duration: 0.25s, 0.25s, 0.25s, 0.75s;

				&:active, &:hover, &.kb-pressed {
					transition-duration: 0.25s, 0.25s, 0.25s, 0.125s;
				}
			}
		}

		body {
			/* backdrop-filter: opacity(0.5); */
			/* height: 100vh; */
			/* min-height: 100%; */
		}
		p:not(.shade-group) > span, p > label {
			/* backdrop-filter: blur(0.5em) opacity(0.75); */
			backdrop-filter: blur(0.25em);
			background-color: hsla(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%), 0.125);
			background-image:
				linear-gradient(0turn, transparent, hsla(var(--hue1, 0deg), 25%, var(--lum-p0-25, 50%), 0.25) 25% 75%, transparent);
			/* filter: drop-shadow(0 0 0.5em var(--color-back)); */
			/* text-shadow: 0 0 0.125em var(--color-back); */
			/* text-shadow:
				0 0 0.09375em var(--color-back),
				0 0 0.1875em var(--color-back),
				0 0 0.375em var(--color-back); */
			--color-shadow: hsl(var(--hue1, 0deg), 25%, var(--lum-p0-375, 50%));
			text-shadow:
				0 0 0.0625em var(--color-shadow),
				0 0 0.125em var(--color-shadow),
				0 0 0.25em var(--color-shadow),
				0 0 0.5em var(--color-shadow);
			/* color: transparent; */ /* provisory */
			border-start-start-radius: 0.125em;
			border-start-end-radius: 0.3125em;
			border-end-start-radius: 0.125em;
			border-end-end-radius: 0.3125em;
		}

		/* input, select {
			scale: var(--text-scale, 1);
		} */
		input, textarea, button, select {
			font-size: inherit;
		}
		input:not([type=checkbox], [type=radio]), textarea, button, select {
			border-start-start-radius: 0.125em;
			border-start-end-radius: 0.3125em;
			border-end-start-radius: 0.125em;
			border-end-end-radius: 0.3125em;
			border-width: 0;
			padding: 0.125em;
		}
		input:not([type=checkbox], [type=radio]), textarea, button, select, option {
			--lum2-p0-25: calc(0.25 * var(--contrast-drive, 1));
			--lum2-m0-25: calc(-0.25 * var(--contrast-drive, 1));
			--lum1-p0-25: calc(var(--lum2-p0-25, 0) / sqrt(1 + pow(var(--lum2-p0-25, 0), 2)));
			--lum1-m0-25: calc(var(--lum2-m0-25, 0) / sqrt(1 + pow(var(--lum2-m0-25, 0), 2)));
			--lum-p0-25: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-p0-25, 0)));
			--lum-m0-25: calc(100% * (0.5 + var(--luma-scale, 1) * var(--lum1-m0-25, 0)));

			background-color: hsl(var(--hue1, 0deg), 50%, var(--lum-p0-25, 50%));
			color: hsl(var(--hue1, 0deg), 50%, var(--lum-m0-25, 50%));
		}
		input[type=checkbox] {
			/* block-size: 1em;
			inline-size: 1em;
			vertical-align: middle; */
			block-size: 1cap;
			inline-size: 1cap;
			vertical-align: baseline;
		}
		input:not([type=checkbox], [type=radio], [type=button]), textarea, select {
			box-shadow: var(--sh-sunken);
		}
		select:focus {
			/* box-shadow: none; */
			box-shadow: var(--sh-neutral);
		}
		button, input[type=button] { /* to do: active or focus? */
			outline-color: hsla(var(--hue1, 0deg), 50%, var(--lum-m0-25, 50%), 0.5);
			padding: 0.25em;

			box-shadow: var(--sh-raised);

			&:not(:active):hover {
				box-shadow: var(--sh-mid-raised);
			}
			&:active:hover, &.kb-pressed {
				/* box-shadow: inherit; */
				/* box-shadow: initial; */
				/* box-shadow: revert; */
				box-shadow: var(--sh-sunken);
			}
		}
		select {
			padding-inline-start: 0.25em;
			margin-block: 0.125em;
			margin-inline: 0.25em;
		}
		button:has(label) {
			padding: 0;
		}
		button > label {
			display: block;
			padding: 0.25em;
			border-radius: inherit;
		}

		/* #rngTextScale {
			accent-color: green;
		} */

		#selTextScale option:checked {
			:root:has(&[label="-3"]) {--text-scale-log: -3;}
			:root:has(&[label="-2"]) {--text-scale-log: -2;}
			:root:has(&[label="-1"]) {--text-scale-log: -1;}
			:root:has(&[label="0"]) {--text-scale-log: 0;}
			:root:has(&[label="1"]) {--text-scale-log: 1;}
			:root:has(&[label="2"]) {--text-scale-log: 2;}
			:root:has(&[label="3"]) {--text-scale-log: 3;}
			:root:has(&[label="4"]) {--text-scale-log: 4;}
			:root:has(&[label="5"]) {--text-scale-log: 5;}
			:root:has(&[label="6"]) {--text-scale-log: 6;}
		}

		#selLumaScale option:checked {
			:root:has(&[value="-2"]) {
				--luma-scale: -2;
				color-scheme: dark;
			}
			:root:has(&[value="-1"]) {
				--luma-scale: -1;
				color-scheme: dark;
			}
			:root:has(&[value="1"]) {
				--luma-scale: 1;
				color-scheme: light;
			}
			:root:has(&[value="2"]) {
				--luma-scale: 2;
				color-scheme: light;
			}
		}

		#selHue option:checked {
			:root:has(&:nth-child(1)) {--hue1-int: 0;}
			:root:has(&:nth-child(2)) {--hue1-int: 1;}
			:root:has(&:nth-child(3)) {--hue1-int: 2;}
			:root:has(&:nth-child(4)) {--hue1-int: 3;}
			:root:has(&:nth-child(5)) {--hue1-int: 4;}
			:root:has(&:nth-child(6)) {--hue1-int: 5;}
			:root:has(&:nth-child(7)) {--hue1-int: 6;}
			:root:has(&:nth-child(8)) {--hue1-int: 7;}
			:root:has(&:nth-child(9)) {--hue1-int: 8;}
			:root:has(&:nth-child(10)) {--hue1-int: 9;}
			:root:has(&:nth-child(11)) {--hue1-int: 10;}
			:root:has(&:nth-child(12)) {--hue1-int: 11;}
		}

		#selContrastDrive option:checked {
			:root:has(&[label="-3"]) {--contrast-drive-int: -3;}
			:root:has(&[label="-2"]) {--contrast-drive-int: -2;}
			:root:has(&[label="-1"]) {--contrast-drive-int: -1;}
			:root:has(&[label="0"]) {--contrast-drive-int: 0;}
			:root:has(&[label="1"]) {--contrast-drive-int: 1;}
			:root:has(&[label="2"]) {--contrast-drive-int: 2;}
			:root:has(&[label="3"]) {--contrast-drive-int: 3;}
			:root:has(&[label="4"]) {--contrast-drive-int: 4;}
		}
	/*]]>*/</style>
</head>
<body>
	<p>
		<!-- (range inputs didn't reflect their state) Text scale <input type="range" id="rngTextScale" value="0" min="-1" max="1" step="1" /> -->
		<label for="selTextScale">Text scale</label> 
		<select id="selTextScale">
			<option label="-3"></option>
			<option label="-2"></option>
			<option label="-1"></option>
			<option label="0"></option>
			<option label="1"></option>
			<option label="2" selected="true"></option>
			<option label="3"></option>
			<option label="4"></option>
			<option label="5"></option>
			<option label="6"></option>
		</select>
	</p>
	<p>
		<label for="selLumaScale">Luma scheme</label> 
		<select id="selLumaScale">
			<option value="-2">dark extreme</option>
			<option value="-1" selected="true">dark</option>
			<option value="1">light</option>
			<option value="2">light extreme</option>
		</select>
	</p>
	<p>
		<label for="selHue">Hue</label> 
		<select id="selHue">
			<option selected="true">red</option>
			<option>orange</option>
			<option>yellow</option>
			<option>chartreuse</option>
			<option>green</option>
			<option>spring green</option>
			<option>cyan</option>
			<option>azure</option>
			<option>blue</option>
			<option>violet</option>
			<option>magenta</option>
			<option>rose</option>
		</select>
	</p>
	<p>
		<label for="selContrastDrive">Contrast</label> 
		<select id="selContrastDrive">
			<option label="-3"></option>
			<option label="-2"></option>
			<option label="-1"></option>
			<option label="0" selected="true"></option>
			<option label="1"></option>
			<option label="2"></option>
			<option label="3"></option>
			<option label="4"></option>
		</select>
	</p>
	<p>
		<input type="checkbox" id="chkAnimations" checked="true" /> <label for="chkAnimations">Animations</label>
	</p>
	<p>
		<button>Butt'n</button>
		<button><label for="chkAnimations">Butt'n</label></button>
		<!-- <label for="chkAnimations"><button>Butt'n</button></label> -->
	</p>
	<script type="text/javascript">/*<![CDATA[*/
		function buttonPressingKeyDown(event) {
			if(!event || !event.target) return;
			//console.log(event);
			//if(event.code == "Space")
			if(event.key == " ")
				event.target.classList.add("kb-pressed");
		}
		function buttonPressingKeyUp(event) {
			if(!event || !event.target) return;
			//console.log(event);
			//if(event.code == "Space")
			if(event.key == " ")
				event.target.classList.remove("kb-pressed");
		}
		function pageLoaded(event) {
			//makes button pressed state responsive to CSS
			for(let btn of document.querySelectorAll("button")) {
				btn.addEventListener("keydown", buttonPressingKeyDown);
				btn.addEventListener("keyup", buttonPressingKeyUp);
			}
		}

		if(document.readyState === "loading")
			document.addEventListener("DOMContentLoaded", pageLoaded);
		else //DOMContentLoaded has already fired
			pageLoaded();
		//window.addEventListener("load", pageReady);
	/*]]>*/</script>
</body>
</html>
