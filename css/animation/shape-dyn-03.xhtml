		@property --t1 {
			syntax: "\3c angle\3e";
			initial-value: 0turn;
			inherits: true;
		}
		@property --t2 {
			syntax: "\3c angle\3e";
			initial-value: 0turn;
			inherits: true;
		}
		@keyframes clock1 {
			to {--t1: 1turn;}
		}
		@keyframes clock2 {
			to {--t2: -1turn;}
		}

		:root {
			color-scheme: dark;
			/* background-color: Canvas;

			background-color: oklch(0.5 0.0625 55deg);
			color: oklch(1 0 55deg);

			inline-size: 100%;
			block-size: 100%;
			overflow: hidden;

			animation-name: clock1, clock2;
			animation-duration: 4s, 7s;
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}
		body {
			margin: 0;
			inline-size: 100%;
			block-size: 100%;
			overflow: hidden;

			display: flex;
			align-items: center;
			justify-content: center;

		@function --shp-distance(--ang <angle>) returns <percentage> {
			/* r = k * cos(l * t1 + m * ang) */
			result: calc(
				100% * var(--shp-scale) * (
					1 
					+ var(--wave1-amp) * cos(var(--t1) + var(--wave1-freq) * var(--ang))
					+ var(--wave2-amp) * cos(var(--t2) + var(--wave2-freq) * var(--ang))));
		}
		@function --shp-distance-diff(--ang <angle>) returns <percentage> {
			/* dr/dang = -k * sin(l * t1 + m * ang) * m */
			result: calc(
				-100% * var(--shp-scale) * (
					var(--wave1-amp) * sin(var(--t1) + var(--wave1-freq) * var(--ang)) * var(--wave1-freq)
					+ var(--wave2-amp) * sin(var(--t2) + var(--wave2-freq) * var(--ang)) * var(--wave2-freq)));
		}
		@function --shp-vertex(--i <integer>) returns type(<percentage>+) {
			--ang: calc(var(--i) * var(--ang-inc));
			--r: --shp-distance(var(--ang));

			result: 
				calc(var(--r) * cos(var(--ang)) + 50%)
				calc(var(--r) * sin(var(--ang)) + 50%);
		}
		/* @function --shp-ctl-pt(--i <integer>) returns type(<percentage>+) {

			--d: --shp-distance-diff(var(--ang));

			result:

				calc(var(--r) * sin(var(--ang)) + 50% + 0.25 * var(--d) * cos(var(--ang)));
		} */
		@function --shp-ctl-pt(--i <integer>, --t <integer>) returns type(<percentage>+) {
			--ang: calc(var(--i) * var(--ang-inc));
			--r: --shp-distance(var(--ang));
			/* --d: --shp-distance-diff(var(--ang)); */
			--tmult: calc(2 * var(--t) / var(--shp-points-count));
			--d: calc(var(--r) + var(--tmult) * --shp-distance-diff(var(--ang)));
			--sin: sin(var(--ang));
			--cos: cos(var(--ang));

			result: 
				calc(var(--d) * (var(--cos) - var(--tmult) * var(--sin)) + 50%)
				calc(var(--d) * (var(--sin) + var(--tmult) * var(--cos)) + 50%);
		}
