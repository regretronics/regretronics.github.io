<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS experiment: vars, animation, math functions, etc.</title>
	<style type="text/css">/*<![CDATA[*/
		@property --time-doc {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --time-off {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --time-on {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --time-off-last {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --time-on-last {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}

		/* @property --pos {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		} */

		@keyframes anim-doc {
			to {
				--time-doc: 3600;
			}
		}
		@keyframes anim-off {
			to {
				--time-off: 3600;
			}
		}
		@keyframes anim-on {
			to {
				--time-on: 3600;
			}
		}
		@keyframes anim-off-last {
			to {
				--time-off-last: 3600;
			}
		}
		@keyframes anim-on-last {
			to {
				--time-on-last: 3600;
			}
		}

		:root {
			color-scheme: dark;
			background-color: Canvas;
			color: CanvasText;
			font-size: 2em;

			animation-name: anim-doc, anim-off, anim-on, anim-off-last;
			animation-play-state: running, running, paused, running;
			animation-duration: 3600s;
			animation-timing-function: linear;
			/* animation-iteration-count: infinite; */
			/* animation-composition: add; */
			animation-fill-mode: forwards;

			--time-doc-switch: calc(var(--time-doc) - var(--time-off-last));
			--time-state-switch: calc(var(--time-off) - var(--time-off-last));

			/* --balance: calc(var(--time-on) / (var(--time-doc) + 0.001)); */
			--balance: calc(0.5 + 0.5 * (var(--time-on) - var(--time-off)) / (var(--time-doc) + 0));
			/* --balance: calc(1.0 / (1.0 + exp((var(--time-off) - var(--time-on)) / sqrt(var(--time-doc) + 0)))); */
			/* --pos0: calc(0.5 + 0.5 * (1.0 - pow(0.5, var(--time-on)))); */
			--pos0: calc(1.0 / (1.0 + exp(var(--time-state-switch) - var(--time-on))));
			/* --pos: calc(0.5 * pow(0.5, var(--time-off-last)) + 0.5 * (1.0 - pow(0.5, var(--time-on)))); */
			--pos: calc(1.0 / (1.0 + exp(var(--time-off) - var(--time-on))));

			&:has(#chkState:checked) {
				animation-name: anim-doc, anim-off, anim-on, anim-on-last;
				animation-play-state: running, paused, running, running;

				--time-doc-switch: calc(var(--time-doc) - var(--time-on-last));
				--time-state-switch: calc(var(--time-on) - var(--time-on-last));

				/* --pos0: calc(0.5 - 0.5 * (1.0 - pow(0.5, var(--time-off)))); */
				--pos0: calc(1.0 / (1.0 + exp(var(--time-off) - var(--time-state-switch))));
				/* --pos: calc(1 - 0.5 * pow(0.5, var(--time-on-last)) + 0.5 * pow(0.5, var(--time-off))); */
			}
		}

		.gauge {
			width: 80%;
			background-color: oklch(0.5 0 0deg / 0.5);
			margin-block-end: 0.5em;
			& > div:nth-child(1) {
				background-color: oklch(0.5 0.15625 55deg);
				text-wrap-mode: nowrap;
				overflow-inline: visible;
			}

			:nth-child(1 of &) { /*works better than :nth-of-type() (more specialized)*/
				& > div:nth-child(1) { width: calc(100% * var(--time-doc) / 60.0); }
			}
			:nth-child(2 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-off) / 60.0); }
			}
			:nth-child(3 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-on) / 60.0); }
			}
			:nth-child(4 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-off-last) / 60.0); }
			}
			:nth-child(5 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-on-last) / 60.0); }
			}
			:nth-child(6 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-doc-switch) / 60.0); }
			}
			:nth-child(7 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--time-state-switch) / 60.0); }
			}
			:nth-child(8 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--balance)); }
			}
			:nth-child(9 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--pos0)); }
			}
			:nth-child(10 of &) {
				& > div:nth-child(1) { width: calc(100% * var(--pos)); }
			}
		}

		input, textarea, button, select {
			font-size: inherit;
		}
		input:is([type=checkbox], input[type=radio]) {
			/* block-size: 1em; */
			/* inline-size: 1em; */
			/* vertical-align: baseline; */
			vertical-align: middle;
			block-size: 1cap;
			inline-size: 1cap;
			margin-inline: 0em;
			color: inherit;

			& + label {
				/* vertical-align: middle; */
				/* margin-inline: 0.125em; */
				padding-inline: 0.25em;
				/* @starting-style {
					color: oklch(0.75 0.03125 var(--hue1-ang, 0deg));
				} */
			}
			&:not(:checked) + label {
				color: oklch(0.75 0.03125 55deg / 0.8);
			}
			&:checked + label {
				color: oklch(0.875 0.1875 55deg);
			}
		}
	/*]]>*/</style>
</head>
<body>
	<p>
		<input type="checkbox" id="chkState" />
		<label for="chkState">State</label>
	</p>
	<div class="gauge"><div>--time-doc</div></div>
	<div class="gauge"><div>--time-off</div></div>
	<div class="gauge"><div>--time-on</div></div><br />

	<div class="gauge"><div>--time-off-last</div></div>
	<div class="gauge"><div>--time-on-last</div></div><br />

	<div class="gauge"><div>--time-doc-switch</div></div>
	<div class="gauge"><div>--time-state-switch</div></div><br />

	<div class="gauge"><div>--balance</div></div>
	<div class="gauge"><div>--pos0</div></div>
	<div class="gauge"><div>--pos</div></div>
</body>
</html>
