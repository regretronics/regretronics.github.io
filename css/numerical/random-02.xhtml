<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS experiment: PRNG, interpolation</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "<number>";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes anim1 {
			/* from {
				--t: 79900;
			} */
			to {
				/* --t: var(--dur); */ /*var() here doesn't work in Firefox*/
				--t: 86400;
			}
		}
		:root {
			color-scheme: dark;
			font-size: 3em;

			--dur: 86400;
			/* --c: sibling-index(); */

			/* Firefox (v142) seems to use single-precision numbers. from ti = 64 on it works poorly (it barely offers two decimal digits). */
			--ti: round(down, var(--start) + var(--t));
			--ti1: calc(var(--ti) + 1);
			--ti2: calc(var(--ti) + 2);
			--ti3: calc(var(--ti) + 3);

			--tfrac: mod(var(--t), 1);
			--tfrac1: calc(1 - var(--tfrac));
			--interp-hermite-00: calc((1 + 2 * var(--tfrac)) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-10: calc(var(--tfrac) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-01: calc(var(--tfrac) * var(--tfrac) * (3 - 2 * var(--tfrac)));
			--interp-hermite-11: calc(-1 * var(--tfrac) * var(--tfrac) * var(--tfrac1));

			/* --rnd-exp: calc(0.5 + 0.5 * sqrt(5));
			--rnd-ratio: 0.64575131106459059;
			--rnd: mod(pow(var(--ti), var(--rnd-exp)) + var(--rnd-ratio) * var(--ti) + e, 1);
			--rnd1: mod(pow(var(--ti1), var(--rnd-exp)) + var(--rnd-ratio) * var(--ti1) + e, 1); */
			/* --rnd: calc(pow(var(--ti), var(--rnd-exp)) + var(--ti) * pi + e);
			--rnd1: calc(pow(var(--ti1), var(--rnd-exp)) + var(--ti1) * pi + e); */

			--rnd-ratio1: mod(sqrt(7), 1);
			--rnd-ratio2: mod(pow(349, -1 / 5), 1);
			--rnd-ratio3: mod(pow(3181, 1 / 3), 1);
			--rnd-exp1: calc(pi * 2 / 3);
			--rnd-exp2: calc(20 / 7);
			--rnd-exp3: calc(110 / 113);
			--rnd-offset: mod(pow(1451, 1 / 7), 1);

			--tilog: log(var(--ti) + pi);
			--ti1log: log(var(--ti1) + pi);
			--ti2log: log(var(--ti2) + pi);
			--ti3log: log(var(--ti3) + pi);
			--rnd-parcel1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog)), 
				1);
			--rnd-parcel2: mod(
				var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog)), 
				1);
			--rnd-parcel3: mod(
				var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog)), 
				1);
			--rnd: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog)) 
				+ var(--rnd-offset), 
				1);
			--rnd1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3log)) 
				+ var(--rnd-offset), 
				1);

			/* --rnd-interp: calc(
				var(--interp-hermite-00) * var(--rnd1)
				+ var(--interp-hermite-10) * 0.5 * (var(--rnd2) - var(--rnd))
				+ var(--interp-hermite-01) * var(--rnd2)
				+ var(--interp-hermite-11) * 0.5 * (var(--rnd3) - var(--rnd1))
			); */
			--rnd-interp: calc(
				var(--interp-hermite-00) * var(--rnd1)
				+ var(--interp-hermite-10) * 0.735 * (var(--rnd2) - var(--rnd))
				+ var(--interp-hermite-01) * var(--rnd2)
				+ var(--interp-hermite-11) * 0.735 * (var(--rnd3) - var(--rnd1))
			);

			animation-name: anim1;
			animation-duration: calc(1s * var(--dur));
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}
		#selStart :checked {
			:root:has(&[label="0"]) {--start: 0;}
			:root:has(&[label="1"]) {--start: 1;}
			:root:has(&[label="2"]) {--start: 2;}
			:root:has(&[label="4"]) {--start: 4;}
			:root:has(&[label="8"]) {--start: 8;}
			:root:has(&[label="16"]) {--start: 16;}
			:root:has(&[label="32"]) {--start: 32;}
			:root:has(&[label="64"]) {--start: 64;}
			:root:has(&[label="128"]) {--start: 128;}
			:root:has(&[label="256"]) {--start: 256;}
			:root:has(&[label="512"]) {--start: 512;}
			:root:has(&[label="1024"]) {--start: 1024;}
			:root:has(&[label="2048"]) {--start: 2048;}
			:root:has(&[label="4096"]) {--start: 4096;}
			:root:has(&[label="8192"]) {--start: 8192;}
			:root:has(&[label="16384"]) {--start: 16384;}
			:root:has(&[label="32768"]) {--start: 32768;}
			:root:has(&[label="65536"]) {--start: 65536;}
		}
		select {
			font-size: inherit;
		}

		@counter-style dec-frac3-sign {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 4 "0";
			range: infinite -1;
			fallback: dec-frac3;
		}
		@counter-style dec-frac3 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 3 "0";
		}
		@counter-style dec-frac9 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 9 "0";
		}
		@counter-style sign {
			system: cyclic;
			symbols: "" "" "-";
		}
		.show-number {
			white-space-collapse: break-spaces;
		}
		.show-number::after {
			--val-round: calc(var(--val) + sign(var(--val)) * 0.5 * pow(0.1, var(--places)));
		}
		.show-number.int::after {
			counter-reset: val round(to-zero, var(--val));
			content: counter(val);
		}
		.show-number.frac::after {
			--places: 9;
			counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val));
			content: counter(val, dec-frac9);
		}
		.show-number.num::after {
			--places: 3;

			counter-reset: 
				val-sign calc(sign(var(--val-round)) + 1) 
				val abs(round(to-zero, var(--val-round), 1)) 
				val-frac round(to-zero, pow(10, var(--places)) * mod(abs(var(--val-round)), 1), 1);
			content: counter(val-sign, sign) counter(val) "." counter(val-frac, dec-frac3);

			/* counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val-round));
			content: counter(val, dec-frac3-sign); */
		}

		.bar {
			/* position: absolute; */
			height: 1em;
			width: calc(100% * var(--val));

			background-color: oklch(0.375 0 0deg);
			text-wrap-mode: nowrap;
		}
		.bar::after {
			position: absolute;
			opacity: 0.6;
		}
		#outT {--val: var(--ti);}
		#rndParcel1 {--val: var(--rnd-parcel1);}
		#rndParcel2 {--val: var(--rnd-parcel2);}
		#rndParcel3 {--val: var(--rnd-parcel3);}
		#rndBar {--val: var(--rnd);}
		#rnd1Bar {--val: var(--rnd1);}
		#rnd2Bar {--val: var(--rnd2);}
		#rnd3Bar {--val: var(--rnd3);}
		#interp {--val: var(--rnd-interp);}
	/*]]>*/</style>
</head>
<body>
	<p>
		<label for="selStart">Start:</label> <select id="selStart">
			<option label="0" selected="selected"></option>
			<option label="1"></option>
			<option label="2"></option>
			<option label="4"></option>
			<option label="8"></option>
			<option label="16"></option>
			<option label="32"></option>
			<option label="64"></option>
			<option label="128"></option>
			<option label="256"></option>
			<option label="512"></option>
			<option label="1024"></option>
			<option label="2048"></option>
			<option label="4096"></option>
			<option label="8192"></option>
			<option label="16384"></option>
			<option label="32768"></option>
			<option label="65536"></option>
		</select>
		<!-- <output class="show-number" id="outT" xml:space="preserve">ti: </output> --><!-- Chrome (as of v140) trims the final white space, unlike Firefox. -->
		<output class="show-number int" id="outT">ti:&#32;</output>
	</p>
	<p class="bar show-number frac" id="rndParcel1">rnd-parcel1: </p>
	<p class="bar show-number frac" id="rndParcel2">rnd-parcel2: </p>
	<p class="bar show-number frac" id="rndParcel3">rnd-parcel3: </p>
	<p class="bar show-number frac" id="rndBar">rnd: </p>
	<p class="bar show-number frac" id="rnd1Bar">rnd1: </p>
	<p class="bar show-number frac" id="rnd2Bar">rnd2: </p>
	<p class="bar show-number frac" id="rnd3Bar">rnd3: </p>
	<p class="bar show-number num" id="interp">interp: </p>
</body>
</html>
