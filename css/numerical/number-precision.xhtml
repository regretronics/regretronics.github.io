<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS experiment: number precision</title>
	<style type="text/css">/*<![CDATA[*/
		@property --magnitude {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@keyframes magnitudeRamp {
			from {--magnitude: 0;}
			to {--magnitude: 31;}
		}
		:root {
			color-scheme: dark;
			background-color: oklch(0.125 0 0deg);
			color: oklch(0.875 0 0deg);

			font-size: 2em;
			font-variant: slashed-zero;
			overflow-wrap: break-word; /*2024-08: fix for Chrome vs. Ffx layout differences and Chrome layout bug*/

			--t: 100;
			/* Firefox (v142) seems to use single-precision numbers. from ti = 100 on it works poorly. */
			--ti: round(down, var(--t));

			/* --rnd-ratio1: mod(sqrt(7), 1);
			--rnd-ratio2: mod(pow(349, 1 / 5), -1);
			--rnd-ratio3: mod(pow(3181, 1 / 3), 1);
			--rnd-exp1: calc(pi * 2 / 3);
			--rnd-exp2: calc(20 / 7);
			--rnd-exp3: calc(110 / 113);
			--rnd-offset: mod(pow(1451, 1 / 7), 1);

			--tilog: log(var(--ti) + pi);
			--rnd: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog)) 
				+ var(--rnd-offset), 
				1); */
			/* --overhead: pow(10, 7); */
			--overhead: pow(2, var(--magnitude));
			--start: pi;
			--x: calc(var(--start) + var(--overhead));
			--diff: calc(var(--x) - var(--overhead));

			--magnitude: 23;
			@supports (animation-timeline: --scrollBar1-position) {
				timeline-scope: --scrollBar1-position;
				animation-name: magnitudeRamp;
				animation-duration: 1ms;
				animation-timing-function: linear;
				animation-fill-mode: both;
				animation-timeline: --scrollBar1-position;
			}
		}
		#selN :checked {
			:root:has(&[label="-512"]) {--n: -512;}
			:root:has(&[label="-256"]) {--n: -256;}
			:root:has(&[label="-128"]) {--n: -128;}
			:root:has(&[label="-64"]) {--n: -64;}
			:root:has(&[label="-32"]) {--n: -32;}
			:root:has(&[label="-16"]) {--n: -16;}
			:root:has(&[label="-8"]) {--n: -8;}
			:root:has(&[label="-4"]) {--n: -4;}
			:root:has(&[label="-2"]) {--n: -2;}
			:root:has(&[label="-1"]) {--n: -1;}
			:root:has(&[label="0"]) {--n: 0;}
			:root:has(&[label="1"]) {--n: 1;}
			:root:has(&[label="2"]) {--n: 2;}
			:root:has(&[label="4"]) {--n: 4;}
			:root:has(&[label="8"]) {--n: 8;}
			:root:has(&[label="16"]) {--n: 16;}
			:root:has(&[label="32"]) {--n: 32;}
			:root:has(&[label="64"]) {--n: 64;}
			:root:has(&[label="128"]) {--n: 128;}
			:root:has(&[label="256"]) {--n: 256;}
			:root:has(&[label="512"]) {--n: 512;}
		}
		#selBase :checked {
			:root:has(&[label="0"]) {--b: 0;}
			:root:has(&[label="0.5"]) {--b: 0.5;}
			:root:has(&[label="1"]) {--b: 1;}
			:root:has(&[label="1.0625"]) {--b: 1.0625;}
			:root:has(&[label="1.125"]) {--b: 1.125;}
			:root:has(&[label="1.25"]) {--b: 1.25;}
			:root:has(&[label="1.5"]) {--b: 1.5;}
			:root:has(&[label="2"]) {--b: 2;}
			:root:has(&[label="e"]) {--b: e;}
			:root:has(&[label="4"]) {--b: 4;}
			:root:has(&[label="8"]) {--b: 8;}
			:root:has(&[label="10"]) {--b: 10;}
			:root:has(&[label="16"]) {--b: 16;}
			:root:has(&[label="32"]) {--b: 32;}
			:root:has(&[label="64"]) {--b: 64;}
			:root:has(&[label="128"]) {--b: 128;}
			:root:has(&[label="256"]) {--b: 256;}
			:root:has(&[label="512"]) {--b: 512;}
		}

		select {
			font-size: inherit;
		}
		body > div {
			margin-block: 1em;
		}

		.scroll-bar {
			--scale: 0.5;
			--width: 16em;
			--height: 2em;
			display: inline-block;
			scale: var(--scale);
			width: var(--width);
			max-width: calc(100% / var(--scale));
			height: var(--height);
			vertical-align: middle;

			margin-block: calc(-0.5 * var(--scale) * var(--height));
			margin-inline: calc(-0.5 * var(--scale) * var(--width));
			overflow-x: scroll;
			overflow-y: hidden;
			contain: strict;

			background-color: oklch(0.25 0 0deg);
		}
		@supports (animation-timeline: --scrollBar1-position) {
			.no-scroll-bar {display: none;}
			#scrollBar1 {
				scroll-timeline: --scrollBar1-position inline;
			}
		}
		@supports not (animation-timeline: --scrollBar1-position) {
			.scroll-bar, #outMagn {display: none;}
			#selMagn :checked {
				:root:has(&[label="0"]) {--magnitude: 0;}
				:root:has(&[label="1"]) {--magnitude: 1;}
				:root:has(&[label="2"]) {--magnitude: 2;}
				:root:has(&[label="3"]) {--magnitude: 3;}
				:root:has(&[label="4"]) {--magnitude: 4;}
				:root:has(&[label="5"]) {--magnitude: 5;}
				:root:has(&[label="6"]) {--magnitude: 6;}
				:root:has(&[label="7"]) {--magnitude: 7;}
				:root:has(&[label="8"]) {--magnitude: 8;}
				:root:has(&[label="9"]) {--magnitude: 9;}
				:root:has(&[label="10"]) {--magnitude: 10;}
				:root:has(&[label="11"]) {--magnitude: 11;}
				:root:has(&[label="12"]) {--magnitude: 12;}
				:root:has(&[label="13"]) {--magnitude: 13;}
				:root:has(&[label="14"]) {--magnitude: 14;}
				:root:has(&[label="15"]) {--magnitude: 15;}
				:root:has(&[label="16"]) {--magnitude: 16;}
				:root:has(&[label="17"]) {--magnitude: 17;}
				:root:has(&[label="18"]) {--magnitude: 18;}
				:root:has(&[label="19"]) {--magnitude: 19;}
				:root:has(&[label="20"]) {--magnitude: 20;}
				:root:has(&[label="21"]) {--magnitude: 21;}
				:root:has(&[label="22"]) {--magnitude: 22;}
				:root:has(&[label="23"]) {--magnitude: 23;}
				:root:has(&[label="24"]) {--magnitude: 24;}
				:root:has(&[label="25"]) {--magnitude: 25;}
				:root:has(&[label="26"]) {--magnitude: 26;}
				:root:has(&[label="27"]) {--magnitude: 27;}
				:root:has(&[label="28"]) {--magnitude: 28;}
				:root:has(&[label="29"]) {--magnitude: 29;}
				:root:has(&[label="30"]) {--magnitude: 30;}
			}
		}
		.scroll-area {
			width: 1600%;
			height: 100%;

			padding: 0;
			border-width: 0;
			contain: strict;

			background: linear-gradient(to right, black, white);

			& .label {
				position: absolute;
				font-variant: small-caps;

				&.min {
					left: 0;
					color: white;
				}
				&.max {
					right: 0;
					color: black;
				}
			}
		}

		@counter-style dec-frac3 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 3 "0";
		}
		@counter-style dec-frac9 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 9 "0";
		}
		@supports (min-width: calc(1ch * attr(data-width type(\<number\>), 4))) {
			output[data-width] {
				display: inline-block;
				min-width: calc(1ch * attr(data-width type(<number>), 4));
			}
		}
		#outMagn::after {
			--val: var(--magnitude);
			--places: 3;
			--fmt: dec-frac3;
		}
		#outOverhead::after {
			--val: var(--overhead);
			--places: 3;
			--fmt: dec-frac3;
		}
		#outStart::after {
			--val: var(--start);
			--places: 9;
			--fmt: dec-frac9;
		}
		#outDiff::after {
			--val: var(--diff);
			--places: 9;
			--fmt: dec-frac9;
		}
		#outExp:after {
			/* --val: exp(var(--n)); */
			--val: pow(var(--b), var(--n));
			--places: 9;
			--fmt: dec-frac9;
		}
		output {
			text-align: end;
		}
		output:not(.exp)::after {
			/* --val-round3: calc(var(--val) + 1 * 0.5 * 0.001); */
			/* --val-round3: calc(var(--val) + sign(var(--val)) * 0.5 * 0.001); */
			--val-round: calc(var(--val) + sign(var(--val)) * 0.5 * pow(0.1, var(--places)));

			/* counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val)); */
			/* counter-reset: 
				cnt round(to-zero, var(--val-round3), 1) 
				cnt-frac round(to-zero, 1000 * mod(var(--val-round3), 1), 1); */
			counter-reset: 
				cnt round(to-zero, var(--val-round), 1) 
				cnt-frac round(to-zero, pow(10, var(--places)) * mod(var(--val-round), 1), 1);

			content: counter(cnt) "." counter(cnt-frac, var(--fmt, dec-frac3));
		}
		output.exp::after {
			--val-mag: round(down, log(var(--val), 10), 1);
			--val-mant: calc(var(--val) * pow(0.1, var(--val-mag))); /* significand or mantissa */
			--val-round: calc(var(--val-mant) + sign(var(--val-mant)) * 0.5 * pow(0.1, var(--places)));

			counter-reset: 
				cnt-mant1 round(to-zero, var(--val-round), 1) 
				cnt-mant2 round(to-zero, pow(10, var(--places)) * mod(var(--val-round), 1), 1) 
				cnt-mag var(--val-mag);

			content: counter(cnt-mant1) "." counter(cnt-mant2, var(--fmt, dec-frac3)) "e" counter(cnt-mag);
		}
		/* #rndBar {
			--val: var(--rnd);
		}
		#rndBar::after {
			content: "rnd: " counter(cnt) "." counter(cnt-frac, dec-frac);
		} */
	/*]]>*/</style>
</head>
<body>
	<div>
		Magnitude: <output id="outMagn" data-width="6"></output> 
		<div id="scrollBar1" class="scroll-bar">
			<div class="scroll-area">
				<span class="label min">minimum</span>
				<span class="label max">maximum</span>
			</div>
		</div>
		<select id="selMagn" class="no-scroll-bar">
			<option label="0" selected="selected"></option>
			<option label="1"></option>
			<option label="2"></option>
			<option label="3"></option>
			<option label="4"></option>
			<option label="5"></option>
			<option label="6"></option>
			<option label="7"></option>
			<option label="8"></option>
			<option label="9"></option>
			<option label="10"></option>
			<option label="11"></option>
			<option label="12"></option>
			<option label="13"></option>
			<option label="14"></option>
			<option label="15"></option>
			<option label="16"></option>
			<option label="17"></option>
			<option label="18"></option>
			<option label="19"></option>
			<option label="20"></option>
			<option label="21"></option>
			<option label="22"></option>
			<option label="23"></option>
			<option label="24"></option>
			<option label="25"></option>
			<option label="26"></option>
			<option label="27"></option>
			<option label="28"></option>
			<option label="29"></option>
			<option label="30"></option>
		</select>
	</div>
	<div>Overhead: <output id="outOverhead" data-width="10"></output></div>
	<div>Starting value: <output id="outStart" data-width="4"></output></div>
	<div>Diff: <output id="outDiff" data-width="10"></output></div>
	<div>
		<label for="selBase">b:</label> <select id="selBase">
			<option label="0"></option>
			<option label="0.5"></option>
			<option label="1"></option>
			<option label="1.0625"></option>
			<option label="1.125"></option>
			<option label="1.25"></option>
			<option label="1.5"></option>
			<option label="2" selected="selected"></option>
			<option label="e"></option>
			<option label="4"></option>
			<option label="8"></option>
			<option label="10"></option>
			<option label="16"></option>
			<option label="32"></option>
			<option label="64"></option>
			<option label="128"></option>
			<option label="256"></option>
			<option label="512"></option>
		</select>
		<label for="selN">n:</label> <select id="selN">
			<option label="-512"></option>
			<option label="-256"></option>
			<option label="-128"></option>
			<option label="-64"></option>
			<option label="-32"></option>
			<option label="-16"></option>
			<option label="-8"></option>
			<option label="-4"></option>
			<option label="-2"></option>
			<option label="-1"></option>
			<option label="0" selected="selected"></option>
			<option label="1"></option>
			<option label="2"></option>
			<option label="4"></option>
			<option label="8"></option>
			<option label="16"></option>
			<option label="32"></option>
			<option label="64"></option>
			<option label="128"></option>
			<option label="256"></option>
			<option label="512"></option>
		</select>
		b^n: <output id="outExp" class="exp" data-width="8"></output>
	</div>
</body>
</html>
