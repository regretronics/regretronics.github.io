<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />

	<title>CSS experiment: hues and color spaces</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			color-scheme: dark;
			--hue-phase: 0;
			--sat: 0.125;
			--lgt-ref: 0.5;
			--lgt-colors: 0.5;

			--cl-space: rec2020;
			--fr: 1;
			--fg: 1;
			--fb: 1;
			--gain-balance: var(--cl-space, srgb) calc(r * var(--fr)) calc(g * var(--fg)) calc(b * var(--fb));
		}
		/* #selSaturation {
			width: 12ch;
			background-image: linear-gradient(0.25turn in oklch longer hue, oklch(0.5 var(--sat, 0.25) 0turn) 0% 100%);
		} */
		input[type=number] {
			text-align: right;
			/* width: 10ch; */
			--step: attr(step type(<number>), 1);
			--digits: log(var(--step, 1), 0.5);
			width: calc(5em/16 + 3ch + var(--digits, 0)*1ch);
		}

		@property --test-color {
			syntax: "\3c color\3e | auto";
			inherits: true;
			initial-value: auto;
		}
		#selColorSpace option {
			--test-color: color(attr(label type(*)) 0 0 0);
			background-color: if(
				style(--test-color: auto): oklch(0.25 0.125 25deg); 
				else: unset;);
			color: if(
				style(--test-color: auto): oklch(0.75 0.125 25deg); 
				else: unset;);

			/* &::after {
				content: if(
				style(--test-color: auto): " \002717"; 
				else: " \002713";);
			} */
		}
		/* didn't work */
		/* @container style(--test-color: auto) {
			option {
				background-color: rosybrown;
				color: brown;
			}
		} */

		/* @property --hue-int {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0;
		} */
		@property --c {
		/* @property sh-hue { */
			syntax: "\3c number\3e";
			/* syntax: "\3c integer\3e"; */
			inherits: true;
			initial-value: 1;
			/* initial-value: sh-hue; */
			/* initial-value: counter(sh-hue); */
			/* initial-value: counter(sh-hue, decimal); */
			/* initial-value: counter(sh-hue, integer); */
			/* initial-value: counter(sh-hue, <integer>); */
			/* initial-value: counter(sh-hue, number); */
			/* initial-value: counter(sh-hue, <number>); */
		}
		.shade-group {
			display: flex;
			flex-direction: row;
			counter-reset: sh-hue 0;
			/* counter-reset: --c 0; */
			user-select: none;
			padding: 0.25ch;
			gap: 0.25ch;
			background-color: color(var(--cl-space, srgb) calc(var(--lgt-ref, 0.5) * var(--fr)) calc(var(--lgt-ref, 0.5) * var(--fg)) calc(var(--lgt-ref, 0.5) * var(--fb)));
		}
		.shade-group > span {
			block-size: 4em;
			inline-size: 1em;
			flex-grow: 1;
			flex-shrink: 1;
			display: flex;

			/* border: solid gray 0.125ch; */
			/* border-style: solid;
			border-width: 0.25ch; */
			/* border-color: color(display-p3 var(--lgt-ref, 0.5) var(--lgt-ref, 0.5) var(--lgt-ref, 0.5)); */
			/* border-color: color(var(--cl-space, srgb) calc(var(--lgt-ref, 0.5) * var(--fr)) calc(var(--lgt-ref, 0.5) * var(--fg)) calc(var(--lgt-ref, 0.5) * var(--fb))); */

			counter-increment: sh-hue;
			/* counter-increment: --c; */
			--hue-int: attr(data-hue-int type(<number>));
			/* --hue-int: counter(sh-hue, numeric); */
			--cl-radial: oklch(var(--lgt-colors, 0.5) var(--sat, 0.125) calc(var(--hue-phase, 0) * 1turn + var(--hue-int, 0) * 1turn / 12));
			/* background-color: var(--cl-radial, gray); */
			background-color: color(from var(--cl-radial, gray) var(--gain-balance));

			/* background-color: oklch(0.5 0.2 calc(var(--hue-int, 0) * 1turn / 12));
			background-color: oklch(0.5 50% calc(var(--hue-int, 0) * 1turn / 12)); */

			&/* :hover */::before {
				margin: auto;

				/* --c: calc(var(--c, 0) + 1); */
				/* --c: calc(initial + 1); */
				/* --c: calc(inherit + 1); */
				/* --c: sh-hue; */
				/* --c: "3"; */
				/* --c: calc('3'); */
				/* --c: calc(counter(sh-hue, decimal)); */
				/* --c: var(sh-hue); */
				/* --c: counter(sh-hue); */
				/* --c: counter(sh-hue number); */
				/* --c: counter(sh-hue integer); */
				/* --c: counter(sh-hue decimal); */
				/* --c: counter(sh-hue <number>); */
				/* --c: counter(sh-hue <integer>); */
				/* --c: counter(sh-hue type(<number>)); */
				/* --c: counter(sh-hue type(<integer>)); */
				/* --c: counter(sh-hue, decimal); */
				/* --c: counter(sh-hue, integer); */
				/* --c: counter(sh-hue, <integer>); */
				/* --c: counter(sh-hue, number); */
				/* --c: counter(sh-hue, <number>); */
				/* font-size: calc(1em * var(--c, 0.5)); */

				content: counter(sh-hue);
				/* content: counter(--c); */
				text-shadow: 0 0 0.5ch black;
			}
		}
		#lstShadeValues {
			/* clear: both; */
			& li {
				font-family: monospace;
			}
		}
	/*]]>*/</style>
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	function updateColorList() {
		lstShadeValues.innerHTML = "";
		for(const shadeElem of document.querySelectorAll(".shade-group > span")) {
			const shadeItem = lstShadeValues.appendChild(document.createElement("li"));
			shadeItem.textContent = getComputedStyle(shadeElem).getPropertyValue("background-color");
		}
	}
	function txtParamsInput(event) {
		if(!event || !event.target) return;
		const elem = event.target;
		//document.documentElement.style.setProperty("--sat", parseFloat(txtSaturation.value) / 16.0);
		document.documentElement.style.setProperty(elem.dataset.property, elem.valueAsNumber);
		updateColorList();
	}
	function selColorSpaceInput(event) {
		if(!event || !event.target) return;
		const elem = event.target;
		//const cSpace = elem.value;
		const cSpace = elem.selectedOptions[0].label;
		document.documentElement.style.setProperty(elem.dataset.property, cSpace);
		document.documentElement.style.setProperty("--gain-balance", cSpace.toLowerCase().startsWith("xyz") ?
			"var(--cl-space, xyz) calc(x * var(--fr)) calc(y * var(--fg)) calc(z * var(--fb))":
			"var(--cl-space, srgb) calc(r * var(--fr)) calc(g * var(--fg)) calc(b * var(--fb))");
		updateColorList();
	}

	function pageLoaded(event) {
		//starting point
		//document.documentElement.style.setProperty("--sat", Math.random() + "turn");

		//load HTML element references (renders document.getElementById unnecessary)
		for(let s of document.querySelectorAll("[id]"))
			window[s.id] = s;
	}
	function pageReady(event) {
		//trap UI changes
		/* txtSaturation.addEventListener("input", txtParamsInput);
		txtLightnessRef.addEventListener("input", txtParamsInput);
		txtLightnessColors.addEventListener("input", txtParamsInput); */
		document.querySelectorAll("input[type=number][data-property]").forEach(elem => {
			elem.addEventListener("input", txtParamsInput);
		});
		selColorSpace.addEventListener("input", selColorSpaceInput);
		updateColorList();
	}
	if(document.readyState === "loading")
		document.addEventListener("DOMContentLoaded", pageLoaded);
	else //DOMContentLoaded has already fired
		pageLoaded();
	window.addEventListener("load", pageReady);
	/*]]>*/</script>
</head>
<body>
	<p>
		<label for="txtSaturation">Saturation</label> 
		<input type="number" id="txtSaturation" value="0.125" step="0.03125" data-property="--sat" /> 
		<label for="selColorSpace">Target color space</label> 
		<select id="selColorSpace" data-property="--cl-space">
			<option label="srgb"></option>
			<option label="srgb-linear"></option>
			<option label="a98-rgb"></option>
			<option label="display-p3"></option>
			<option label="display-p3-linear"></option>
			<option label="prophoto-rgb"></option>
			<option label="rec2020" selected="selected"></option>
			<option label="rec2100"></option>
			<option label="rec2100-linear"></option>
			<option label="rec2100-display-linear"></option>
			<option label="rec2100-pq"></option>
			<option label="rec2100-hlg"></option>
			<option label="xyz"></option>
			<option label="xyz-d50"></option>
			<option label="xyz-d65"></option>
		</select>
	</p>
	<p>
		<label for="txtLightnessRef">Lightness, ref.</label> 
		<input type="number" id="txtLightnessRef" value="0.5" step="0.03125" data-property="--lgt-ref" /> 
		<label for="txtLightnessColors">Lightness, colors</label> 
		<input type="number" id="txtLightnessColors" value="0.5" step="0.03125" data-property="--lgt-colors" />
	</p>
	<p>
		<label for="txtGainR">Gain, red</label> 
		<input type="number" id="txtGainR" value="1" step="0.03125" data-property="--fr" /> 
		<label for="txtGainG">Gain, green</label> 
		<input type="number" id="txtGainG" value="1" step="0.03125" data-property="--fg" /> 
		<label for="txtGainB">Gain, blue</label> 
		<input type="number" id="txtGainB" value="1" step="0.03125" data-property="--fb" />
	</p>
	<p>
		<label for="txtHuePhase">Hue phase (turns)</label> 
		<input type="number" id="txtHuePhase" value="0" step="0.00390625" data-property="--hue-phase" /> 
	</p>
	<p class="shade-group">
		<span data-hue-int="0"></span>
		<span data-hue-int="1"></span>
		<span data-hue-int="2"></span>
		<span data-hue-int="3"></span>
		<span data-hue-int="4"></span>
		<span data-hue-int="5"></span>
		<span data-hue-int="6"></span>
		<span data-hue-int="7"></span>
		<span data-hue-int="8"></span>
		<span data-hue-int="9"></span>
		<span data-hue-int="10"></span>
		<span data-hue-int="11"></span>
	</p>
	<ol id="lstShadeValues">
	</ol>
</body>
</html>
