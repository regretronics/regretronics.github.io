<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>System colors</title>
	<style type="text/css">/*<![CDATA[*/
	:root {
		background-color: oklab(0.5 0 0);
		background-clip: padding-box;
		background-image: linear-gradient(oklab(0.5 0 0 / 0.5)), url("../../assets/pattern-neutral-soft.svg");
		background-size: cover, 2em 2em;
		background-repeat: initial, repeat;
		background-position: initial, center;

		color: CanvasText;
		/* font-size: 1.25em; */
		/* font-size: 2.5vmin; */
		font-size: calc(1.5vmin + 1.5vmax);
	}
	body {
		/* overflow-wrap: break-word; */ /* 2024-08: fix for Chrome vs. Ffx layout differences and Chrome layout bug */
	}

	.paragraph {
		margin-block: 1em;
		padding-block: 0.5em;
		padding-inline: 0.5em;
		border-radius: 0.5em;
		/* line-height: 1.25lh; */

		&:first-child {
			margin-block-start: 0em;
		}
		&:last-child {
			margin-block-end: 0em;
		}
	}
	.light, .dark {
		/* background-color: Canvas;
		color: CanvasText; */
		background-color: color(from Canvas xyz x y z / calc(0.5 * alpha));
		color: color(from CanvasText xyz x y z / alpha);
	}
	.light {
		color-scheme: light;
	}
	.dark {
		color-scheme: dark;
	}

	.color-group {
		margin-block-start: 0.5em;

		display: grid;
		grid-auto-rows: minmax(3.5em, auto);
		grid-template-columns: repeat(auto-fill, minmax(7em, 1fr));
		gap: 0.25em;
	}
	@property --bg {
		syntax: "\3c color\3e";
		inherits: true;
		initial-value: transparent;
	}
	@property --test-color {
		syntax: "\3c color\3e | auto";
		inherits: true;
		initial-value: auto;
	}
	.color-plate {
		border-radius: 0.1875em;
		padding: 0.125em;
		overflow-block: clip;
		overflow-inline: hidden;

		--test-color: attr(data-color type(<color>));
		/* background-color: attr(data-color type(<color>)); *//* not supported by firefox as of 2025-12. */
	}
	.color-plate::before {
		display: block;

		/* text-wrap-mode: wrap; */ /*"whether the text inside an element is wrapped"*/
		/* line-break: anywhere; */ /*"what set of line breaking restrictions are in effect within the element"*/
		/* word-break: break-all; */ /*"line break opportunities for non-CJK scripts"*/
		word-wrap: break-word; /*"whether the UA may break within a word to prevent overflow when an otherwise-unbreakable string is too long to fit"*/
		/* overflow-wrap: anywhere; */ /*"whether the UA may break within a word to prevent overflow when an otherwise-unbreakable string is too long to fit within the line box"*/

		user-select: all;
		pointer-events: all;
		text-shadow: 0 0 0.125em var(--shadow-clr);

		content: attr(data-color);
	}
	.color-plate::after {
		display: block;

		text-shadow: 0 0 0.125em var(--shadow-clr);

		content: if(
			style(--test-color: auto): " 🙁"; 
			else: " \002713";);
	}

	.color-plate[data-color] {
		--opp: clamp(0, 1.5 - 2 * l, 1) calc(-0.5 * a) calc(-0.5 * b);

		--bg-opp: oklab(from var(--bg) var(--opp) / 1);
		--fg-opp: oklab(from var(--fg) var(--opp) / 1);

		/* --text-clr: color-mix(in oklab, var(--bg-opp), var(--fg)); */
		/* --text-clr: var(--bg-opp); */
		--text-clr: var(--fg);

		/* --shadow-clr: oklab(from var(--text-clr) var(--opp) / 1); */
		--shadow-clr: var(--bg-opp);
		/* --shadow-clr: var(--fg-opp); */
		/* --shadow-clr: var(--text-clr); */

		background-clip: padding-box;
		background-image: linear-gradient(var(--bg)), url("../../assets/pattern-neutral-soft.svg");
		background-size: cover, 2em 2em;
		background-repeat: no-repeat, repeat;
		background-position: center;
		/* background-color: var(--bg); */

		color: var(--text-clr);

		border-style: solid;
		border-color: color(from var(--bg-opp) xyz x y z / calc(0.75 * alpha));
		border-width: 0.125em;
	}
	[data-color="AccentColor"] {
		--bg: AccentColor;
		--fg: AccentColorText;
	}
	[data-color="AccentColorText"] {
		--bg: AccentColorText;
		--fg: AccentColor;
	}
	[data-color="ActiveText"] {
		--bg: ActiveText;
	}
	[data-color="ButtonBorder"] {
		--bg: ButtonBorder;
		--fg: Canvas;
	}
	[data-color="ButtonFace"] {
		--bg: ButtonFace;
		--fg: ButtonText;
	}
	[data-color="ButtonText"] {
		--bg: ButtonText;
		--fg: ButtonFace;
	}
	[data-color="Canvas"] {
		--bg: Canvas;
		--fg: CanvasText;
	}
	[data-color="CanvasText"] {
		--bg: CanvasText;
		--fg: Canvas;
	}
	[data-color="Field"] {
		--bg: Field;
		--fg: FieldText;
	}
	[data-color="FieldText"] {
		--bg: FieldText;
		--fg: Field;
	}
	[data-color="GrayText"] {
		--bg: GrayText;
	}
	[data-color="Highlight"] {
		--bg: Highlight;
		--fg: HighlightText;
	}
	[data-color="HighlightText"] {
		--bg: HighlightText;
		--fg: Highlight;
	}
	[data-color="LinkText"] {
		--bg: LinkText;
		--fg: Canvas;
	}
	[data-color="Mark"] {
		--bg: Mark;
		--fg: MarkText;
	}
	[data-color="MarkText"] {
		--bg: MarkText;
		--fg: Mark;
	}
	[data-color="SelectedItem"] {
		--bg: SelectedItem;
		--fg: SelectedItemText;
	}
	[data-color="SelectedItemText"] {
		--bg: SelectedItemText;
		--fg: SelectedItem;
	}
	[data-color="VisitedText"] {
		--bg: VisitedText;
		--fg: Canvas;
	}
	[data-color="ArbitraryName"] {
		--bg: ArbitraryName;
		--fg: CanvasText;
	}
	/* [data-color="currentColor"] {
		--bg: currentColor;
	} */
	/*]]>*/</style>
</head>
<body>
	<div class="paragraph light">
		Light mode:
		<br /><div class="color-group">
			<span class="color-plate" data-color="AccentColor"></span>
			<span class="color-plate" data-color="AccentColorText"></span>
			<span class="color-plate" data-color="ActiveText"></span>
			<span class="color-plate" data-color="ButtonBorder"></span>
			<span class="color-plate" data-color="ButtonFace"></span>
			<span class="color-plate" data-color="ButtonText"></span>
			<span class="color-plate" data-color="Canvas"></span>
			<span class="color-plate" data-color="CanvasText"></span>
			<span class="color-plate" data-color="Field"></span>
			<span class="color-plate" data-color="FieldText"></span>
			<span class="color-plate" data-color="GrayText"></span>
			<span class="color-plate" data-color="Highlight"></span>
			<span class="color-plate" data-color="HighlightText"></span>
			<span class="color-plate" data-color="LinkText"></span>
			<span class="color-plate" data-color="Mark"></span>
			<span class="color-plate" data-color="MarkText"></span>
			<span class="color-plate" data-color="SelectedItem"></span>
			<span class="color-plate" data-color="SelectedItemText"></span>
			<span class="color-plate" data-color="VisitedText"></span>
			<span class="color-plate" data-color="ArbitraryName"></span>
			<!-- <span class="color-plate" data-color="currentColor"></span> -->
		</div>
	</div>
	<div class="paragraph dark">
		Dark mode:
		<br /><div class="color-group">
			<span class="color-plate" data-color="AccentColor"></span>
			<span class="color-plate" data-color="AccentColorText"></span>
			<span class="color-plate" data-color="ActiveText"></span>
			<span class="color-plate" data-color="ButtonBorder"></span>
			<span class="color-plate" data-color="ButtonFace"></span>
			<span class="color-plate" data-color="ButtonText"></span>
			<span class="color-plate" data-color="Canvas"></span>
			<span class="color-plate" data-color="CanvasText"></span>
			<span class="color-plate" data-color="Field"></span>
			<span class="color-plate" data-color="FieldText"></span>
			<span class="color-plate" data-color="GrayText"></span>
			<span class="color-plate" data-color="Highlight"></span>
			<span class="color-plate" data-color="HighlightText"></span>
			<span class="color-plate" data-color="LinkText"></span>
			<span class="color-plate" data-color="Mark"></span>
			<span class="color-plate" data-color="MarkText"></span>
			<span class="color-plate" data-color="SelectedItem"></span>
			<span class="color-plate" data-color="SelectedItemText"></span>
			<span class="color-plate" data-color="VisitedText"></span>
			<span class="color-plate" data-color="ArbitraryName"></span>
			<!-- <span class="color-plate" data-color="currentColor"></span> -->
		</div>
	</div>
</body>
</html>
