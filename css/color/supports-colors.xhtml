<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1 plus MathML 2.0 plus SVG 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<base href="../../" />
	<meta name="color-scheme" content="dark" />
	<title>CSS support: colors</title>
	<style type="text/css">/*<![CDATA[*/
		@property --test-color {
			syntax: "\3c color\3e | auto";
			inherits: true;
			initial-value: auto;
		}
		.notice.error {
			color: red;
		}
		@supports (color: attr(data-test type(<color>))) {
			.notice.error.feature-attr {
				display: none;
			}
		}
		.test {
			--test-color: attr(data-test type(<color>));
		}
		.test::after {
			content: attr(data-test);
		}
		@container style(--test-color: auto) {
			.test::after, .test::marker {
				color: red;
			}
		}
	/*]]>*/</style>
</head>
<body>
	<h1>CSS support: color values</h1>
