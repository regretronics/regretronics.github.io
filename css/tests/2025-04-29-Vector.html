	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\3c number\3e";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes animT {
			/* from {
				--t: 0;
			} */
			to {
				--t: 1;
			}
		}
		:root {
			color-scheme: dark;
			background-color: Canvas;
			color: CanvasText;

			animation-name: animT;
			animation-duration: 3s;
			animation-iteration-count: infinite;
			animation-timing-function: linear;
			/* animation-timeline: scroll(block nearest); */
		}
		#p1 {
			/* d: shape(
				from 30% 60px,
				curve to 180px 180px via 90px 190px,
				close,
				move by 0px 150px,
				hline by 40%
			); */
			d: path("M10,30 A20,20 0,0,1 50,30 A20,20 0,0,1 90,30 Q90,60 50,90 Q10,60 10,30 z M90,5 L5,90");
			/* d: shape(from 0% 0%, line to 100% 0%, line to 50% 100%, close); */
			fill: gray;
			stroke: white;
		}
		#r1 {
			/* animation-name: animT;
			animation-duration: 3s;
			animation-iteration-count: infinite;
			animation-timing-function: linear; */
			/* animation-timeline: scroll(block nearest); */
			/* width: calc(100% * var(--t, 0)); */

			fill: gray;
			/* clip-path: circle() fill-box; */
			/* clip-path: shape(from 0% 0%, line to 100% 0%, line to 50% 100%, close); */
			clip-path: shape(
				from 0% 0%, 
				line to 100% 0%, 
				/* line to calc(100% * (0.5 * sin(1turn * var(--t, 0)) + 0.5)) 100%,  */
				line to 
					calc(100% * (0.25 * sin(1turn * var(--t, 0)) + 0.5)) 
					calc(100% * (0.25 * cos(1turn * var(--t, 0)) + 0.75)), 
				close);
		}
	/*]]>*/</style>
