<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>CSS HDR color experiment</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			dynamic-range-limit: no-limit;
			background-color: oklch(0.25 0 0deg);
		}
		.blob {
			width: 25vmin;
			height: 25vmin;
			margin: 1em;
			display: inline-block;
			font-size: 3vmin;

			border-style: solid;
			border-width: 1px;
			border-color: black;

			background-color: attr(data-color type(<color>));
		}
		.blob::after {
			display: -webkit-box; /* ? */
			/* display: inline-flex; */
			content: attr(data-color);
			color: orange;
		}
	/*]]>*/</style>
</head>
<body>
	<div class="wrap">
		<div class="blob" data-color="color(srgb-linear 0.5 0.5 0.5)"></div>
		<div class="blob" data-color="color(srgb-linear 10 10 10)"></div>
		<div class="blob" data-color="color(display-p3-linear 10 10 10)"></div>
		<div class="blob" data-color="color(rec2020 1 1 1)"></div>
		<div class="blob" data-color="color(rec2020 2 2 2)"></div>
		<div class="blob" data-color="color(rec2100 10 10 10)"></div>
		<div class="blob" data-color="color(rec2100-linear 10 10 10)"></div>
		<div class="blob" data-color="color(rec2100-display-linear 10 10 10)"></div>
		<div class="blob" data-color="color(rec2100-pq 1.0 1.0 1.0)"></div>
		<div class="blob" data-color="color(rec2100-hlg 1.0 1.0 1.0)"></div>
		<div class="blob" data-color="color(xyz 10 10 10)"></div>
		<div class="blob" data-color="ictcp(0.58069 0 0)"></div>
		<div class="blob" data-color="ictcp(0.5393 -0.2643 -0.0625)"></div>
		<div class="blob" data-color="jzazbz(0.22207 -0.00016 -0.00012)"></div>
		<div class="blob" data-color="jzczhz(0.17542 0.1614 132.50)"></div>
		<div class="blob" data-color="jzazbz(0.8 0 0)"></div>
	</div>
	<ul>
		<li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/color_value">https://developer.mozilla.org/en-US/docs/Web/CSS/color_value</a></li>
		<li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/color">https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/color</a></li>
		<li><a href="https://drafts.csswg.org/css-color-hdr/">https://drafts.csswg.org/css-color-hdr/</a></li>
	</ul>
</body>
</html>
