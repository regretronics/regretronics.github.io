<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>CSS HDR color experiment</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			dynamic-range-limit: no-limit;
			background-color: gray;
		}
		/* .wrap {

		} */
		.blob {
			width: 8em;
			height: 8em;
			margin: 1em;
			display: inline-block;

			border-style: solid;
			border-width: 1px;
			border-color: black;
		}
		.blob:nth-child(1) {
			background-color: color(rec2100 10 10 10);
		}
		.blob:nth-child(2) {
			background-color: color(rec2100-linear 10 10 10);
		}
		.blob:nth-child(3) {
			/* background-color: color(rec2100-linear 9.852 9.852 9.852); */
			background-color: color(rec2100-pq 1.0 1.0 1.0);
		}
		.blob:nth-child(4) {
			background-color: color(rec2020 1 1 1);
		}
		.blob:nth-child(5) {
			background-color: color(rec2020 2 2 2);
		}
	/*]]>*/</style>
</head>
<body>
	<div class="wrap">
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="blob"></div>
	</div>
	<ul>
		<li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/color_value">https://developer.mozilla.org/en-US/docs/Web/CSS/color_value</a></li>
		<li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/color">https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/color</a></li>
		<li><a href="https://drafts.csswg.org/css-color-hdr/">https://drafts.csswg.org/css-color-hdr/</a></li>
	</ul>
</body>
</html>
