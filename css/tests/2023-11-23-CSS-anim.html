<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="dark" />
	<title>CSS animation experiment</title>
	<style type="text/css">/*<![CDATA[*/
		:root {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
		body {
			margin: 0;
		}
		#content {
			width: 100%;
			height: 100%;
			overflow: hidden;
			position: fixed;

			/* transform: perspective(8em); */
			perspective: 8em;
			/* transform-style: flat; */
			/* contain: paint; */
		}
		#stuff {
			width: 100%;
			height: 100%;
			transform-style: preserve-3d;
		}
		#box1 {
			/* position: fixed; */
			position: absolute;
			background-color: chocolate;
			width: 8em;
			height: 8em;
			left: calc(0.5 * (100% - 8em));
			top: calc(0.5 * (100% - 8em));
			/* translate: 6em 8em 0em; */
			animation-name: transl, fade;
			animation-duration: 4s;
			animation-iteration-count: infinite;
			animation-timing-function: linear, ease;
			animation-composition: accumulate, replace;
			/* animation-composition: add, replace; */
			/* z-index: auto; */
			/* opacity: 0.8; */
		}
		#box2 {
			/* position: fixed; */
			position: absolute;
			background-color: aquamarine;
			width: 8em;
			height: 8em;
			left: calc(0.5 * (100% - 8em));
			top: calc(0.5 * (100% - 8em));
			/* translate: 4em 6em -2em; */
			/* translate: 0em 0em -2em; */
			/* z-index: auto; */
			opacity: 0.625;
		}
		@keyframes transl {
			0% {
				translate: 0 0 -8em;
			}
			100% {
				translate: 0 0 8em;
			}
		}
		@keyframes fade {
			0% {
				opacity: 0;
			}
			25% {
				opacity: 1;
			}
			75% {
				opacity: 1;
			}
			100% {
				opacity: 0;
			}
		}
	/*]]>*/</style>
</head>
<body>
	<div id="content">
		<div id="stuff">
			<div id="box1">box1</div>
			<div id="box2">box2</div>
		</div>
	</div>
</body>
</html>
