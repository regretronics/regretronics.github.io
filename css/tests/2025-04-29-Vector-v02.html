<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>Experiment: vector graphics</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\3c number\3e";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes shuffle {
			to {
				--t: calc(1 * var(--dur));
			}
		}

		:root {
			color-scheme: dark;
			background-color: Canvas;
			color: CanvasText;

			width: 100%;
			height: 100%;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;

			--dur: 1800;
			--ti: round(down, var(--t));
			--ti1: mod(var(--ti) + 1, var(--dur));
			--ti2: mod(var(--ti) + 2, var(--dur));
			--ti3: mod(var(--ti) + 3, var(--dur));

			--tfrac: mod(var(--t), 1);
			--tfrac1: calc(1 - var(--tfrac));
			--interp-hermite-00: calc((1 + 2 * var(--tfrac)) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-10: calc(0.735 * var(--tfrac) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-01: calc(var(--tfrac) * var(--tfrac) * (3 - 2 * var(--tfrac)));
			--interp-hermite-11: calc(-0.735 * var(--tfrac) * var(--tfrac) * var(--tfrac1));

			--rnd-ratio1: mod(sqrt(7), 1);
			--rnd-ratio2: mod(pow(349, 1 / 5), -1);
			--rnd-ratio3: mod(pow(3181, 1 / 3), 1);
			--rnd-exp1: calc(pi * 2 / 3);
			--rnd-exp2: calc(20 / 7);
			--rnd-exp3: calc(110 / 113);
			--rnd-offset: mod(pow(1451, 1 / 7), 1);

			animation-name: shuffle;
			animation-duration: calc(1s * var(--dur));
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
		#img1 {
			width: 100%;
			height: 100%;
		}
		#r1 {
			--ti0-0log: log(6 * var(--ti)  + pi);
			--ti0-1log: log(6 * var(--ti1) + pi);
			--ti0-2log: log(6 * var(--ti2) + pi);
			--ti0-3log: log(6 * var(--ti3) + pi);
			--ti1-0log: log(6 * var(--ti)  + 1 + pi);
			--ti1-1log: log(6 * var(--ti1) + 1 + pi);
			--ti1-2log: log(6 * var(--ti2) + 1 + pi);
			--ti1-3log: log(6 * var(--ti3) + 1 + pi);
			--ti2-0log: log(6 * var(--ti)  + 2 + pi);
			--ti2-1log: log(6 * var(--ti1) + 2 + pi);
			--ti2-2log: log(6 * var(--ti2) + 2 + pi);
			--ti2-3log: log(6 * var(--ti3) + 2 + pi);
			--ti3-0log: log(6 * var(--ti)  + 3 + pi);
			--ti3-1log: log(6 * var(--ti1) + 3 + pi);
			--ti3-2log: log(6 * var(--ti2) + 3 + pi);
			--ti3-3log: log(6 * var(--ti3) + 3 + pi);
			--ti4-0log: log(6 * var(--ti)  + 4 + pi);
			--ti4-1log: log(6 * var(--ti1) + 4 + pi);
			--ti4-2log: log(6 * var(--ti2) + 4 + pi);
			--ti4-3log: log(6 * var(--ti3) + 4 + pi);
			--ti5-0log: log(6 * var(--ti)  + 5 + pi);
			--ti5-1log: log(6 * var(--ti1) + 5 + pi);
			--ti5-2log: log(6 * var(--ti2) + 5 + pi);
			--ti5-3log: log(6 * var(--ti3) + 5 + pi);

			--rnd0-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti0-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti0-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti0-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd0-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti0-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti0-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti0-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd0-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti0-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti0-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti0-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd0-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti0-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti0-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti0-3log)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd1-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti1-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti1-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti1-3log)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd2-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti2-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti2-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti2-3log)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd3-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti3-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti3-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti3-3log)) 
				+ var(--rnd-offset), 
				1);
			--rnd4-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti4-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti4-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti4-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd4-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti4-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti4-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti4-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd4-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti4-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti4-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti4-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd4-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti4-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti4-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti4-3log)) 
				+ var(--rnd-offset), 
				1);
			--rnd5-0: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti5-0log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti5-0log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti5-0log)) 
				+ var(--rnd-offset), 
				1);
			--rnd5-1: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti5-1log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti5-1log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti5-1log)) 
				+ var(--rnd-offset), 
				1);
			--rnd5-2: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti5-2log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti5-2log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti5-2log)) 
				+ var(--rnd-offset), 
				1);
			--rnd5-3: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--ti5-3log)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--ti5-3log)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--ti5-3log)) 
				+ var(--rnd-offset), 
				1);

			--ang0: calc(1turn * 0 / 6);
			--ang1: calc(1turn * 1 / 6);
			--ang2: calc(1turn * 2 / 6);
			--ang3: calc(1turn * 3 / 6);
			--ang4: calc(1turn * 4 / 6);
			--ang5: calc(1turn * 5 / 6);

			--rnd-dev: 0.375;
			--rnd-interp-0: calc(var(--ang0) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd0-1)
				+ var(--interp-hermite-10) * (var(--rnd0-2) - var(--rnd0-0))
				+ var(--interp-hermite-01) * var(--rnd0-2)
				+ var(--interp-hermite-11) * (var(--rnd0-3) - var(--rnd0-1))
				- 0.5
			));
			--rnd-interp-1: calc(var(--ang1) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd1-1)
				+ var(--interp-hermite-10) * (var(--rnd1-2) - var(--rnd1-0))
				+ var(--interp-hermite-01) * var(--rnd1-2)
				+ var(--interp-hermite-11) * (var(--rnd1-3) - var(--rnd1-1))
				- 0.5
			));
			--rnd-interp-2: calc(var(--ang2) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd2-1)
				+ var(--interp-hermite-10) * (var(--rnd2-2) - var(--rnd2-0))
				+ var(--interp-hermite-01) * var(--rnd2-2)
				+ var(--interp-hermite-11) * (var(--rnd2-3) - var(--rnd2-1))
				- 0.5
			));
			--rnd-interp-3: calc(var(--ang3) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd3-1)
				+ var(--interp-hermite-10) * (var(--rnd3-2) - var(--rnd3-0))
				+ var(--interp-hermite-01) * var(--rnd3-2)
				+ var(--interp-hermite-11) * (var(--rnd3-3) - var(--rnd3-1))
				- 0.5
			));
			--rnd-interp-4: calc(var(--ang4) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd4-1)
				+ var(--interp-hermite-10) * (var(--rnd4-2) - var(--rnd4-0))
				+ var(--interp-hermite-01) * var(--rnd4-2)
				+ var(--interp-hermite-11) * (var(--rnd4-3) - var(--rnd4-1))
				- 0.5
			));
			--rnd-interp-5: calc(var(--ang5) + var(--rnd-dev) * 1turn * (
				var(--interp-hermite-00) * var(--rnd5-1)
				+ var(--interp-hermite-10) * (var(--rnd5-2) - var(--rnd5-0))
				+ var(--interp-hermite-01) * var(--rnd5-2)
				+ var(--interp-hermite-11) * (var(--rnd5-3) - var(--rnd5-1))
				- 0.5
			));

			--shp-scale: 0.375;
			/* --ctl-dist: 0.375; */
			--ctl-dist: calc(1 / 3);

			fill: gray;
			/* clip-path: shape(from 0% 0%, line to 100% 0%, line to 50% 100%, close); */
			clip-path: shape(
				from 
					calc(100% * (var(--shp-scale) * cos(var(--ang0)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang0)) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang1)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang1)) + 0.5)) 
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang0)) - var(--ctl-dist) * sin(var(--rnd-interp-0))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang0)) + var(--ctl-dist) * cos(var(--rnd-interp-0))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang1)) + var(--ctl-dist) * sin(var(--rnd-interp-1))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang1)) - var(--ctl-dist) * cos(var(--rnd-interp-1))) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang2)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang2)) + 0.5)) 
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang1)) - var(--ctl-dist) * sin(var(--rnd-interp-1))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang1)) + var(--ctl-dist) * cos(var(--rnd-interp-1))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang2)) + var(--ctl-dist) * sin(var(--rnd-interp-2))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang2)) - var(--ctl-dist) * cos(var(--rnd-interp-2))) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang3)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang3)) + 0.5))
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang2)) - var(--ctl-dist) * sin(var(--rnd-interp-2))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang2)) + var(--ctl-dist) * cos(var(--rnd-interp-2))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang3)) + var(--ctl-dist) * sin(var(--rnd-interp-3))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang3)) - var(--ctl-dist) * cos(var(--rnd-interp-3))) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang4)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang4)) + 0.5)) 
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang3)) - var(--ctl-dist) * sin(var(--rnd-interp-3))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang3)) + var(--ctl-dist) * cos(var(--rnd-interp-3))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang4)) + var(--ctl-dist) * sin(var(--rnd-interp-4))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang4)) - var(--ctl-dist) * cos(var(--rnd-interp-4))) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang5)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang5)) + 0.5)) 
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang4)) - var(--ctl-dist) * sin(var(--rnd-interp-4))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang4)) + var(--ctl-dist) * cos(var(--rnd-interp-4))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang5)) + var(--ctl-dist) * sin(var(--rnd-interp-5))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang5)) - var(--ctl-dist) * cos(var(--rnd-interp-5))) + 0.5)), 
				curve to 
					calc(100% * (var(--shp-scale) * cos(var(--ang0)) + 0.5)) 
					calc(100% * (var(--shp-scale) * sin(var(--ang0)) + 0.5)) 
				with 
					calc(100% * (var(--shp-scale) * (cos(var(--ang5)) - var(--ctl-dist) * sin(var(--rnd-interp-5))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang5)) + var(--ctl-dist) * cos(var(--rnd-interp-5))) + 0.5)) / 
					calc(100% * (var(--shp-scale) * (cos(var(--ang0)) + var(--ctl-dist) * sin(var(--rnd-interp-0))) + 0.5)) 
					calc(100% * (var(--shp-scale) * (sin(var(--ang0)) - var(--ctl-dist) * cos(var(--rnd-interp-0))) + 0.5)), 
				close);
		}
	/*]]>*/</style>
</head>
<body>
	<svg id="img1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1">
	<!--<svg id="img1" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 2 2" preserveAspectRatio="xMidYMid meet">-->
		<defs>
			<filter id="diffuse" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
