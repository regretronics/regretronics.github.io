<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" style="background: black; color-scheme: dark;">
	<defs>
		<filter id="noise" filterUnits="objectBoundingBox" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox">
			<feTurbulence
				type="turbulence"
				baseFrequency="3"
				numOctaves="4"
				result="noise0"
				stitchTiles="stitch"
				color-interpolation-filters="sRGB" />
			<feOffset 
				in="noise0" 
				result="off1" 
				dy="0" 
				color-interpolation-filters="sRGB">
				<animate 
					attributeName="dx" attributeType="XML" calcMode="linear" 
					from="0" to="1" 
					dur="4s" repeatCount="indefinite" />
			</feOffset>
			<feOffset 
				in="noise0" 
				result="off2" 
				dy="0" 
				color-interpolation-filters="sRGB">
				<animate 
					attributeName="dx" attributeType="XML" calcMode="linear" 
					from="-1" to="0" 
					dur="4s" repeatCount="indefinite" />
			</feOffset>
			<feComposite in="off1" in2="off2" result="offSum" operator="lighter" color-interpolation-filters="sRGB" />
		</filter>
	</defs>
	<rect x="0" y="0" height="100%" width="100%" fill="black" filter="url(#noise)" />
</svg>
