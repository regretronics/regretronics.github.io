<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>CSS experiment: vars, animation, math functions, etc.</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --t2 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@property --t-anim {
			/* syntax: "\3c \3e"; */
			syntax: "*";
			inherits: true;
			initial-value: 0.0;
		}
		@property --t2-anim {
			/* syntax: "\3c \3e"; */
			syntax: "*";
			inherits: true;
			initial-value: 0.0;
		}
		/* @keyframes anim1 {
			to {
				--t: 1;
			}
		} */
		:root {
			color-scheme: dark;
			font-size: 3em;

			/* animation-name: anim1;
			animation-duration: 9s;
			animation-iteration-count: infinite;
			animation-timing-function: linear; */
			/* animation-timeline: scroll(block nearest); */

			--t: 0.0;
			--t2: 0.0;
			/* --t2: var(--t); */
			--t-anim: calc(-1s * var(--t));
			--t2-anim: calc(-1s * var(--t2));

			transition-property: --t, --t2;
			transition-duration: 1s, 4s;
			/* transition-timing-function: linear; */
			/* transition-timing-function: ease-out; */
			/* transition-timing-function: cubic-bezier(1,0,0,1); */
			transition-timing-function: cubic-bezier(0,0,0.5,1);
			/* transition-timing-function: cubic-bezier(.5, -0.5, 1, 1.5); */
			/* transition-timing-function: linear(0, 0.5 25% 75%, 1); */
			/* transition-timing-function: linear(0, 0.25 45%, 0.75 55%, 0.5 70%, 1); */
			/* transition-behavior: allow-discrete; */
			/* transition-delay: 1s; */
		}
		:root:hover {
			--t: 1.0;
			--t2: 1.0;
		}

		.gauge {
			width: 80%;
			background-color: oklch(0.5 0 0deg / 0.5);
			margin-block-end: 0.5em;
			& > div:nth-child(1) {
				background-color: orange;
				text-wrap-mode: nowrap;
				overflow-inline: visible;
			}

			&:nth-of-type(1) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t));
				}
			}
			&:nth-of-type(2) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t2));
				}
			}
		}

		@keyframes anim-rotate {
			to {
				rotate: 1turn;
			}
		}
		@keyframes anim-color {
			to {
				background-color: black;
			}
		}
		.spinner {
			width: 4em;
			height: 4em;
			background-color: green;

			animation-name: anim-color, anim-rotate;
			animation-duration: 1s;
			/* animation-duration: calc(4s / var(--t3)); */
			animation-play-state: paused;
			animation-fill-mode: both;
			animation-timing-function: linear;
			/* animation-timing-function: cubic-bezier(.5, -0.5, 1, 1.5); */
			/* animation-composition: ; */

			animation-delay: var(--t-anim), var(--t2-anim); /*animation-delay still not animatable, surprisingly*/
			/* animation-delay: calc(-1s * var(--t4)); */
		}
	/*]]>*/</style>
</head>
<body>
	<p>(Move the cursor in and out of the page.)</p>
	<div class="gauge"><div>--t (transition, 1s)</div></div>
	<div class="gauge"><div>--t2 (transition, 4s)</div></div>
	<div class="spinner">asfd</div>
</body>
</html>
