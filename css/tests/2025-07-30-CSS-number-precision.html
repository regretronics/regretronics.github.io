<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>CSS experiment: number precision</title>
	<style type="text/css">/*<![CDATA[*/
		@property --magnitude {
			syntax: "\<number\>";
			inherits: true;
			initial-value: 0.0;
		}
		@keyframes magnitudeRamp {
			from {--magnitude: 0;}
			to {--magnitude: 31;}
		}
		:root {
			color-scheme: dark;
			background-color: oklch(0.125 0 0deg);
			color: oklch(0.875 0 0deg);

			font-size: 2em;
			font-variant: slashed-zero;
			overflow-wrap: break-word; /*2024-08: fix for Chrome vs. Ffx layout differences and Chrome layout bug*/

			--t: 100;
			/* Firefox (v142) seems to use single-precision numbers. from ti = 100 on it works poorly. */
			--ti: round(down, var(--t));

			/* --rnd-ratio1: mod(sqrt(7), 1);
			--rnd-ratio2: mod(pow(349, 1 / 5), -1);
			--rnd-ratio3: mod(pow(3181, 1 / 3), 1);
			--rnd-exp1: calc(pi * 2 / 3);
			--rnd-exp2: calc(20 / 7);
			--rnd-exp3: calc(110 / 113);
			--rnd-offset: mod(pow(1451, 1 / 7), 1);

			--tilog: log(var(--ti) + pi);
			--rnd: mod(
				var(--rnd-ratio1) * exp(var(--rnd-exp1) * var(--tilog)) 
				+ var(--rnd-ratio2) * exp(var(--rnd-exp2) * var(--tilog)) 
				+ var(--rnd-ratio3) * exp(var(--rnd-exp3) * var(--tilog)) 
				+ var(--rnd-offset), 
				1); */
			/* --overhead: pow(10, 7); */
			--overhead: pow(2, var(--magnitude));
			--start: pi;
			--x: calc(var(--start) + var(--overhead));
			--diff: calc(var(--x) - var(--overhead));

			--magnitude: 23;
			@supports (animation-timeline: --scrollBar1-position) {
				timeline-scope: --scrollBar1-position;
				animation-name: magnitudeRamp;
				animation-duration: 1ms;
				animation-timing-function: linear;
				animation-fill-mode: both;
				animation-timeline: --scrollBar1-position;
			}
		}
		#selN :checked {
			:root:has(&[value="-512"]) {--n: -512;}
			:root:has(&[value="-256"]) {--n: -256;}
			:root:has(&[value="-128"]) {--n: -128;}
			:root:has(&[value="-64"]) {--n: -64;}
			:root:has(&[value="-32"]) {--n: -32;}
			:root:has(&[value="-16"]) {--n: -16;}
			:root:has(&[value="-8"]) {--n: -8;}
			:root:has(&[value="-4"]) {--n: -4;}
			:root:has(&[value="-2"]) {--n: -2;}
			:root:has(&[value="-1"]) {--n: -1;}
			:root:has(&[value="0"]) {--n: 0;}
			:root:has(&[value="1"]) {--n: 1;}
			:root:has(&[value="2"]) {--n: 2;}
			:root:has(&[value="4"]) {--n: 4;}
			:root:has(&[value="8"]) {--n: 8;}
			:root:has(&[value="16"]) {--n: 16;}
			:root:has(&[value="32"]) {--n: 32;}
			:root:has(&[value="64"]) {--n: 64;}
			:root:has(&[value="128"]) {--n: 128;}
			:root:has(&[value="256"]) {--n: 256;}
			:root:has(&[value="512"]) {--n: 512;}
		}
		#selBase :checked {
			:root:has(&[value="0"]) {--b: 0;}
			:root:has(&[value="0.5"]) {--b: 0.5;}
			:root:has(&[value="1"]) {--b: 1;}
			:root:has(&[value="1.0625"]) {--b: 1.0625;}
			:root:has(&[value="1.125"]) {--b: 1.125;}
			:root:has(&[value="1.25"]) {--b: 1.25;}
			:root:has(&[value="1.5"]) {--b: 1.5;}
			:root:has(&[value="2"]) {--b: 2;}
			:root:has(&[value="e"]) {--b: e;}
			:root:has(&[value="4"]) {--b: 4;}
			:root:has(&[value="8"]) {--b: 8;}
			:root:has(&[value="10"]) {--b: 10;}
			:root:has(&[value="16"]) {--b: 16;}
			:root:has(&[value="32"]) {--b: 32;}
			:root:has(&[value="64"]) {--b: 64;}
			:root:has(&[value="128"]) {--b: 128;}
			:root:has(&[value="256"]) {--b: 256;}
			:root:has(&[value="512"]) {--b: 512;}
		}

		select {
			font-size: inherit;
		}
		body > div {
			margin-block: 1em;
		}

		.scroll-bar {
			--scale: 0.5;
			--width: 16em;
			--height: 2em;
			display: inline-block;
			scale: var(--scale);
			width: var(--width);
			max-width: calc(100% / var(--scale));
			height: var(--height);
			vertical-align: middle;

			margin-block: calc(-0.5 * var(--scale) * var(--height));
			margin-inline: calc(-0.5 * var(--scale) * var(--width));
			overflow-x: scroll;
			overflow-y: hidden;
			contain: strict;

			background-color: oklch(0.25 0 0deg);
		}
		#scrollBar1 {
			scroll-timeline: --scrollBar1-position inline;
		}
		.scroll-area {
			width: 1600%;
			height: 100%;

			padding: 0;
			border-width: 0;
			contain: strict;

			background: linear-gradient(to right, black, white);

			& .label {
				position: absolute;
				font-variant: small-caps;

				&.min {
					left: 0;
					color: white;
				}
				&.max {
					right: 0;
					color: black;
				}
			}
		}

		@counter-style dec-frac3 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 3 "0";
		}
		@counter-style dec-frac9 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 9 "0";
		}
		@supports (min-width: calc(1ch * attr(data-width type(<number>), 4))) {
			output[data-width] {
				display: inline-block;
				min-width: calc(1ch * attr(data-width type(<number>), 4));
			}
		}
		#outMagn::after {
			--val: var(--magnitude);
			--places: 3;
			--fmt: dec-frac3;
		}
		#outOverhead::after {
			--val: var(--overhead);
			--places: 3;
			--fmt: dec-frac3;
		}
		#outStart::after {
			--val: var(--start);
			--places: 9;
			--fmt: dec-frac9;
		}
		#outDiff::after {
			--val: var(--diff);
			--places: 9;
			--fmt: dec-frac9;
		}
		#outExp:after {
			/* --val: exp(var(--n)); */
			--val: pow(var(--b), var(--n));
			--places: 9;
			--fmt: dec-frac9;
		}
		output::after {
			text-align: end;
		}
		output:not(.exp)::after {
			/* --val-round3: calc(var(--val) + 1 * 0.5 * 0.001); */
			/* --val-round3: calc(var(--val) + sign(var(--val)) * 0.5 * 0.001); */
			--val-round: calc(var(--val) + sign(var(--val)) * 0.5 * pow(0.1, var(--places)));

			/* counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val)); */
			/* counter-reset: 
				cnt round(to-zero, var(--val-round3), 1) 
				cnt-frac round(to-zero, 1000 * mod(var(--val-round3), 1), 1); */
			counter-reset: 
				cnt round(to-zero, var(--val-round), 1) 
				cnt-frac round(to-zero, pow(10, var(--places)) * mod(var(--val-round), 1), 1);

			content: counter(cnt) "." counter(cnt-frac, var(--fmt, dec-frac3));
		}
		output.exp::after {
			--val-mag: round(down, log(var(--val), 10), 1);
			--val-mant: calc(var(--val) * pow(0.1, var(--val-mag))); /* significand or mantissa */
			--val-round: calc(var(--val-mant) + sign(var(--val-mant)) * 0.5 * pow(0.1, var(--places)));

			counter-reset: 
				cnt-mant1 round(to-zero, var(--val-round), 1) 
				cnt-mant2 round(to-zero, pow(10, var(--places)) * mod(var(--val-round), 1), 1) 
				cnt-mag var(--val-mag);

			content: counter(cnt-mant1) "." counter(cnt-mant2, var(--fmt, dec-frac3)) "e" counter(cnt-mag);
		}
		/* #rndBar {
			--val: var(--rnd);
		}
		#rndBar::after {
			content: "rnd: " counter(cnt) "." counter(cnt-frac, dec-frac);
		} */
	/*]]>*/</style>
</head>
<body>
	<div>
		Magnitude: <output id="outMagn" data-width="6"></output> 
		<div id="scrollBar1" class="scroll-bar">
			<div class="scroll-area">
				<span class="label min">minimum</span>
				<span class="label max">maximum</span>
			</div>
		</div>
	</div>
	<div>Overhead: <output id="outOverhead" data-width="10"></output></div>
	<div>Starting value: <output id="outStart" data-width="4"></output></div>
	<div>Diff: <output id="outDiff" data-width="10"></output></div>
	<div>
		<label for="selBase">b:</label> <select id="selBase">
			<option value="0">0</option>
			<option value="0.5">0.5</option>
			<option value="1">1</option>
			<option value="1.0625">1.0625</option>
			<option value="1.125">1.125</option>
			<option value="1.25">1.25</option>
			<option value="1.5">1.5</option>
			<option value="2" selected="selected">2</option>
			<option value="e">e</option>
			<option value="4">4</option>
			<option value="8">8</option>
			<option value="10">10</option>
			<option value="16">16</option>
			<option value="32">32</option>
			<option value="64">64</option>
			<option value="128">128</option>
			<option value="256">256</option>
			<option value="512">512</option>
		</select>
		<label for="selN">n:</label> <select id="selN">
			<option value="-512">-512</option>
			<option value="-256">-256</option>
			<option value="-128">-128</option>
			<option value="-64">-64</option>
			<option value="-32">-32</option>
			<option value="-16">-16</option>
			<option value="-8">-8</option>
			<option value="-4">-4</option>
			<option value="-2">-2</option>
			<option value="-1">-1</option>
			<option value="0" selected="selected">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="4">4</option>
			<option value="8">8</option>
			<option value="16">16</option>
			<option value="32">32</option>
			<option value="64">64</option>
			<option value="128">128</option>
			<option value="256">256</option>
			<option value="512">512</option>
		</select>
		b^n: <output id="outExp" class="exp" data-width="8"></output>
	</div>
</body>
</html>
