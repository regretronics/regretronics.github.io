<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>CSS experiment: squares PRNG</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "<number>";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes anim1 {
			to {
				/* --t: var(--dur); */ /*var() here doesn't work in Firefox*/
				--t: 86400;
			}
		}
		:root {
			color-scheme: dark;
			font-size: 2em;

			--dur: 86400;

			/* Firefox (as of v142) seems to use single-precision (float32) numbers. */
			--ti: round(down, var(--start) + var(--t)); 
			/* --ti1: calc(var(--ti) + 1);
			--ti2: calc(var(--ti) + 2);
			--ti3: calc(var(--ti) + 3); */

			/* --tfrac: mod(var(--t), 1);
			--tfrac1: calc(1 - var(--tfrac));
			--interp-hermite-00: calc((1 + 2 * var(--tfrac)) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-10: calc(var(--tfrac) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-01: calc(var(--tfrac) * var(--tfrac) * (3 - 2 * var(--tfrac)));
			--interp-hermite-11: calc(-1 * var(--tfrac) * var(--tfrac) * var(--tfrac1)); */

			/* https://arxiv.org/abs/2004.06278 */
			/* --key: 1443; */ /* 0x5a3 */
			--key: 11703715; /* 0xb295a3 */

			--ti-weyl-y: mod(var(--ti) * var(--key), 16777216);
			--ti-weyl-z: mod(var(--ti-weyl-y) + var(--key), 16777216);

			--rnd-r0-sq: mod(pow(mod(var(--ti-weyl-y), 4096), 2) + var(--ti-weyl-y), 16777216);
			--rnd-r0-rot: calc(round(down, var(--rnd-r0-sq) / 4096) + 4096 * mod(var(--rnd-r0-sq), 4096));
			--rnd-r0f: calc(var(--rnd-r0-rot) / 16777216);

			--rnd-r1-sq: mod(pow(mod(var(--rnd-r0-rot), 4096), 2) + var(--ti-weyl-z), 16777216);
			--rnd-r1-rot: calc(round(down, var(--rnd-r1-sq) / 4096) + 4096 * mod(var(--rnd-r1-sq), 4096));
			--rnd-r1f: calc(var(--rnd-r1-rot) / 16777216);

			--rnd-r2-sq: mod(pow(mod(var(--rnd-r1-rot), 4096), 2) + var(--ti-weyl-y), 16777216);
			--rnd-r2-rot: calc(round(down, var(--rnd-r2-sq) / 4096) + 4096 * mod(var(--rnd-r2-sq), 4096));
			--rnd-r2f: calc(var(--rnd-r2-rot) / 16777216);

			--rnd-r3-sq: mod(pow(mod(var(--rnd-r2-rot), 4096), 2) + var(--ti-weyl-z), 16777216);
			--rnd-r3-rot: calc(round(down, var(--rnd-r3-sq) / 4096) + 4096 * mod(var(--rnd-r3-sq), 4096));
			--rnd-r3f: calc(var(--rnd-r3-sq) / 16777216);
			--rnd-final: calc(round(down, var(--rnd-r3-sq) / 4096));

			/* --rnd1: 0;
			--rnd2: 0;
			--rnd3: 0; */
			/* --rnd-interp: calc(
				var(--interp-hermite-00) * var(--rnd1)
				+ var(--interp-hermite-10) * 0.5 * (var(--rnd2) - var(--rnd))
				+ var(--interp-hermite-01) * var(--rnd2)
				+ var(--interp-hermite-11) * 0.5 * (var(--rnd3) - var(--rnd1))
			); */
			/* --rnd-interp: calc(
				var(--interp-hermite-00) * var(--rnd1)
				+ var(--interp-hermite-10) * 0.735 * (var(--rnd2) - var(--rnd))
				+ var(--interp-hermite-01) * var(--rnd2)
				+ var(--interp-hermite-11) * 0.735 * (var(--rnd3) - var(--rnd1))
			); */

			animation-name: anim1;
			animation-duration: calc(1s * var(--dur));
			animation-iteration-count: infinite;
			animation-timing-function: linear;

			&:not(:has(#chkCounterRun:checked)) {
				animation-play-state: paused;
			}
		}
		#selStart :checked {
			:root:has(&[value="0"]) {--start: 0;}
			:root:has(&[value="1"]) {--start: 1;}
			:root:has(&[value="2"]) {--start: 2;}
			:root:has(&[value="4"]) {--start: 4;}
			:root:has(&[value="8"]) {--start: 8;}
			:root:has(&[value="16"]) {--start: 16;}
			:root:has(&[value="32"]) {--start: 32;}
			:root:has(&[value="64"]) {--start: 64;}
			:root:has(&[value="128"]) {--start: 128;}
			:root:has(&[value="256"]) {--start: 256;}
			:root:has(&[value="512"]) {--start: 512;}
			:root:has(&[value="1024"]) {--start: 1024;}
			:root:has(&[value="2048"]) {--start: 2048;}
			:root:has(&[value="4096"]) {--start: 4096;}
			:root:has(&[value="8192"]) {--start: 8192;}
			:root:has(&[value="16384"]) {--start: 16384;}
			:root:has(&[value="32768"]) {--start: 32768;}
			:root:has(&[value="65536"]) {--start: 65536;}
			:root:has(&[value="131072"]) {--start: 131072;}
			:root:has(&[value="262144"]) {--start: 262144;}
			:root:has(&[value="524288"]) {--start: 524288;}
			:root:has(&[value="1048576"]) {--start: 1048576;}
			:root:has(&[value="2097152"]) {--start: 2097152;}
			:root:has(&[value="4194304"]) {--start: 4194304;}
			:root:has(&[value="8388608"]) {--start: 8388608;}
			:root:has(&[value="16777216"]) {--start: 16777216;}
		}

		@counter-style dec-frac3-sign {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 4 "0";
			range: infinite -1;
			fallback: dec-frac3;
		}
		@counter-style dec-frac3 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 3 "0";
		}
		@counter-style dec-frac9 {
			system: extends decimal;
			/* pad: var(--places) "0"; */ /* not working in Chrome as of 2025-05-03 */
			pad: 9 "0";
		}
		@counter-style sign {
			system: cyclic;
			symbols: "" "" "-";
		}
		.show-number {
			white-space-collapse: break-spaces;
		}
		.show-number::after {
			--val-round: calc(var(--val) + sign(var(--val)) * 0.5 * pow(0.1, var(--places)));
			opacity: 0.6;
		}
		.show-number.int::after {
			counter-reset: val round(to-zero, var(--val));
			content: counter(val);
		}
		.show-number.frac::after {
			--places: 9;
			counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val));
			content: counter(val, dec-frac9);
		}
		.show-number.num::after {
			--places: 3;

			counter-reset: 
				val-sign calc(sign(var(--val-round)) + 1) 
				val abs(round(to-zero, var(--val-round), 1)) 
				val-frac round(to-zero, pow(10, var(--places)) * mod(abs(var(--val-round)), 1), 1);
			content: counter(val-sign, sign) counter(val) "." counter(val-frac, dec-frac3);

			/* counter-reset: val round(to-zero, pow(10, var(--places)) * var(--val-round));
			content: counter(val, dec-frac3-sign); */
		}

		.bar {
			/* position: absolute; */
			height: 1em;
			width: calc(100% * var(--val));

			background-color: oklch(0.375 0 0deg);
			text-wrap-mode: nowrap;
		}
		.bar::after {
			position: absolute;
			opacity: 0.6;
		}
		#outT {--val: var(--ti);}
		#rndParcel1 {--val: var(--ti-weyl-y);}
		#rndParcel2 {--val: var(--ti-weyl-z);}
		#rndParcel3 {--val: var(--rnd-r0-sq);}
		#rndParcel4 {--val: var(--rnd-r0-rot);}
		#rndParcel5 {--val: var(--rnd-r1-sq);}
		#rndParcel6 {--val: var(--rnd-r1-rot);}
		#rndParcel7 {--val: var(--rnd-r2-sq);}
		#rndParcel8 {--val: var(--rnd-r2-rot);}
		#rndParcel9 {--val: var(--rnd-r3-sq);}
		#rndParcel10 {--val: var(--rnd-r3-rot);}
		#rndBar {--val: var(--rnd-r0f);}
		#rnd1Bar {--val: var(--rnd-r1f);}
		#rnd2Bar {--val: var(--rnd-r2f);}
		#rnd3Bar {--val: var(--rnd-r3f);}
		#rndFinal {--val: var(--rnd-final);}
		/* #rnd1Bar {--val: var(--rnd1);}
		#rnd2Bar {--val: var(--rnd2);}
		#rnd3Bar {--val: var(--rnd3);}
		#interp {--val: var(--rnd-interp);} */

		input, textarea, button, select {
			font-size: inherit;
		}
		input:is([type=checkbox], input[type=radio]) {
			vertical-align: middle;
			block-size: 1cap;
			inline-size: 1cap;
			margin-inline: 0em;
			color: inherit;

			& + label {
				padding-inline: 0.25em;
			}
			&:not(:checked) + label {
				color: oklch(0.75 0.03125 55deg / 0.8);
			}
			&:checked + label {
				color: oklch(0.875 0.1875 55deg);
			}
		}
	/*]]>*/</style>
</head>
<body>
	<p>
		<input type="checkbox" id="chkCounterRun" />
		<label for="chkCounterRun">Run increment</label>
	</p>
	<p>
		<label for="selStart">Start:</label> <select id="selStart">
			<option value="0" selected="selected">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="4">4</option>
			<option value="8">8</option>
			<option value="16">16</option>
			<option value="32">32</option>
			<option value="64">64</option>
			<option value="128">128</option>
			<option value="256">256</option>
			<option value="512">512</option>
			<option value="1024">1024</option>
			<option value="2048">2048</option>
			<option value="4096">4096</option>
			<option value="8192">8192</option>
			<option value="16384">16384</option>
			<option value="32768">32768</option>
			<option value="65536">65536</option>
			<option value="131072">131072</option>
			<option value="262144">262144</option>
			<option value="524288">524288</option>
			<option value="1048576">1048576</option>
			<option value="2097152">2097152</option>
			<option value="4194304">4194304</option>
			<option value="8388608">8388608</option>
			<option value="16777216">16777216</option>
		</select>
	</p>
	<p>
		<div class="show-number int" id="outT">ti: </div>
		<div class="show-number int" id="rndParcel1">ti-weyl-y: </div>
		<div class="show-number int" id="rndParcel2">ti-weyl-z: </div>
	</p>
	<p>
		<div class="show-number int" id="rndParcel3">rnd-r0-sq: </div>
		<div class="show-number int" id="rndParcel4">rnd-r0-rot: </div>
		<div class="show-number frac" id="rndBar">rnd-r0f (decimal): </div>
	</p>
	<p>
		<div class="show-number int" id="rndParcel5">rnd-r1-sq: </div>
		<div class="show-number int" id="rndParcel6">rnd-r1-rot: </div>
		<div class="show-number frac" id="rnd1Bar">rnd-r1f (decimal): </div>
	</p>
	<p>
		<div class="show-number int" id="rndParcel7">rnd-r2-sq: </div>
		<div class="show-number int" id="rndParcel8">rnd-r2-rot: </div>
		<div class="show-number frac" id="rnd2Bar">rnd-r2f (decimal): </div>
	</p>
	<p>
		<div class="show-number int" id="rndParcel9">rnd-r3-sq: </div>
		<div class="show-number int" id="rndParcel10">rnd-r3-rot: </div>
		<div class="show-number frac" id="rnd3Bar">rnd-r3f (decimal): </div>
		<div class="show-number int" id="rndFinal">rnd-final: </div>
	</p>
	<!-- <p class="bar show-number frac" id="rnd1Bar">rnd1: </p>
	<p class="bar show-number frac" id="rnd2Bar">rnd2: </p>
	<p class="bar show-number frac" id="rnd3Bar">rnd3: </p>
	<p class="bar show-number num" id="interp">interp: </p> -->
</body>
</html>
