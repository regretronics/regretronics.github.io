<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>CSS/SVG filter experiment</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\<number\>";
			initial-value: 0.0;
			inherits: true;
		}
		@keyframes shuffle {
			to {
				--t: var(--dur);
				/* --t: calc(0.25 * var(--dur)); */
			}
		}

		:root {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: none;
			overflow: hidden;

			color-scheme: dark;
			background-color: black;
			--dur: 43200;

			--ti: round(down, var(--t));
			/* --ti: round(down, 30000 + var(--t)); */
			/* --ti1: calc(var(--ti) + 1);
			--ti2: calc(var(--ti) + 2);
			--ti3: calc(var(--ti) + 3);
			--tfrac: mod(var(--t), 1);
			--tfrac1: calc(1 - var(--tfrac)); */

			/* --interp-hermite-00: calc((1 + 2 * var(--tfrac)) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-10: calc(0.735 * var(--tfrac) * var(--tfrac1) * var(--tfrac1));
			--interp-hermite-01: calc(var(--tfrac) * var(--tfrac) * (3 - 2 * var(--tfrac)));
			--interp-hermite-11: calc(-0.735 * var(--tfrac) * var(--tfrac) * var(--tfrac1)); */

			/* animation-name: shuffle;
			animation-duration: calc(1s * var(--dur));
			animation-iteration-count: infinite;
			animation-timing-function: linear; */
			/* animation-composition: add; */
		}
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: none;
			overflow: hidden;
		}

		#svg1 {
			position: absolute;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: none;
			overflow: hidden;
			/* background-color: black; */
			/* background-color: color(srgb 0.5 0.5 0.5); */
			/* filter: url("#warp"); */
		}
		/* #svg1 > circle {
			--rnd-interp-x: calc(
				var(--interp-hermite-00) * var(--rnd1-x)
				+ var(--interp-hermite-10) * (var(--rnd2-x) - var(--rnd-x))
				+ var(--interp-hermite-01) * var(--rnd2-x)
				+ var(--interp-hermite-11) * (var(--rnd3-x) - var(--rnd1-x))
			);
			--rnd-interp-y: calc(
				var(--interp-hermite-00) * var(--rnd1-y)
				+ var(--interp-hermite-10) * (var(--rnd2-y) - var(--rnd-y))
				+ var(--interp-hermite-01) * var(--rnd2-y)
				+ var(--interp-hermite-11) * (var(--rnd3-y) - var(--rnd1-y))
			);
		} */
		/* #noise0 feTurbulence {
			seed: calc(var(--ti) + 2);
		} */
	/*]]>*/</style>
</head>
<body>
	<svg id="svg1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid slice" filter="url(#noiseMix) url(#warpDyn)">
		<!-- filter="url('#warp')" -->
		<defs>
			<filter id="noiseMix" filterUnits="objectBoundingBox" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox">
				<feTurbulence
					type="fractalNoise"
					baseFrequency="0.0025"
					numOctaves="6"
					result="noise_0"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="1" by="65536" dur="262144s" repeatCount="indefinite" />
				</feTurbulence>
				<feTurbulence
					type="fractalNoise"
					baseFrequency="0.0025"
					numOctaves="6"
					result="noise_1"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="2" by="65536" dur="262144s" repeatCount="indefinite" />
				</feTurbulence>
				<feComposite in="noise_0" in2="noise_1" operator="arithmetic" k1="0" k4="0" color-interpolation-filters="sRGB">
						<animate attributeName="k2" from="1" to="0" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
						<animate attributeName="k3" from="0" to="1" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
				</feComposite>
			</filter>
			<filter id="turbulenceMix" filterUnits="objectBoundingBox" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox">
				<feTurbulence
					type="turbulence"
					baseFrequency="0.025"
					numOctaves="6"
					result="noise_0"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="1" by="65536" dur="65536s" repeatCount="indefinite" />
				</feTurbulence>
				<feTurbulence
					type="turbulence"
					baseFrequency="0.025"
					numOctaves="6"
					result="noise_1"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="2" by="65536" dur="65536s" repeatCount="indefinite" />
				</feTurbulence>
				<feComposite in="noise_0" in2="noise_1" operator="arithmetic" k1="0" k4="0.5" color-interpolation-filters="sRGB">
						<animate attributeName="k2" from="0.5" to="0" dur="1s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
						<animate attributeName="k3" from="0" to="0.5" dur="1s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
				</feComposite>
			</filter>
			<filter id="warp" filterUnits="objectBoundingBox" x="-0.375" y="-0.375" width="1.75" height="1.75" primitiveUnits="objectBoundingBox">
				<feTurbulence
					type="fractalNoise"
					baseFrequency="0.0025"
					numOctaves="8"
					result="noise"
					color-interpolation-filters="sRGB" />
				<feDisplacementMap
					in2="SourceGraphic"
					in="noise"
					result="warped"
					scale="0.25"
					xChannelSelector="R"
					yChannelSelector="G"
					color-interpolation-filters="sRGB" />
			</filter>
			<filter id="warpDyn" filterUnits="objectBoundingBox" x="-0.375" y="-0.375" width="1.75" height="1.75" primitiveUnits="objectBoundingBox">
				<feTurbulence
					type="fractalNoise"
					baseFrequency="0.0025"
					numOctaves="8"
					result="noise_0"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="1" by="65536" dur="1048576s" repeatCount="indefinite" />
				</feTurbulence>
				<feTurbulence
					type="fractalNoise"
					baseFrequency="0.0025"
					numOctaves="8"
					result="noise_1"
					color-interpolation-filters="sRGB">
					<animate attributeName="seed" from="2" by="65536" dur="1048576s" repeatCount="indefinite" />
				</feTurbulence>
				<feComposite in="noise_0" in2="noise_1" result="noiseSum" operator="arithmetic" k1="0" k4="0" color-interpolation-filters="sRGB">
						<animate attributeName="k2" from="1" to="0" dur="16s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
						<animate attributeName="k3" from="0" to="1" dur="16s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0 0.5 1" />
				</feComposite>
				<feDisplacementMap
					in2="SourceGraphic"
					in="noiseSum"
					result="warped"
					scale="0.25"
					xChannelSelector="R"
					yChannelSelector="G"
					color-interpolation-filters="sRGB" />
			</filter>
		</defs>
		<!-- <rect x="0" y="0" width="1" height="1" filter="url(#noiseMix)" /> -->
		<!-- <rect x="0" y="0" width="1" height="1" filter="url(#noiseMix) url(#warp)" /> -->
	</svg>
</body>
</html>
