<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>CSS experiment: vars, animation, math functions, etc.</title>
	<style type="text/css">/*<![CDATA[*/
		@property --t {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		/* @property --t2 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		} */
		@property --t3 {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		/* @keyframes anim1 {
			to {
				--t: 1;
			}
		} */
		:root {
			color-scheme: dark;
			font-size: 3em;

			/* animation-name: anim1;
			animation-duration: 9s;
			animation-iteration-count: infinite;
			animation-timing-function: linear; */
			/* animation-timeline: scroll(block nearest); */

			--t2: mod(4 * var(--t), 1);
			--t3: round(nearest, var(--t), 0.0625);
			--t4: calc(0.5 * sin(4turn * var(--t)) + 0.5);
			/* --t3: var(--t); */

			transition-property: --t/* , --t2, --t3 */;
			transition-duration: 3s;
			/* transition-timing-function: linear; */
			/* transition-behavior: allow-discrete; */
			/* transition-delay: 1s; */
		}
		:root:hover {
			--t: 1.0;
		}

		.gauge {
			width: 80%;
			background-color: oklch(0.5 0 0deg / 0.5);
			margin-block-end: 0.5em;
			& > div:nth-child(1) {
				background-color: orange;
				text-wrap-mode: nowrap;
				overflow-inline: visible;
			}

			:nth-child(1 of &) { /*works better than :nth-of-type() (more specialized)*/
				& > div:nth-child(1) {
					width: calc(100% * var(--t));
				}
			}
			:nth-child(2 of &) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t2));
				}
			}
			:nth-child(3 of &) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t3));
				}
			}
			:nth-child(4 of &) {
				& > div:nth-child(1) {
					width: calc(100% * var(--t4));
				}
			}
		}

		@keyframes anim-rotate {
			to {
				rotate: 1turn;
			}
		}
		@property --phase {
			syntax: "\3c number\3e";
			inherits: true;
			initial-value: 0.0;
		}
		@keyframes anim-dummy {
			to {
				--phase: 1.0;
			}
		}
		.spinner {
			float: left;
			margin-inline: 1em;
			width: 4em;
			height: 4em;

			background-color: green;

			:nth-child(1 of &) {
				animation-name: anim-rotate;
				animation-duration: 4s;
				/* animation-duration: calc(4s / var(--t3)); */
				animation-iteration-count: infinite;
				animation-timing-function: linear;
				/* animation-fill-mode: both; */
				/* animation-play-state: paused; */
				/* animation-composition: ; */

				/* animation-delay: 0s; */
				/* animation-delay: calc(-4s * round(nearest, var(--t), 0.0625)); */ /*doesn't work*/
				/*note: animation-delay is documented as not animatable.*/
				/*doesn't work in Firefox (although the animation still plays), as of 2025-05.*/
				animation-delay: calc(-4s * var(--t3));
				/* animation-delay: calc(-1s * var(--t4)); */

				/*doesn't work properly*/
				/* transition-property: animation-delay;
				transition-duration: 1s; */
				/* :root:hover & {
					animation-delay: -3s;
				} */
			}
			:nth-child(2 of &) {
				/*works in both Chrome and Firefox.*/
				animation-name: anim-dummy;
				animation-duration: 4s;
				animation-iteration-count: infinite;
				animation-timing-function: linear;
				rotate: calc(1turn * (var(--phase) + var(--t3)));
			}
		}
	/*]]>*/</style>
</head>
<body>
	<p>(Move the cursor in and out of the page.)</p>
	<div class="gauge"><div>--t (under transition)</div></div>
	<div class="gauge"><div>mod(4 * var(--t), 1)</div></div>
	<div class="gauge"><div>round(nearest, var(--t), 0.0625)</div></div>
	<div class="gauge"><div>calc(0.5 * sin(4turn * var(--t)) + 0.5)</div></div>
	<div class="spinner">asfd</div>
	<div class="spinner">asfd</div>
</body>
</html>
