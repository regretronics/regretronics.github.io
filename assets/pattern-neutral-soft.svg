<svg xmlns="http://www.w3.org/2000/svg" version="1.1" 
	width="256" height="256" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice" 
	style="background-color: gray;">
	<defs>
		<filter id="blur" 
			filterUnits="objectBoundingBox" x="0" y="0" width="100%" height="100%" 
			primitiveUnits="userSpaceOnUse">
			<feGaussianBlur in="SourceGraphic" 
				x="0" y="0" width="100%" height="100%" 
				stdDeviation="48" edgeMode="none" 
				color-interpolation-filters="sRGB" />
		</filter>
		<pattern id="bg" viewBox="0 0 2 2" width="50%" height="50%" preserveAspectRatio="xMidYMid slice">
			<!-- <rect x="0" y="0" width="2" height="2" fill="gray" /> -->

			<rect x="0" y="0" width="1" height="1" fill="black" />
			<rect x="1" y="0" width="1" height="1" fill="white" />
			<rect x="0" y="1" width="1" height="1" fill="white" />
			<rect x="1" y="1" width="1" height="1" fill="black" />
			<!-- <rect x="0.125" y="0.125" width="0.75" height="0.75" fill="black" />
			<rect x="1.125" y="0.125" width="0.75" height="0.75" fill="white" />
			<rect x="0.125" y="1.125" width="0.75" height="0.75" fill="white" />
			<rect x="1.125" y="1.125" width="0.75" height="0.75" fill="black" /> -->
		</pattern>
	</defs>
	<rect x="-50%" y="-50%" height="200%" width="200%" fill="url(#bg)" style="filter: url(#blur);" />
</svg>
