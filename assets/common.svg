			</feComponentTransfer>
			<feGaussianBlur stdDeviation="0.0078125" color-interpolation-filters="sRGB" />
			<feComponentTransfer color-interpolation-filters="sRGB">
				<feFuncR type="table" tableValues="0 0.90625"></feFuncR>
				<feFuncG type="table" tableValues="0 0.59375"></feFuncG>
				<feFuncB type="table" tableValues="0 1"></feFuncB>
			</feComponentTransfer>
		</filter>
