<svg xmlns="http://www.w3.org/2000/svg" version="1.1" 
	viewBox="0 0 1 1" preserveAspectRatio="none">
	<defs>
		<style>/*<![CDATA[*/
			filter :not(.interp-revert) {
				color-interpolation-filters: sRGB; /* linearRGB */
			}
			filter .interp-revert {
				color-interpolation-filters: linearRGB;
			}
		/*]]>*/</style>
		<!-- original (cubic) smoothstep function (squashing effect) -->
		<!-- x="0" y="0" width="1" height="1" -->
		<filter id="fltTransferSquashOld" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
			<!-- 3x^2 - 2x^3 -->
			<!-- 3x^2 - 3(2/3 x^3) and 3x^2 + 3(1 - 2/3 x^3) - 3 didn't work properly. -->
			<feComponentTransfer in="SourceGraphic" result="gamma3">
				<feFuncR type="gamma" amplitude="1" exponent="3" offset="0" />
				<feFuncG type="gamma" amplitude="1" exponent="3" offset="0" />
				<feFuncB type="gamma" amplitude="1" exponent="3" offset="0" />
				<!-- <feFuncA type="linear" slope="-1" intercept="1" /> -->
			</feComponentTransfer>
			<feComponentTransfer in="SourceGraphic" result="gamma2">
				<feFuncR type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncG type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncB type="gamma" amplitude="1" exponent="2" offset="0" />
				<!-- <feFuncA type="linear" slope="0" intercept="1" /> -->
			</feComponentTransfer>
			<!--feComposite greatly complicates alpha manipulation, and trying to reset alpha beforehand doesn't seem to avoid this. but with k2+k3 = 1 (e.g. 3 and -2 as slopes), the alpha tends to pass through.-->
			<feComposite in="gamma3" in2="gamma2" result="polynomial" operator="arithmetic" k1="0" k2="-2" k3="3" k4="0" />
			<!-- <feComposite in="gamma2" in2="gamma3" result="polynomial" operator="arithmetic" k1="0" k2="3" k3="-3" k4="0" /> -->
			<!-- <feComponentTransfer>
				<feFuncR type="identity" />
				<feFuncG type="identity" />
				<feFuncB type="identity" />
				<feFuncA type="linear" slope="0" intercept="1" />
			</feComponentTransfer> -->
			<!-- <feComposite in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="0" k4="0" /> -->
		</filter>
		<filter id="fltTransferSquash3" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
			<!-- 3x^2 - 2x^3 = x^2 (3 - 2x) = 3 x^2 (1 - 2x/3) -->
			<feComponentTransfer in="SourceGraphic" result="linear3_2">
				<feFuncR type="linear" slope="-0.6667" intercept="1" />
				<feFuncG type="linear" slope="-0.6667" intercept="1" />
				<feFuncB type="linear" slope="-0.6667" intercept="1" />
			</feComponentTransfer>
			<feComponentTransfer in="SourceGraphic" result="gamma2">
				<feFuncR type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncG type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncB type="gamma" amplitude="1" exponent="2" offset="0" />
			</feComponentTransfer>
			<feComposite in="linear3_2" in2="gamma2" result="polynomial" operator="arithmetic" k1="3" k2="0" k3="0" k4="0" />
			<!-- <feBlend in="linear3_2" in2="gamma2" result="polynomial" mode="multiply" /> -->
		</filter>
		<!-- quintic smoothstep (a.k.a. smootherstep) function -->
		<filter id="fltTransferSquash5" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox">
			<!-- 6x^5 - 15x^4 + 10x^3 = x^3 (6x^2 - 15x + 10) = 10x^3 (3/5 x^2 - 3/2 x + 1) -->
			<!-- ? x^3 (6x^2 + 5 (2 - 3x)) -->
			<!-- <feComponentTransfer in="SourceGraphic" result="linear_inv">
				<feFuncR type="linear" slope="-1" intercept="1" />
				<feFuncG type="linear" slope="-1" intercept="1" />
				<feFuncB type="linear" slope="-1" intercept="1" />
			</feComponentTransfer> -->
			<feComponentTransfer in="SourceGraphic" result="gamma2">
				<feFuncR type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncG type="gamma" amplitude="1" exponent="2" offset="0" />
				<feFuncB type="gamma" amplitude="1" exponent="2" offset="0" />
			</feComponentTransfer>
			<feComponentTransfer in="SourceGraphic" result="gamma3">
				<feFuncR type="gamma" amplitude="1" exponent="3" offset="0" />
				<feFuncG type="gamma" amplitude="1" exponent="3" offset="0" />
				<feFuncB type="gamma" amplitude="1" exponent="3" offset="0" />
			</feComponentTransfer>
			<!-- <feComposite in="SourceGraphic" in2="gamma2" result="polynomial" operator="arithmetic" k1="0" k2="2" k3="-1" k4="0" /> -->
			<feComposite in="SourceGraphic" in2="gamma2" result="polynomial" operator="arithmetic" k1="0" k2="-1.5" k3="0.6" k4="1" />
			<feComposite in="polynomial" in2="gamma3" result="polynomial" operator="arithmetic" k1="10" k2="0" k3="0" k4="0" />
			<!-- <feBlend in="linear3_2" in2="gamma2" result="polynomial" mode="multiply" /> -->
			<feGaussianBlur stdDeviation="0.0009765625" />
		</filter>

