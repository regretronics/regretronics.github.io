	<script type="module">
	"use strict";
	import * as THREE from 'three';

	var material0, uniforms1, material1;

	function main() {
		window.canvas = document.querySelector('#c');
		window.renderer = new THREE.WebGLRenderer({/* antialias: true, */ /* stencil: true, */ depth: true, canvas});
		//renderer.autoClearColor = false;
		//renderer.setTransparentSort(null);
		window.camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 3);

		window.scene = new THREE.Scene();
		window.geometry = new THREE.BoxGeometry(1, 1, 1);

		material0 = new THREE.MeshBasicMaterial({
			color: 0xff8000,
			//side: THREE.DoubleSide,
			//side: THREE.BackSide,
			//transparent: true,
			//opacity: 1.0
		});

		window.mesh = new THREE.Mesh(geometry, material0);
		scene.add(mesh);
		camera.position.z = 2;

		//new THREE.Vector2()
		//renderer.getDrawingBufferSize
		window.target0 = new THREE.WebGLRenderTarget(canvas.width, canvas.height, {format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: true});
		target0.depthTexture = new THREE.DepthTexture();
		target0.depthTexture.format = THREE.DepthFormat;
		target0.depthTexture.type = THREE.FloatType;

		uniforms1 = {
			//iTime: { value: 0 },
			//iResolution: { value: new THREE.Vector3() },
			target0: { value: target0.texture },
			target0depth: { value: target0.depthTexture },
		};
		material1 = new THREE.ShaderMaterial({
			fragmentShader: document.getElementById("FS1").textContent.trim(),
			uniforms: uniforms1,
			//side: THREE.DoubleSide,
			side: THREE.BackSide,
			//transparent: true,
			//opacity: 1.0
		});

		requestAnimationFrame(render);
	}

	function resizeRendererToDisplaySize(renderer) {
		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if(needResize) {
			renderer.setSize(width, height, false);
			target0.setSize(width, height);
		}
		return needResize;
	}

	function render(time) {
		time *= 0.001; // convert to seconds

		mesh.rotation.x += 0.002;
		mesh.rotation.y += 0.002;

		resizeRendererToDisplaySize(renderer);

		const canvas = renderer.domElement;
		//uniforms1.iResolution.value.set(canvas.width, canvas.height, 1);
		//uniforms1.iTime.value = time;

		//frontmost layer
		mesh.material = material0;
		renderer.setRenderTarget(target0);
		renderer.render(scene, camera);

		//next layer
		uniforms1.target0.value = target0.texture;
		uniforms1.target0depth.value = target0.depthTexture;
		mesh.material = material1;
		renderer.setRenderTarget(null);
		renderer.render(scene, camera);

		requestAnimationFrame(render);
	}

	main();
	</script>
