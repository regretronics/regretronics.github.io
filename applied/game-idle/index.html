<!DOCTYPE html>
<!--This document aims to be Polyglot HTML5, so no XML PIs or XML declaration.-->
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr" lang="en" xml:lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Idle game attempt!</title>
	<style type="text/css">/*<![CDATA[*/
	@property --hue1 {
		syntax: "<number>";
		inherits: true;
		initial-value: 0.5;
	}
	:root {
		--hue1-ang: 0deg;
		--hue1-ang: calc(60deg * var(--hue1, 0) + 41deg); /*red = ~41deg*/

		--gain-balance: display-p3 calc(r*29/32) calc(g*26/32) b;
		--shade-b: color(display-p3 0 0 0 / 0.75);
		--shade-w: color(display-p3 0.90625 0.8125 1 / 0.75);

		/*box-shadow: bottom-right, top-left, etc.*/
		--sh-br: 0.0625em 0.0625em;
		--sh-tl: -0.0625em -0.0625em;
		--sh-thin: 0.0625em -0.0625em;
		--sh-thick: 0.125em -0.0625em;

		color-scheme: dark;
		/* background-color: canvas;
		color: canvastext; */

		/* background-color: oklch(0.25 0 var(--hue1-ang, 0deg)); */
		/* color: oklch(0.875 0 var(--hue1-ang, 0deg)); */
		/* color: color(display-p3	0.90625 0.59375 1.0); */
		background-color: color(from oklch(0.125 0 0deg) var(--gain-balance));
		color: color(from oklch(0.875 0 0deg) var(--gain-balance));

		animation-name: hueShift;
		animation-duration: 12s;
		animation-iteration-count: infinite;
		animation-timing-function: linear;
	}
	@keyframes hueShift {
		0% {
			--hue1: 0.0;
		}
		100% {
			--hue1: 6.0;
		}
	}
	body {
		font-size: 1.25em;
		font-variant: slashed-zero;
		overflow-wrap: break-word; /*2024-08: fix for Chrome vs. Ffx layout differences and Chrome layout bug*/
	}

	h1 {
		font-size: 3em;
		line-height: 0.8;
		text-align: center;
		opacity: 0.8;
	}
	h1 small {
		font-size: 0.6em;
		font-variant: small-caps;
	}
	h1:first-of-type + p {
		font-variant: small-caps;
	}

	input, textarea, button, select {
		font-size: inherit;
	}
	input:not([type=checkbox]):not([type=radio]), textarea, button, select {
		border-start-start-radius: 0.125em;
		border-start-end-radius: 0.3125em;
		border-end-start-radius: 0.125em;
		border-end-end-radius: 0.3125em;
		border-width: 0;
		padding: 0.125em;

		/* background-color: oklch(0.25 0.0625 var(--hue1-ang, 0deg));
		color: oklch(0.75 0.0625 var(--hue1-ang, 0deg)); */
		background-color: color(from oklch(0.25 0.0625 var(--hue1-ang, 0deg)) var(--gain-balance));
		color: color(from oklch(0.75 0.0625 var(--hue1-ang, 0deg)) var(--gain-balance));
	}
	input[type="checkbox"], input[type="radio"] {
		width: 1em;
		height: 1em;
	}
	input[type="number"] {
		width: 8ch;
		text-align: right;
		border-start-start-radius: 0.3125em;
		border-start-end-radius: 0.125em;
		border-end-start-radius: 0.3125em;
		border-end-end-radius: 0.125em;
	}
	input:is([type="button"], [type="submit"], [type="reset"]), button {
		font-variant: small-caps;
	}
	input:is([type="button"], [type="submit"], [type="reset"]), button { /* to do: active or focus? */
		padding: 0.25em;

		box-shadow:
			/* inset 0.0625em 0.0625em 0.0625em -0.0625em rgba(255, 255, 255, 0.75),
			inset -0.0625em -0.0625em 0.0625em -0.0625em rgba(0, 0, 0, 0.75),
			-0.0625em -0.0625em 0.0625em -0.0625em rgba(255, 255, 255, 0.75),
			0.0625em 0.0625em 0.0625em -0.0625em rgba(0, 0, 0, 0.75); */
			/* inset 0.0625em 0.0625em 0.0625em -0.0625em var(--shade-w, white),
			inset -0.0625em -0.0625em 0.0625em -0.0625em var(--shade-b, black),
			-0.0625em -0.0625em 0.0625em -0.0625em var(--shade-w, white),
			0.0625em 0.0625em 0.0625em -0.0625em var(--shade-b, black); */
			inset var(--sh-br) var(--sh-thin) var(--shade-w, white),
			inset var(--sh-tl) var(--sh-thin) var(--shade-b, black),
			var(--sh-tl) var(--sh-thin) var(--shade-w, white),
			var(--sh-br) var(--sh-thin) var(--shade-b, black);
	}
	:is(input:is([type="button"], [type="submit"], [type="reset"]), button):active:hover {
		box-shadow:
			inset var(--sh-br) var(--sh-thin) var(--shade-b, black),
			inset var(--sh-tl) var(--sh-thin) var(--shade-w, white),
			var(--sh-tl) var(--sh-thick) var(--shade-b, black),
			var(--sh-br) var(--sh-thick) var(--shade-w, white);
	}

	details > summary:first-of-type {
		cursor: pointer;
	}
	#outWpRndArticle:empty, #outWpRndArticle.stalled {
		opacity: 0.5;
	}
	#outWpRndArticle:empty::before, #outWpRndArticle.stalled::before {
		font-variant: small-caps;
		content: 'uhm... Loading?';
	}
	#wpRndInfoCard > li:first-of-type > ul {
		font-size: 0.8em;
	}
	#lstWpRndHistory {
		font-size: 0.8em;
	}
	#lstWpRndHistory:empty::before {
		opacity: 0.5;
		font-variant: small-caps;
		content: '(empty)';
	}
	/*]]>*/</style>
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	var counter = 0, counterInc = 1;
	function setCounter(value, save) {
		counter = value;
		outCounter.textContent = counter.toString();

		if(save) {
			//localStorage.setItem("counter", counter);
			localStorage.setItem("counter", JSON.stringify(counter));
		}
	}
	function setCounterInc(value, save) {
		counterInc = value;
		outCounterInc.textContent = counterInc.toString();

		if(save) {
			//localStorage.setItem("counterInc", counterInc);
			localStorage.setItem("counterInc", JSON.stringify(counterInc));
		}
	}

	var idleTimer = null;
	var cycleIntervalMs = 1000;
	function idleCycle() {
		idleTimer = setTimeout(idleCycle, cycleIntervalMs);

		setCounter(counter + counterInc, true);

		if(!document.hidden) WpRndNextArticle();
	}

	const rndArticleBuffer = [];
	async function WpRndFetchArticles() {
		const url = "https://en.wikipedia.org/w/api.php?" +
			/* new URLSearchParams({
				origin: "*",
				action: "parse",
				page: "Test",
				format: "json",
			}); */
			/* new URLSearchParams({
				origin: "*",
				action: "query",
				format: "json",
				list: "random",
				formatversion: "2",
				rnnamespace: "0",
				rnlimit: "16",
			}); */
			new URLSearchParams({
				origin: "*",
				action: "query",
				format: "json",
				formatversion: "2",
				generator: "random",
				grnnamespace: "0",
				grnlimit: "16",
				prop: "pageterms",
			});

		try {
			const req = await fetch(url);
			const json = await req.json();
			//rndArticleBuffer.push(...json.query.random);
			rndArticleBuffer.push(...Object.values(json.query.pages));

			if(outWpRndArticle.classList.contains("stalled") || !outWpRndArticle.hasChildNodes()) WpRndNextArticle();
		} catch(e) {
			console.error(e);
		}
	}
	function WpRndNextArticle() {
		if(rndArticleBuffer.length < 2) WpRndFetchArticles();

		const article = rndArticleBuffer.shift();
		if(!article) {
			outWpRndArticle.classList.add("stalled");
			return;
		}

		outWpRndArticle.textContent = article.title;
		outWpRndArticle.classList.remove("stalled");

		let articleAnchor = document.createElement("a");
		articleAnchor.textContent = article?.terms?.label ?? article.title;
		articleAnchor.href = "https://en.wikipedia.org/wiki/" + (article?.title ?? "").replaceAll(" ", "_");

		wpRndInfoCard.innerHTML = "";
		let labelItem = wpRndInfoCard.appendChild(document.createElement("li"));
		labelItem.append(articleAnchor);

		if(article?.terms?.alias) {
			let aliasList = labelItem.appendChild(document.createElement("ul"));
			for(const alias of article.terms.alias)
				aliasList.appendChild(document.createElement("ul")).textContent = alias;
		}
		
		if(article?.terms?.description)
			wpRndInfoCard.appendChild(document.createElement("li")).textContent = article.terms.description;
		
		let historyNew = document.createElement("li");
		historyNew.append(articleAnchor.cloneNode(true));
		lstWpRndHistory.prepend(historyNew);
		while(lstWpRndHistory.childElementCount > 16) {
			lstWpRndHistory.lastElementChild.remove();
		}
	}

	function btnGameResetClick(event) {
		if(!confirm("Please confirm if you are dumb.")) return;

		if(idleTimer) {
			clearTimeout(idleTimer);
			idleTimer = null;
		}

		//localStorage.removeItem("counter");
		//localStorage.removeItem("counterInc");
		//localStorage.removeItem("cycleInterval");
		localStorage.clear();

		setCounter(0, true);
		setCounterInc(1, true);
		cycleIntervalMs = 1000;

		idleTimer = setTimeout(idleCycle, cycleIntervalMs);
	}
	function btnUpgradeClick(event) {
		if(counter < 256) return;

		setCounterInc(counterInc + 1, true);
		setCounter(counter - 256, true);
	}

	/* function pageLoad(event) {
	} */
	function pageReady(event) {
		//load HTML element references (renders document.getElementById unnecessary)
		for(let s of document.querySelectorAll("[id]"))
			window[s.id] = s;

		btnGameReset.addEventListener("click", btnGameResetClick);
		//txtParam01.addEventListener("input", txtParam01Input);
		btnUpgrade.addEventListener("click", btnUpgradeClick);

		let s = localStorage.getItem("counter");
		if(s) {
			//setCounter(parseFloat(s));
			setCounter(parseFloat(JSON.parse(s)));
		}
		s = localStorage.getItem("counterInc");
		if(s) {
			//setCounterInc(parseFloat(s));
			setCounterInc(parseFloat(JSON.parse(s)));
		}
		s = localStorage.getItem("cycleInterval");
		if(s) {
			//cycleIntervalMs = 1000 * parseFloat(s);
			cycleIntervalMs = 1000 * parseFloat(JSON.parse(s));
		}

		WpRndFetchArticles();
		idleTimer = setTimeout(idleCycle, cycleIntervalMs);
	}
	//window.addEventListener("DOMContentLoaded", pageLoad);
	window.addEventListener("load", pageReady);
	/*]]>*/</script>
</head>
<body>
	<h1>Idol machine<br />
		<small>the Game</small></h1>
	<p>Simple to learn, hard to master. Relentlessly unrewarding. Insanely addictive. Made with laziness by idlelaters of @, for idlelaters.</p>
	<p><button id="btnGameReset">Reset game state</button></p>
	<p>The counter: <output id="outCounter">0</output>.</p>
	<p>The counter increment: <output id="outCounterInc">1</output>.</p>
	<!-- <p>The parameter: <input type="number" id="txtParam01" step="1" value="1" />.</p> -->
	<p><button id="btnUpgrade">False reward<br />
		cost: counter 256</button></p>
	<details>
		<summary>Random Wikipedia article: <output id="outWpRndArticle"></output>.</summary>
		<ul id="wpRndInfoCard"></ul>
		<p>History:</p>
		<ol id="lstWpRndHistory"></ol>
	</details>
</body>
</html>
