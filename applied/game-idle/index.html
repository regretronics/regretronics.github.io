<head>

	<title>Idle game attempt!</title>
	<!-- <link rel="stylesheet" type="text/css" href="./general.css" crossorigin="anonymous" /> -->
	<link rel="stylesheet" type="text/css" href="general.css" />
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	var storageCanWrite = false;
	function saveData(field, value) {
		if(!storageCanWrite) return;
		localStorage.setItem("gameIdle." + field, JSON.stringify(value));
	}

	const gameStateFields = {
		counter: {
			titleLong: "The counter",
			title: "counter",
			listed: true,
		},
		counterInc: {
			titleLong: "The counter increment",
			title: "counter inc",
			listed: true,
		},
		cycleIntervalMs: {
			listed: false,
		}
	};
	const gameStateInitial = {
		counter: 0,
		counterInc: 1,
		cycleIntervalMs: 1000,
	};

	//var gameState = {}; //central state structure
	var gameState = Object.assign({}, gameStateInitial);
	function getStateField(field) {
		return gameState[field];
	}
	function setStateField(field, value) {
		gameState[field] = value;
		saveData("state." + field, value); //persistence

		//update UI
		if(!gameStateFields[field].listed) return;
		//const outElem = document.querySelector('output[data-field="' + field + '"]');
		const outElem = document.querySelector('[data-field="' + field + '"] > .value');
		if(outElem) outElem.textContent = value.toString();
	}
	//redo the UI about state
	function loadStateList(targetList) {
		targetList.innerHTML = ""; //empty previous contents

		for(const field in gameState) {
			if(!Object.prototype.hasOwnProperty.call(gameState, field)) continue;
			if(!gameStateFields[field].listed) return;
			const value = gameState[field];

			const fieldElem = targetList.appendChild(document.createElement("li")); //a state field
			fieldElem.dataset["field"] = field;

			//const fieldTitle = fieldElem.appendChild(document.createElement("label"));
			const fieldTitle = fieldElem.appendChild(document.createElement("span"));
			fieldTitle.classList.add("title");
			fieldTitle.textContent = (gameStateFields[field].titleLong ?? gameStateFields[field].title ?? field);
			//fieldTitle.htmlFor = "outField-" + field;
			fieldElem.appendChild(document.createTextNode(": "));

			const fieldValue = fieldElem.appendChild(document.createElement("output"));
			fieldValue.classList.add("value");
			fieldValue.textContent = value.toString(); //to do: ...generalize this
		}
	}
	function updateStateValues(targetList) {
		//to do
	}

	var idleTimer = null; //used to control pending updates
	var gameRunning = true, wpRunning = true;
	function idleCycle() {
		if(!gameRunning) { //cancel
			idleTimer = null;
			return;
		}
		idleTimer = setTimeout(idleCycle, getStateField("cycleIntervalMs")); //perpetuate

		//calculations
		//gameState.counter = gameState.counter + gameState.counterInc;
		setStateField("counter", getStateField("counter") + getStateField("counterInc"));

		//random article pumping
		if(!document.hidden && wpRunning) WpRndNextArticle();
	}
	function startGameCycle() {
		if(gameRunning) idleTimer = setTimeout(idleCycle, getStateField("cycleIntervalMs"));
	}

	var rndArticleBuffer = [];
	async function WpRndFetchArticles() {
		if(!navigator.onLine) return;

		const url = "https://en.wikipedia.org/w/api.php?" +
			/* new URLSearchParams({
				origin: "*",
				action: "parse", //https://www.mediawiki.org/wiki/API:Parsing_wikitext
				page: "Test",
				format: "json",
			}); */
			/* new URLSearchParams({
				origin: "*",
				action: "query", //https://www.mediawiki.org/wiki/API:Query
				format: "json",
				list: "random", //https://www.mediawiki.org/wiki/API:Random
				formatversion: "2",
				rnnamespace: "0",
				rnlimit: "16",
			}); */
			new URLSearchParams({
				origin: "*",
				action: "query",
				format: "json",
				formatversion: "2",
				generator: "random", //https://www.mediawiki.org/wiki/API:Query#Generators
				grnnamespace: "0",
				grnlimit: "64",
				prop: "pageterms", //https://www.mediawiki.org/wiki/API:Query#API_documentation
			});
		try {
			//https://www.mediawiki.org/wiki/API:Parsing_wikitext#JavaScript
			//https://www.mediawiki.org/wiki/API:Random#JavaScript
			const req = await fetch(url);
			const json = await req.json();
			//rndArticleBuffer.push(...json.query.random);
			rndArticleBuffer.push(...Object.values(json.query.pages));

			if(wpRunning && (outWpRndArticle.classList.contains("stalled") || !outWpRndArticle.hasChildNodes())) //pump it up?
				WpRndNextArticle();
			else
				saveData("rndArticleBuffer", rndArticleBuffer);
		} catch(error) {
			console.error(error);
		}
	}
	const rndArticleBufferLookahead = 16;
	const articleHistoryLimit = 16;
	function WpRndNextArticle() {
		if(rndArticleBuffer.length < rndArticleBufferLookahead) WpRndFetchArticles();

		const article = rndArticleBuffer.shift();
		saveData("rndArticleBuffer", rndArticleBuffer);
		if(!article) { //no good for now
			outWpRndArticle.classList.add("stalled");
			return;
		}

		outWpRndArticle.textContent = article.title;
		outWpRndArticle.classList.remove("stalled");

		//update the UI
		const articleAnchor = document.createElement("a"); //link to article
		articleAnchor.textContent = article.terms?.label ?? article.title;
		articleAnchor.href = "https://en.wikipedia.org/wiki/" + (article.title ?? "").replaceAll(" ", "_");

		//replacement
		wpRndInfoCard.innerHTML = "";
		const labelItem = wpRndInfoCard.appendChild(document.createElement("li"));
		labelItem.classList.add("title-item");
		labelItem.append(articleAnchor);

		if(article.terms?.alias) { //list of aliases, not always present
			const aliasList = labelItem.appendChild(document.createElement("ul"));
			aliasList.classList.add("alias-list");
			for(const alias of article.terms.alias) {
				const aliasElem = aliasList.appendChild(document.createElement("li"));
				aliasElem.textContent = alias;
				aliasElem.classList.add("alias");
			}
		}

		if(article.terms?.description) {
			const descriptionItem = wpRndInfoCard.appendChild(document.createElement("li"));
			descriptionItem.textContent = article.terms.description;
			descriptionItem.classList.add("desc-item");
		}
		
		//insertion in list
		const historyNew = document.createElement("li");
		historyNew.append(articleAnchor.cloneNode(true)); //reuse
		historyNew.classList.add("history-item");
		if(article.terms?.description) {
			historyNew.appendChild(document.createTextNode(" "));
			const descriptionLabel = historyNew.appendChild(document.createElement("span"));
			descriptionLabel.textContent = article.terms.description;
			descriptionLabel.classList.add("article-description");
		}
		lstWpRndHistory.prepend(historyNew);
		while(lstWpRndHistory.childElementCount > articleHistoryLimit) //truncation
			lstWpRndHistory.lastElementChild.remove();
	}

	/* //this is getting too generalized/complicated
	const changeLinear = (current, change) => (current + change);
	const conditionGreaterEq = (current, threshold) => (current >= threshold);
	const gameOperations = [
		{
			title: "False reward",
			reqs: [
				{field: "counter", thresholdFunc: conditionGreaterEq, thresholdVal: 256, changeFunc: changeLinear, changeVal: -256},
			],
			effects: [
				{field: "counterInc", changeFunc: changeLinear, changeVal: 1, adjustFunc: null, adjustVal: null},
			],
		},
	]; */
	//currently the only difference between costs and rewards is that costs are also prerequisites
	const gameTrades = [
		{
			title: "False reward",
			costs: [
				{field: "counter", change: -256},
			],
			rewards: [
				{field: "counterInc", change: 1},
			],
		},
		{
			title: "Pure regret",
			costs: [
				{field: "counterInc", change: -1},
			],
			rewards: [
				{field: "counter", change: 128},
			],
		},
	];
	//redo the UI about trades
	function loadTrades(targetList) {
		targetList.innerHTML = ""; //empty previous contents

		for(const key in gameTrades) {
			if(!Object.prototype.hasOwnProperty.call(gameTrades, key)) continue;
			const trade = gameTrades[key];

			const tradeElem = targetList.appendChild(document.createElement("li")); //a trade
			const tradeTitle = tradeElem.appendChild(document.createElement("label"));
			tradeTitle.textContent = trade.title;
			tradeTitle.htmlFor = "btnTradeOrder" + key;
			tradeTitle.classList.add("trade-title");
			tradeElem.appendChild(document.createTextNode(" "));

			const btnTradeOrder = tradeElem.appendChild(document.createElement("button"));
			btnTradeOrder.id = "btnTradeOrder" + key;
			btnTradeOrder.textContent = "Order";
			btnTradeOrder.addEventListener("click", btnTradeOrderClick);
			btnTradeOrder.dataset["tradeIdx"] = key;

			const lstTradeFeatures = tradeElem.appendChild(document.createElement("ul")); //features of a trade
			lstTradeFeatures.classList.add("trade-features-list");
			const enumFeatures = function(list, featureClass) {
				for (const item of list) {
					const featureElem = lstTradeFeatures.appendChild(document.createElement("li")); //feature

					const featureField = featureElem.appendChild(document.createElement("span"));
					featureField.textContent = featureClass;
					featureField.classList.add("field");

					featureElem.appendChild(document.createTextNode(": "));

					const featureValue = featureElem.appendChild(document.createElement("span"));
					featureValue.textContent = item.field + " " + item.change.toString();
					featureValue.classList.add("value");
				}
			}
			enumFeatures(trade.costs, "cost");
			enumFeatures(trade.rewards, "reward");
		}
	}
	function btnTradeOrderClick(event) {
		if(!event || !event.target) return;

		//get the data structure of a trade
		const tradeIdx = parseFloat(event.target.dataset["tradeIdx"]);
		if(tradeIdx === NaN) return;
		const tradeObj = gameTrades[tradeIdx];
		if(!tradeObj) return;

		//get the requisites and check their presence; quits if some are not present
		for(const cost of tradeObj.costs) {
			let costVal = cost.change ?? -1;
			if(costVal === NaN) costVal = -1;
			//if(gameState[cost.field] < -costVal) return;
			if(getStateField(cost.field) < -costVal) return;
		}

		//apply costs and rewards
		for(const cost of tradeObj.costs) {
			let costVal = cost.change ?? -1;
			if(costVal === NaN) costVal = -1;
			//gameState[cost.field] = gameState[cost.field] + costVal;
			setStateField(cost.field, getStateField(cost.field) + costVal);
		}
		for(const reward of tradeObj.rewards) {
			let rewardVal = reward.change ?? 1;
			if(rewardVal === NaN) rewardVal = 1;
			//gameState[reward.field] = gameState[reward.field] + rewardVal;
			setStateField(reward.field, getStateField(reward.field) + rewardVal);
		}
	}

	function eraseData(field) {
		localStorage.removeItem(field);
		localStorage.removeItem("gameIdle." + field);
	}
	function btnGameResetClick(event) {
		if(!confirm("Please confirm if you are dumb.")) return;

		if(idleTimer) {
			clearTimeout(idleTimer);
			idleTimer = null;
		}

		//localStorage.clear();
		//eraseData("counter");
		//eraseData("counterInc");
		//eraseData("cycleInterval");
		for(const field in gameState) {
			//if(Object.prototype.hasOwnProperty.call(gameState, field))
			eraseData(field);
			eraseData("state." + field);
		}
		//eraseData("rndArticleBuffer"); //?

		//reset proper, to initial values
		storageCanWrite = true;
		//gameState.counter = counterInitial;
		//gameState.counterInc = counterIncInitial;
		//gameState = Object.assign({}, gameStateInitial); //setters missing
		gameState = {};
		for(const field in gameStateInitial)
			if(Object.prototype.hasOwnProperty.call(gameStateInitial, field)) {
				const value = gameStateInitial[field];
				//gameState[field] = value;
				setStateField(field, value);
			}

		//finally restart the game cycle
		startGameCycle();
	}
	function chkGameRunningClick(event) {
		gameRunning = chkGameRunning.checked;
		saveData("gameRunning", gameRunning);
		if(!idleTimer) startGameCycle();
	}
	function detailsToggleSave(event) {
		if(!event || !event.target) return;
		//saveData(event.target.id + ".open", event.newState.startsWith("open"));
		saveData(event.target.id + ".open", event.target.open);
	}
	function chkWpRunningClick(event) {
		wpRunning = chkWpRunning.checked;
		saveData("wpRunning", wpRunning);
	}

	function loadState() {
		try {
			storageCanWrite = false; //inhibit storing feedback in setters
			const retrieve = function(field, continuation) {
				let s = localStorage.getItem("gameIdle." + field);
				if(!s) {
					s = localStorage.getItem(field);
					if(s) {
						localStorage.removeItem(field);
						localStorage.setItem("gameIdle." + field, s);
					}
				}
				if(s) continuation(JSON.parse(s));
			};
			
			//deprecated
			retrieve("counter", v => {setStateField("counter", v);});
			retrieve("counterInc", v => {setStateField("counterInc", v);});
			retrieve("cycleInterval", v => {setStateField("cycleIntervalMs", 1000 * v);});
			eraseData("counter");
			eraseData("counterInc");
			eraseData("cycleInterval");
			
			//take values from all stored game state fields
			for(let i = 0; i < localStorage.length; i++) {
				const field = localStorage.key(i);
				if(!field.startsWith("gameIdle.state.")) continue;
				const s = localStorage.getItem(field);
				if(s) setStateField(field.replace("gameIdle.state.", ""), JSON.parse(s));
			}

			retrieve("gameRunning", v => {gameRunning = v;});
			retrieve("rndArticleBuffer", v => {rndArticleBuffer = v;});
			retrieve("boxGameState.open", v => {boxGameState.open = v;});
			retrieve("boxTrades.open", v => {boxTrades.open = v;});
			retrieve("boxWpRndArticle.open", v => {boxWpRndArticle.open = v;});
			retrieve("wpRunning", v => {wpRunning = v;});
		} finally {
			storageCanWrite = true;
		}
	}
	/* function pageLoad(event) {
	} */
	function pageReady(event) {
		//starting point for hue of color scheme
		document.documentElement.style.setProperty("--hue-phase", Math.random() + "turn");

		//load HTML element references (renders document.getElementById unnecessary)
		for(let s of document.querySelectorAll("[id]"))
			window[s.id] = s;

		btnGameReset.addEventListener("click", btnGameResetClick);
		//txtParam01.addEventListener("input", txtParam01Input);

		try {
			loadState();
		} catch(error) {
		}

		//update or load things in the user interface
		loadStateList(lstStateFields);
		chkGameRunning.checked = gameRunning;
		chkWpRunning.checked = wpRunning;
		loadTrades(lstTrades);

		//trap UI changes
		chkGameRunning.addEventListener("click", chkGameRunningClick);
		boxGameState.addEventListener("toggle", detailsToggleSave);
		boxTrades.addEventListener("toggle", detailsToggleSave);
		boxWpRndArticle.addEventListener("toggle", detailsToggleSave);
		chkWpRunning.addEventListener("click", chkWpRunningClick);

		//start main game functions
		WpRndNextArticle();
		startGameCycle();
	}
	//window.addEventListener("DOMContentLoaded", pageLoad);
	window.addEventListener("load", pageReady);
	/*]]>*/</script>

<body>
	<h1>Idol machine<br />
		<small>the Game</small></h1>
	<p>Simple to learn, hard to master. Relentlessly unrewarding. Insanely addictive. Made with laziness by idlelaters of @, for idlelaters.</p>
	<p><button id="btnGameReset">Reset game state</button> <input type="checkbox" id="chkGameRunning" checked="checked" /><label for="chkGameRunning">Run game</label></p>
	<!-- <p>The parameter: <input type="number" id="txtParam01" step="1" value="1" />.</p> -->
	<details id="boxGameState" open="open">
		<summary>State</summary>
		<div class="details-main">
			<ul id="lstStateFields" class="fields-list">
			</ul>
		</div>
	</details>
	<details id="boxTrades" open="open">
		<summary>Trading</summary>
		<div class="details-main">
			<ul id="lstTrades" class="trades-list">
			</ul>
		</div>
	</details>
	<details id="boxWpRndArticle" open="open">
		<summary>Random Wikipedia article: <output id="outWpRndArticle"></output>.</summary>
		<div class="details-main">
			<p><input type="checkbox" id="chkWpRunning" checked="checked" /><label for="chkWpRunning">Keep changing articles</label></p>
			<ul id="wpRndInfoCard" class="article-info"></ul>
			<p>History:</p>
			<ol id="lstWpRndHistory" class="history-list"></ol>
		</div>
	</details>
