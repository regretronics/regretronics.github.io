<head>
	<meta charset="UTF-8" />

	<title>Idle game attempt!</title>
	<!-- <link rel="stylesheet" type="text/css" href="./general.css" crossorigin="anonymous" /> -->
	<link rel="stylesheet" type="text/css" href="general.css" />
	<script type="text/javascript">/*<![CDATA[*/
	"use strict";

	var storageCanWrite = false;
	function saveData(field, value) {
		if(!storageCanWrite) return;
		localStorage.setItem("gameIdle." + field, JSON.stringify(value));
	}

	const counterInitial = 0, counterIncInitial = 1;
	const gameState = {
		_counter: counterInitial,
		get counter() {
			return this._counter;
		},
		set counter(value) {
			this._counter = value;
			outCounter.textContent = this._counter.toString();
			saveData("counter", this._counter);
		},

		_counterInc: counterIncInitial,
		get counterInc() {
			return this._counterInc;
		},
		set counterInc(value) {
			this._counterInc = value;
			outCounterInc.textContent = this._counterInc.toString();
			saveData("counterInc", this._counterInc);
		},
	};
	/* var counter = counterInitial, counterInc = counterIncInitial;
	function setCounter(value) {
		counter = value;
		outCounter.textContent = counter.toString();
		saveData("counter", counter);
	}
	function setCounterInc(value) {
		counterInc = value;
		outCounterInc.textContent = counterInc.toString();
		saveData("counterInc", counterInc);
	} */

	var idleTimer = null;
	const cycleIntervalMsInitial = 1000;
	var cycleIntervalMs = cycleIntervalMsInitial;
	var gameRunning = true, wpRunning = true;
	function idleCycle() {
		if(!gameRunning) {
			idleTimer = null;
			return;
		}
		idleTimer = setTimeout(idleCycle, cycleIntervalMs);

		//setCounter(counter + counterInc);
		gameState.counter = gameState.counter + gameState.counterInc;

		if(!document.hidden && wpRunning) WpRndNextArticle();
	}

	var rndArticleBuffer = [];
	async function WpRndFetchArticles() {
		if(!navigator.onLine) return;

		const url = "https://en.wikipedia.org/w/api.php?" +
			/* new URLSearchParams({
				origin: "*",
				action: "parse",
				page: "Test",
				format: "json",
			}); */
			/* new URLSearchParams({
				origin: "*",
				action: "query",
				format: "json",
				list: "random",
				formatversion: "2",
				rnnamespace: "0",
				rnlimit: "16",
			}); */
			new URLSearchParams({
				origin: "*",
				action: "query",
				format: "json",
				formatversion: "2",
				generator: "random",
				grnnamespace: "0",
				grnlimit: "64",
				prop: "pageterms",
			});
		try {
			const req = await fetch(url);
			const json = await req.json();
			//rndArticleBuffer.push(...json.query.random);
			rndArticleBuffer.push(...Object.values(json.query.pages));

			if(wpRunning && (outWpRndArticle.classList.contains("stalled") || !outWpRndArticle.hasChildNodes()))
				WpRndNextArticle();
			else
				saveData("rndArticleBuffer", rndArticleBuffer);
		} catch(error) {
			console.error(error);
		}
	}
	const rndArticleBufferLookahead = 16;
	const articleHistoryLimit = 16;
	function WpRndNextArticle() {
		if(rndArticleBuffer.length < rndArticleBufferLookahead) WpRndFetchArticles();

		const article = rndArticleBuffer.shift();
		saveData("rndArticleBuffer", rndArticleBuffer);
		if(!article) {
			outWpRndArticle.classList.add("stalled");
			return;
		}

		outWpRndArticle.textContent = article.title;
		outWpRndArticle.classList.remove("stalled");

		let articleAnchor = document.createElement("a");
		articleAnchor.textContent = article.terms?.label ?? article.title;
		articleAnchor.href = "https://en.wikipedia.org/wiki/" + (article.title ?? "").replaceAll(" ", "_");

		wpRndInfoCard.innerHTML = "";
		let labelItem = wpRndInfoCard.appendChild(document.createElement("li"));
		labelItem.append(articleAnchor);

		if(article.terms?.alias) {
			let aliasList = labelItem.appendChild(document.createElement("ul"));
			for(const alias of article.terms.alias)
				aliasList.appendChild(document.createElement("ul")).textContent = alias;
		}

		if(article.terms?.description)
			wpRndInfoCard.appendChild(document.createElement("li")).textContent = article.terms.description;
		
		let historyNew = document.createElement("li");
		historyNew.append(articleAnchor.cloneNode(true));
		if(article.terms?.description) {
			//historyNew.appendChild(document.createTextNode("\u00a0")); //non-breaking space
			historyNew.appendChild(document.createTextNode(" "));
			const descriptionLabel = historyNew.appendChild(document.createElement("span"));
			descriptionLabel.textContent = article.terms.description;
			descriptionLabel.classList.add("article-description");
		}
		lstWpRndHistory.prepend(historyNew);
		while(lstWpRndHistory.childElementCount > articleHistoryLimit)
			lstWpRndHistory.lastElementChild.remove();
	}

	/* //this is getting too generalized/complicated
	const changeLinear = (current, change) => (current + change);
	const conditionGreaterEq = (current, threshold) => (current >= threshold);
	const gameOperations = [
		{
			title: "False reward",
			reqs: [
				{field: "counter", thresholdFunc: conditionGreaterEq, thresholdVal: 256, changeFunc: changeLinear, changeVal: -256},
			],
			effects: [
				{field: "counterInc", changeFunc: changeLinear, changeVal: 1, adjustFunc: null, adjustVal: null},
			],
		},
	]; */
	//currently the only difference between costs and rewards is that costs are also prerequisites
	const gameTrades = [
		{
			title: "False reward",
			costs: [
				{field: "counter", change: -256},
			],
			rewards: [
				{field: "counterInc", change: 1},
			],
		},
		{
			title: "Untrue deward",
			costs: [
				{field: "counterInc", change: -1},
			],
			rewards: [
				{field: "counter", change: 256},
			],
		},
		{
			title: "Test: taker",
			costs: [
				{field: "counter", change: -256},
				{field: "counterInc", change: -1},
			],
			rewards: [
			],
		},
		{
			title: "Test: giver",
			costs: [
				],
			rewards: [
				{field: "counter", change: 256},
				{field: "counterInc", change: 1},
			],
		},
	];
	function loadTrades(targetList) {
		targetList.innerHTML = "";
		for(const key in gameTrades) {
			if(Object.prototype.hasOwnProperty.call(gameTrades, key)) {
				const trade = gameTrades[key];
				const tradeElem = targetList.appendChild(document.createElement("li"));
				const tradeCaption = tradeElem.appendChild(document.createElement("label"));
				tradeCaption.textContent = trade.title;
				tradeCaption.htmlFor = "btnTradeOrder" + key;
				tradeElem.appendChild(document.createTextNode(" "));

				const btnOrder = tradeElem.appendChild(document.createElement("button"));
				btnOrder.id = "btnTradeOrder" + key;
				btnOrder.textContent = "Order";
				btnOrder.addEventListener("click", btnOrderClick);
				btnOrder.dataset["tradeIdx"] = key;

				const lstTradeFeatures = tradeElem.appendChild(document.createElement("ul"));
				lstTradeFeatures.classList.add("trade-features-list");
				const enumFeatures = function(list, featureClass) {
					for (const item of list) {
						const featureElem = lstTradeFeatures.appendChild(document.createElement("li"));

						const featureField = featureElem.appendChild(document.createElement("span"));
						featureField.textContent = featureClass + ": ";
						featureField.classList.add("field");

						const featureValue = featureElem.appendChild(document.createElement("span"));
						featureValue.textContent = item.field + " " + item.change.toString();
						featureValue.classList.add("value");
					}
				}
				enumFeatures(trade.costs, "cost");
				enumFeatures(trade.rewards, "reward");
			}
		}
	}
	function btnOrderClick(event) {
		if(!event || !event.target) return;

		//get the data structure of a trade
		const tradeIdx = parseFloat(event.target.dataset["tradeIdx"]);
		if(tradeIdx === NaN) return;
		const tradeObj = gameTrades[tradeIdx];
		if(!tradeObj) return;

		//get the requisites and check their presence; quits if some are not present
		//to do: support for many costs and rewards
		/* const cost = tradeObj.costs[0];
		//if(cost.field != "counter") return;

		let costVal = cost.change ?? 1;
		if(costVal === NaN) costVal = 1;
		//if(counter < -costVal) return;
		if(gameState[cost.field] < -costVal) return; */
		for(const cost of tradeObj.costs) {
			let costVal = cost.change ?? 1;
			if(costVal === NaN) costVal = 1;
			if(gameState[cost.field] < -costVal) return;
		}

		//get rewards
		/* const reward = tradeObj.rewards[0];
		//if(reward.field != "counterInc") return;

		let rewardVal = reward.change ?? 1;
		if(rewardVal === NaN) rewardVal = 1; */

		//apply costs and rewards
		//setCounter(counter + costVal);
		//setCounterInc(counterInc + rewardVal);
		/* gameState[cost.field] = gameState[cost.field] + costVal;
		gameState[reward.field] = gameState[reward.field] + rewardVal; */
		for(const cost of tradeObj.costs) {
			let costVal = cost.change ?? 1;
			if(costVal === NaN) costVal = 1;
			gameState[cost.field] = gameState[cost.field] + costVal;
		}
		for(const reward of tradeObj.rewards) {
			let rewardVal = reward.change ?? 1;
			if(rewardVal === NaN) rewardVal = 1;
			gameState[reward.field] = gameState[reward.field] + rewardVal;
		}
	}

	function btnGameResetClick(event) {
		if(!confirm("Please confirm if you are dumb.")) return;

		if(idleTimer) {
			clearTimeout(idleTimer);
			idleTimer = null;
		}

		//localStorage.clear();
		const eraseData = function(field) {
			localStorage.removeItem(field);
			localStorage.removeItem("gameIdle." + field);
		}
		eraseData("counter");
		eraseData("counterInc");
		eraseData("cycleInterval");
		//eraseData("rndArticleBuffer"); //?

		storageCanWrite = true;
		//setCounter(counterInitial);
		//setCounterInc(counterIncInitial);
		gameState.counter = counterInitial;
		gameState.counterInc = counterIncInitial;
		cycleIntervalMs = cycleIntervalMsInitial;

		if(gameRunning) idleTimer = setTimeout(idleCycle, cycleIntervalMs);
	}
	function chkGameRunningClick(event) {
		gameRunning = chkGameRunning.checked;
		saveData("gameRunning", gameRunning);
		if(gameRunning && !idleTimer) idleTimer = setTimeout(idleCycle, cycleIntervalMs);
	}
	function detailsToggleSave(event) {
		if(!event || !event.target) return;
		//saveData(event.target.id + ".open", event.newState.startsWith("open"));
		saveData(event.target.id + ".open", event.target.open);
	}
	function chkWpRunningClick(event) {
		wpRunning = chkWpRunning.checked;
		saveData("wpRunning", wpRunning);
	}

	function loadState() {
		try {
			storageCanWrite = false;
			const retrieve = function(field, continuation) {
				let s = localStorage.getItem("gameIdle." + field);
				if(!s) s = localStorage.getItem(field);
				if(s) continuation(JSON.parse(s));
			};
			retrieve("gameRunning", v => {gameRunning = v;});
			//retrieve("counter", v => {setCounter(v);});
			//retrieve("counterInc", v => {setCounterInc(v);});
			retrieve("counter", v => {gameState.counter = v;});
			retrieve("counterInc", v => {gameState.counterInc = v;});
			retrieve("cycleInterval", v => {cycleIntervalMs = 1000 * v;});
			retrieve("rndArticleBuffer", v => {rndArticleBuffer = v;});
			retrieve("boxWpRndArticle.open", v => {boxWpRndArticle.open = v;});
			retrieve("wpRunning", v => {wpRunning = v;});
		} finally {
			storageCanWrite = true;
		}
	}
	/* function pageLoad(event) {
	} */
	function pageReady(event) {
		document.documentElement.style.setProperty("--hue-phase", Math.random() + "turn");

		//load HTML element references (renders document.getElementById unnecessary)
		for(let s of document.querySelectorAll("[id]"))
			window[s.id] = s;

		btnGameReset.addEventListener("click", btnGameResetClick);
		//txtParam01.addEventListener("input", txtParam01Input);

		try {
			loadState();
		} catch(error) {
		}
		chkGameRunning.checked = gameRunning;
		chkWpRunning.checked = wpRunning;
		chkGameRunning.addEventListener("click", chkGameRunningClick);
		boxWpRndArticle.addEventListener("toggle", detailsToggleSave);
		chkWpRunning.addEventListener("click", chkWpRunningClick);

		loadTrades(lstTrades);

		WpRndNextArticle();
		if(gameRunning) idleTimer = setTimeout(idleCycle, cycleIntervalMs);
	}
	//window.addEventListener("DOMContentLoaded", pageLoad);
	window.addEventListener("load", pageReady);
	/*]]>*/</script>
</head>
<body>
	<h1>Idol machine<br />
		<small>the Game</small></h1>
	<p>Simple to learn, hard to master. Relentlessly unrewarding. Insanely addictive. Made with laziness by idlelaters of @, for idlelaters.</p>
	<p><button id="btnGameReset">Reset game state</button> <input type="checkbox" id="chkGameRunning" checked="checked" /><label for="chkGameRunning">Run game</label></p>
	<p>The counter: <output id="outCounter">0</output>.</p>
	<p>The counter increment: <output id="outCounterInc">1</output>.</p>
	<!-- <p>The parameter: <input type="number" id="txtParam01" step="1" value="1" />.</p> -->
	<details open="open">
		<summary>Trading</summary>
		<div class="details-main">
			<ul id="lstTrades" class="trades-list">
				<!-- <li>False reward <button>Order</button>
					<ul class="trade-features-list">
						<li><span class="field">cost:</span> <span class="value">counter -256</span></li>
						<li><span class="field">reward:</span> <span class="value">counterInc 1</span></li>
					</ul>
				</li> -->
			</ul>
		</div>
	</details>
	<details id="boxWpRndArticle" open="open">
		<summary>Random Wikipedia article: <output id="outWpRndArticle"></output>.</summary>
		<div class="details-main">
			<p><input type="checkbox" id="chkWpRunning" checked="checked" /><label for="chkWpRunning">Keep changing articles</label></p>
			<ul id="wpRndInfoCard"></ul>
			<p>History:</p>
			<ol id="lstWpRndHistory"></ol>
		</div>
	</details>
</body>
